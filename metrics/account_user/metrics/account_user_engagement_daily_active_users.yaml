id: account_user_engagement_daily_active_users
name: Account User - Engagement - Daily Active Users
description: Daily active account users
product: account_user
category: engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Daily active account users
  technical: Count of distinct entities meeting daily_active_users criteria from account
    user data sources.
source: ACCOUNT_USER_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ACCOUNT_USER_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN DAILY_ACTIVE_USERS IS NOT NULL THEN 1\n            ELSE 0\n        END\
  \ AS is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ACCOUNT_USER_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS daily_active_users\nFROM base_metrics\nWHERE is_active = 1"
tags:
- engagement
- engagement
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
