id: account_user_engagement_rate
name: Account User Engagement Rate
description: Percentage of registered users who are active.
product: account_user
category: engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Share of users engaged with the platform.
  technical: active_users / registered_users * 100
source: PRODUCT_TABLES
sql_template: SELECT ROUND(100.0 * COUNT(CASE WHEN LAST_LOGIN >= DATEADD(DAY, -30,
  CURRENT_DATE()) THEN USER_ID END) / NULLIF(COUNT(USER_ID), 0), 2) FROM USERS
tags:
- engagement
- rate-metric
- adoption-rate
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
