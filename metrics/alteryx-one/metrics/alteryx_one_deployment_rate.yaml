id: alteryx_one_deployment_rate
name: Alteryx One Deployment Rate
description: '% of accounts that have deployed workflows.'
product: alteryx-one
category: adoption
status: active
freshness: daily
grain: point_in_time
definition:
  business: Accounts moving from build to production.
  technical: Accounts with DEPLOYED_WORKFLOWS >= 1 / total accounts * 100.
source: ALTERYX_ONE_TABLES
sql_template: SELECT ROUND(100.0 * COUNT(CASE WHEN DEPLOYED_WORKFLOWS >= 1 THEN ACCOUNT_ID
  END) / NULLIF(COUNT(ACCOUNT_ID), 0), 2) FROM ALTERYX_ONE_ACCOUNTS
tags:
- adoption
- adoption-rate
- deployment
