id: copilot_accounts_with_workflow
name: Copilot Accounts with Workflow Usage
description: Number of accounts with Copilot chat activity AND at least one workflow
  usage.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Accounts that have both chat interactions and successfully used Copilot
    to create or modify workflows.
  technical: Count of distinct billing_account_id_raw where chat_id IS NOT NULL AND
    workflow_id IS NOT NULL AND workflow_id <> ''.
source: COPILOT_VIEWS
sql_template: "SELECT COUNT(DISTINCT CASE\n    WHEN chat_id IS NOT NULL\n     AND\
  \ workflow_id IS NOT NULL\n     AND workflow_id <> ''\n    THEN billing_account_id_raw\n\
  END) AS accounts_with_at_least_1_workflow\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  WHERE license_type = 'Purchase'\n  AND user_type = 'aacp'\n  AND billing_account_id_raw\
  \ IS NOT NULL"
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
