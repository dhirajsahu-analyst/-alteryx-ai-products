id: copilot_adoption_eligible_users
name: Copilot Adoption - Eligible Users
description: 'Number of users eligible for Copilot: Purchase, 2025 pricing, Enterprise/Professional,
  ACTIVATED, enabled, Designer activated, version 2025.2+.'
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Users with full Copilot eligibility (denominator for adoption rate).
  technical: Count of distinct USER_ID_RAW meeting all eligibility criteria.
source: COPILOT_VIEWS
sql_template: "SELECT COUNT(DISTINCT USER_ID_RAW) AS eligible_users\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  WHERE LICENSE_TYPE = 'Purchase'\n  AND PRICING_AND_PACKAGING = '2025'\n  AND ACCOUNT_EDITION\
  \ IN ('Enterprise', 'Professional')\n  AND STATUS = 'ACTIVATED'\n  AND ALTERYX_USER_EMAIL\
  \ IS NOT NULL\n  AND COPILOT_ENABLED = TRUE\n  AND DESIGNER_ACTIVATION_STATUS =\
  \ TRUE\n  AND DESIGNER_OFFLINE_ACTIVATION = FALSE\n  AND TRY_TO_DECIMAL(MAXIMUM_RAW_PRODUCT_VERSION,\
  \ 10, 2) >= 2025.2"
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
