id: copilot_engaged_accounts
name: Copilot Engaged Accounts
description: Number of accounts where users have at least 5 Copilot conversations
  (indicating engagement).
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: High-engagement accounts with users demonstrating strong adoption through
    multiple conversations.
  technical: Count of accounts with users having COUNT(DISTINCT conversation_id) >=
    5 within the account.
source: COPILOT_VIEWS
sql_template: "WITH engaged_accounts AS (\n    SELECT\n        billing_account_id_raw\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  \    WHERE license_type = 'Purchase'\n      AND user_type = 'aacp'\n      AND chat_id\
  \ IS NOT NULL\n      AND billing_account_id_raw IS NOT NULL\n    GROUP BY\n    \
  \    billing_account_id_raw,\n        created_by_id\n    HAVING COUNT(DISTINCT conversation_id)\
  \ >= 5\n)\nSELECT COUNT(DISTINCT CASE\n    WHEN billing_account_id_raw IN (\n  \
  \      SELECT billing_account_id_raw\n        FROM engaged_accounts\n    )\n   \
  \ THEN billing_account_id_raw\nEND) AS engaged_accounts\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  WHERE license_type = 'Purchase'\n  AND user_type = 'aacp'\n  AND billing_account_id_raw\
  \ IS NOT NULL"
tags:
- copilot
- engagement
- metrics
