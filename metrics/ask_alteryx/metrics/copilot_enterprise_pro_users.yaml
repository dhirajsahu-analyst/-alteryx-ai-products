id: copilot_enterprise_pro_users
name: Copilot Enterprise/Professional Users
description: Count of users with Purchase license, 2025 pricing, Enterprise or Professional
  edition, and ACTIVATED status.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: 'Base tier of user eligibility: users from target account tiers with active
    status.'
  technical: Count of distinct USER_ID_RAW meeting all edition, license, and status
    criteria.
source: COPILOT_VIEWS
sql_template: "SELECT COUNT(DISTINCT CASE\n    WHEN LICENSE_TYPE = 'Purchase'\n  \
  \   AND PRICING_AND_PACKAGING = '2025'\n     AND ACCOUNT_EDITION IN ('Enterprise',\
  \ 'Professional')\n     AND STATUS = 'ACTIVATED'\n     AND ALTERYX_USER_EMAIL IS\
  \ NOT NULL\n    THEN USER_ID_RAW\nEND) AS ENTERPRISE_PRO_USERS\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT"
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
