id: copilot_month_year
name: Copilot Account Funnel - Month
description: Reporting month for account eligibility funnel (DATE GRAIN for monthly
  tracking).
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: The month dimension for monthly account-level Copilot eligibility reporting.
  technical: YEAR_MONTH cast to DATE, representing the first day of the reporting
    month.
source: COPILOT_VIEWS
sql_template: "SELECT YEAR_MONTH::DATE AS MONTH_YEAR\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT\n\
  WHERE PRODUCT_NAME = 'ALTERYX'\n  AND LICENSE_TYPE = 'Purchase'\n  AND YEAR_MONTH\
  \ > '2026-01-01'\nGROUP BY YEAR_MONTH::DATE\nORDER BY YEAR_MONTH::DATE DESC"
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
