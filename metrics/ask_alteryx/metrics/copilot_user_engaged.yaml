id: copilot_user_engaged
name: Copilot Engaged Users
description: Number of users with 5+ Copilot conversations (indicating engagement).
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: High-engagement users demonstrating strong adoption through multiple conversations.
  technical: Count of distinct USER_ID_RAW having COUNT(DISTINCT CONVERSATION_ID)
    >= 5.
source: COPILOT_VIEWS
sql_template: "WITH engaged_users AS (\n    SELECT\n        USER_ID_RAW\n    FROM\
  \ DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n    WHERE\
  \ LICENSE_TYPE = 'Purchase'\n      AND USER_TYPE = 'aacp'\n      AND USER_EMAIL\
  \ IS NOT NULL\n      AND CHAT_ID IS NOT NULL\n    GROUP BY USER_ID_RAW\n    HAVING\
  \ COUNT(DISTINCT CONVERSATION_ID) >= 5\n)\nSELECT COUNT(DISTINCT CASE\n    WHEN\
  \ USER_ID_RAW IN (\n        SELECT USER_ID_RAW\n        FROM engaged_users\n   \
  \ )\n    THEN USER_ID_RAW\nEND) AS ENGAGED_USERS\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  WHERE LICENSE_TYPE = 'Purchase'\n  AND USER_TYPE = 'aacp'\n  AND USER_EMAIL IS NOT\
  \ NULL"
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
