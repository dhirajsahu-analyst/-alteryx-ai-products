id: copilot_user_onboarded
name: Copilot Onboarded Users
description: Total number of users with any Copilot activity (Purchase license, aacp
  user type).
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: All users who have engaged with Copilot in any way.
  technical: Count of distinct USER_ID_RAW from COPILOT_ACTIVITY_USAGE_AT with Purchase
    license and aacp user type.
source: COPILOT_VIEWS
sql_template: "SELECT COUNT(DISTINCT USER_ID_RAW) AS ONBOARDED_USERS\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  WHERE LICENSE_TYPE = 'Purchase'\n  AND USER_TYPE = 'aacp'\n  AND USER_EMAIL IS NOT\
  \ NULL"
tags:
- copilot
- engagement
- metrics
