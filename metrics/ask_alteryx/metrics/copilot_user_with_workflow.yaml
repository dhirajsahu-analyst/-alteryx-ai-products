id: copilot_user_with_workflow
name: Copilot Users with Workflow Usage
description: Number of users with Copilot chat activity AND at least one workflow
  usage.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Users who have both engaged in chat and applied Copilot to workflow creation.
  technical: Count of distinct USER_ID_RAW where CHAT_ID IS NOT NULL AND WORKFLOW_ID
    IS NOT NULL AND WORKFLOW_ID <> ''.
source: COPILOT_VIEWS
sql_template: "SELECT COUNT(DISTINCT CASE\n    WHEN CHAT_ID IS NOT NULL\n     AND\
  \ WORKFLOW_ID IS NOT NULL\n     AND WORKFLOW_ID <> ''\n    THEN USER_ID_RAW\nEND)\
  \ AS USERS_WITH_AT_LEAST_1_WORKFLOW\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  WHERE LICENSE_TYPE = 'Purchase'\n  AND USER_TYPE = 'aacp'\n  AND USER_EMAIL IS NOT\
  \ NULL"
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
