id: designer_engagement_daily_active_users
name: Designer - Engagement - Daily Active Users
description: Daily active Designer users
product: designer
category: engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Daily active Designer users
  technical: Count of distinct entities meeting daily_active_users criteria from designer
    data sources.
source: DESIGNER_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN DAILY_ACTIVE_USERS IS NOT NULL THEN 1\n            ELSE 0\n        END\
  \ AS is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS daily_active_users\nFROM base_metrics\nWHERE is_active = 1"
tags:
- engagement
- engagement
