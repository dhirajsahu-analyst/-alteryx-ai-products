id: designer_engagement_workflow_creation
name: Designer - Engagement - Workflow Creation
description: Daily workflow creations
product: designer
category: engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Daily workflow creations
  technical: Count of distinct entities meeting workflow_creation criteria from designer
    data sources.
source: DESIGNER_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN WORKFLOW_CREATION IS NOT NULL THEN 1\n            ELSE 0\n        END\
  \ AS is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS workflow_creation\nFROM base_metrics\nWHERE is_active = 1"
tags:
- engagement
- engagement
