id: designer_funnel_adoption_installed
name: Designer - Funnel Adoption - Installed
description: Users with Designer installed
product: designer
category: funnel_adoption
status: active
freshness: daily
grain: point_in_time
definition:
  business: Users with Designer installed
  technical: Count of distinct entities meeting installed criteria from designer data
    sources.
source: DESIGNER_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN INSTALLED IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT\n    WHERE\
  \ CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS installed\n\
  FROM base_metrics\nWHERE is_active = 1"
tags:
- funnel_adoption
- funnel
- conversion
- adoption
- rate-metric
