id: designer_health_support_ticket_rate
name: Designer - Health - Support Ticket Rate
description: Support ticket rate per user
product: designer
category: health
status: active
freshness: daily
grain: point_in_time
definition:
  business: Support ticket rate per user
  technical: Count of distinct entities meeting support_ticket_rate criteria from
    designer data sources.
source: DESIGNER_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN SUPPORT_TICKET_RATE IS NOT NULL THEN 1\n            ELSE 0\n        END\
  \ AS is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS support_ticket_rate\nFROM base_metrics\nWHERE is_active = 1"
tags:
- health
- health
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
