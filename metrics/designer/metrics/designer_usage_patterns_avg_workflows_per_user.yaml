id: designer_usage_patterns_avg_workflows_per_user
name: Designer - Usage Patterns - Avg Workflows Per User
description: Average workflows per user
product: designer
category: usage_patterns
status: active
freshness: daily
grain: point_in_time
definition:
  business: Average workflows per user
  technical: Count of distinct entities meeting avg_workflows_per_user criteria from
    designer data sources.
source: DESIGNER_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN AVG_WORKFLOWS_PER_USER IS NOT NULL THEN 1\n            ELSE 0\n     \
  \   END AS is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS avg_workflows_per_user\nFROM base_metrics\nWHERE is_active = 1"
tags:
- usage_patterns
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
