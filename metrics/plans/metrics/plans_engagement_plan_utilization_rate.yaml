id: plans_engagement_plan_utilization_rate
name: Plans - Engagement - Plan Utilization Rate
description: Plan feature utilization rate
product: plans
category: engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Plan feature utilization rate
  technical: Count of distinct entities meeting plan_utilization_rate criteria from
    plans data sources.
source: PLANS_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN PLAN_UTILIZATION_RATE IS NOT NULL THEN 1\n            ELSE 0\n      \
  \  END AS is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS plan_utilization_rate\nFROM base_metrics\nWHERE is_active = 1"
tags:
- engagement
- engagement
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
