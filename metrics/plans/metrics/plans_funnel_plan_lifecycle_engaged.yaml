id: plans_funnel_plan_lifecycle_engaged
name: Plans - Funnel Plan Lifecycle - Engaged
description: Engaged plan users
product: plans
category: funnel_plan_lifecycle
status: active
freshness: daily
grain: point_in_time
definition:
  business: Engaged plan users
  technical: Count of distinct entities meeting engaged criteria from plans data sources.
source: PLANS_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN ENGAGED IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT\n    WHERE CREATED_AT\
  \ >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS engaged\nFROM\
  \ base_metrics\nWHERE is_active = 1"
tags:
- funnel_plan_lifecycle
- funnel
- conversion
