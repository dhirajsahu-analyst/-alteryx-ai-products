id: trial_engagement_daily_active
name: Trial - Engagement - Daily Active
description: Daily active trial users
product: trial
category: engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Daily active trial users
  technical: Count of distinct entities meeting daily_active criteria from trial data
    sources.
source: TRIAL_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN DAILY_ACTIVE IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_USAGE_AT\n    WHERE CREATED_AT\
  \ >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS daily_active\n\
  FROM base_metrics\nWHERE is_active = 1"
tags:
- engagement
- engagement
maintainer: product-insights@alteryx.com
