id: trial_funnel_signup_prospect
name: Trial - Funnel Signup - Prospect
description: Total trial signups initiated
product: trial
category: funnel_signup
status: active
freshness: daily
grain: point_in_time
definition:
  business: Total trial signups initiated
  technical: Count of distinct entities meeting prospect criteria from trial data
    sources.
source: TRIAL_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN PROSPECT IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_USAGE_AT\n    WHERE CREATED_AT\
  \ >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS prospect\nFROM\
  \ base_metrics\nWHERE is_active = 1"
tags:
- funnel_signup
- funnel
- conversion
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
