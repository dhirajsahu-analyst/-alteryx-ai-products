id: trial_health_dropout_rate
name: Trial - Health - Dropout Rate
description: Trial dropout rate
product: trial
category: health
status: active
freshness: daily
grain: point_in_time
definition:
  business: Trial dropout rate
  technical: Count of distinct entities meeting dropout_rate criteria from trial data
    sources.
source: TRIAL_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN DROPOUT_RATE IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_USAGE_AT\n    WHERE CREATED_AT\
  \ >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS dropout_rate\n\
  FROM base_metrics\nWHERE is_active = 1"
tags:
- health
- health
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
