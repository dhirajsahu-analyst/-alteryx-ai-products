id: version_adoption_adoption_feature_adoption
name: Version Adoption - Adoption - Feature Adoption
description: Key feature adoption rate
product: version_adoption
category: adoption
status: active
freshness: daily
grain: point_in_time
definition:
  business: Key feature adoption rate
  technical: Count of distinct entities meeting feature_adoption criteria from version
    adoption data sources.
source: VERSION_ADOPTION_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.VERSION_DEPLOYMENT_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN FEATURE_ADOPTION IS NOT NULL THEN 1\n            ELSE 0\n        END\
  \ AS is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.VERSION_DEPLOYMENT_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS feature_adoption\nFROM base_metrics\nWHERE is_active = 1"
tags:
- adoption
- adoption
- rate-metric
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
