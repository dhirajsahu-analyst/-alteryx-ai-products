id: version_adoption_distribution_version_2_distribution
name: Version Adoption - Distribution - Version 2 Distribution
description: Current version 2.x adoption
product: version_adoption
category: distribution
status: active
freshness: daily
grain: point_in_time
definition:
  business: Current version 2.x adoption
  technical: Count of distinct entities meeting version_2_distribution criteria from
    version adoption data sources.
source: VERSION_ADOPTION_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.VERSION_DEPLOYMENT_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN VERSION_2_DISTRIBUTION IS NOT NULL THEN 1\n            ELSE 0\n     \
  \   END AS is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.VERSION_DEPLOYMENT_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS version_2_distribution\nFROM base_metrics\nWHERE is_active = 1"
tags:
- distribution
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
