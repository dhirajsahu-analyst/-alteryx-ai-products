id: version_adoption_funnel_eligibility_aware
name: Version Adoption - Funnel Eligibility - Aware
description: Users aware of new version
product: version_adoption
category: funnel_eligibility
status: active
freshness: daily
grain: point_in_time
definition:
  business: Users aware of new version
  technical: Count of distinct entities meeting aware criteria from version adoption
    data sources.
source: VERSION_ADOPTION_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.VERSION_DEPLOYMENT_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN AWARE IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.VERSION_DEPLOYMENT_AT\n    WHERE\
  \ CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS aware\n\
  FROM base_metrics\nWHERE is_active = 1"
tags:
- funnel_eligibility
- funnel
- conversion
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
