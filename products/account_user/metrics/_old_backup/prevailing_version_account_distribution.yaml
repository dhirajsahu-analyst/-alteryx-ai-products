id: prevailing_version_account_distribution
name: Prevailing Version Account Distribution
description: Monthly distribution of accounts across version buckets (2024+, <=2023)
  showing version concentration
product: account_user
status: validated
category: adoption
definition:
  business: Version distribution metric helping understand customer base composition
    and upgrade urgency
  technical: ''
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "WITH BASE AS (\n    SELECT\n        DATE(MONTH) AS MONTH,\n       \
  \ PRODUCT_ID,\n        CASE\n            WHEN PRODUCT_ID = 'Alteryx Designer' AND\
  \ \"Designer Prevailing VERSION\" >= 2024\n                THEN TO_VARCHAR(\"Designer\
  \ Prevailing VERSION\")\n            WHEN PRODUCT_ID = 'Alteryx Server' AND \"Server\
  \ Prevailing VERSION\" >= 2024\n                THEN TO_VARCHAR(\"Server Prevailing\
  \ VERSION\")\n            ELSE '<=2023'\n        END AS PREVAILING_VERSION_BUCKET,\n\
  \        BILLING_ACCOUNT_ID\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION\n\
  \    WHERE PRODUCT_ID IN ('Alteryx Designer', 'Alteryx Server')\n      AND MONTH\
  \ >= DATEADD(MONTH, -6, LAST_DAY(CURRENT_DATE - INTERVAL '1 month'))\n)\nSELECT\n\
  \    MONTH,\n    PRODUCT_ID,\n    PREVAILING_VERSION_BUCKET,\n    COUNT(DISTINCT\
  \ BILLING_ACCOUNT_ID) AS TOTAL_ACCOUNTS,\n    ROUND(\n        COUNT(DISTINCT BILLING_ACCOUNT_ID)\
  \ /\n        NULLIF(SUM(COUNT(DISTINCT BILLING_ACCOUNT_ID)) OVER (PARTITION BY DATE(MONTH),\
  \ PRODUCT_ID), 0),\n        2\n    ) AS ACCOUNT_PERCENT\nFROM BASE\nGROUP BY MONTH,\
  \ PRODUCT_ID, PREVAILING_VERSION_BUCKET\nORDER BY MONTH DESC, PRODUCT_ID;"
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- account_user_001
- account_user_011
maintainer: analytics@alteryx.com
tags:
- adoption
- account_user
