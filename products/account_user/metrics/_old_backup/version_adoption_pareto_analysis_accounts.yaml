id: version_adoption_pareto_analysis_accounts
name: Version Adoption Pareto Analysis (Accounts)
description: Cumulative percentage distribution showing how many versions account
  for 80% of customer base
product: account_user
status: validated
category: adoption
definition:
  business: Pareto analysis identifying critical versions for support focus and deprecation
    planning
  technical: with running cumulative percentages
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "WITH BASE AS (\n    SELECT\n        PRODUCT_ID,\n        CASE\n   \
  \         WHEN PRODUCT_ID = 'Alteryx Designer' THEN \"Designer Prevailing VERSION\"\
  \n            WHEN PRODUCT_ID = 'Alteryx Server'   THEN \"Server Prevailing VERSION\"\
  \n        END AS PREVAILING_VERSION,\n        SFDC_ACCOUNT_CID\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION\n\
  \    WHERE PRODUCT_ID IN ('Alteryx Designer', 'Alteryx Server')\n      AND MONTH\
  \ >= DATE_TRUNC('MONTH', DATEADD('MONTH', -1, CURRENT_DATE))\n      AND MONTH <\
  \  DATE_TRUNC('MONTH', CURRENT_DATE)\n)\nSELECT\n    PRODUCT_ID,\n    PREVAILING_VERSION,\n\
  \    COUNT(DISTINCT SFDC_ACCOUNT_CID) AS TOTAL_ACCOUNTS,\n    ROUND(\n        SUM(COUNT(DISTINCT\
  \ SFDC_ACCOUNT_CID)) OVER (\n            PARTITION BY PRODUCT_ID ORDER BY COUNT(DISTINCT\
  \ SFDC_ACCOUNT_CID) DESC ROWS UNBOUNDED PRECEDING\n        ) / SUM(COUNT(DISTINCT\
  \ SFDC_ACCOUNT_CID)) OVER (PARTITION BY PRODUCT_ID),\n        4\n    ) AS RUNNING_PCT_OF_TOTAL\n\
  FROM BASE\nGROUP BY PRODUCT_ID, PREVAILING_VERSION\nORDER BY PRODUCT_ID, TOTAL_ACCOUNTS\
  \ DESC;"
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on: []
