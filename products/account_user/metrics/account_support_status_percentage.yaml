id: account_support_status_percentage
name: Account Support Status Percentage
description: Percentage of accounts by support status (Supported vs Unsupported) by
  product
product: account_user
status: validated
category: adoption
definition:
  business: Support health metric tracking upgrade rates and technical debt across
    customer base
  technical: Calculated from ACCOUNT_SUPPORTED_UNSUPPORTED_SUMMARY_MONTHLY_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    DATE(MONTH) AS MONTH,\n    PRODUCT_ID,\n    SUPPORTED_UNSUPPORTED_PREVAILING_VERSION,\n\
  \    COUNT(DISTINCT SFDC_ACCOUNT_CID) AS TOTAL_ACCOUNTS,\n    ROUND(\n        COUNT(DISTINCT\
  \ CASE WHEN SUPPORTED_UNSUPPORTED_PREVAILING_VERSION = 'Supported' THEN SFDC_ACCOUNT_CID\
  \ END)\n        / NULLIF(SUM(COUNT(DISTINCT SFDC_ACCOUNT_CID)) OVER (PARTITION BY\
  \ MONTH, PRODUCT_ID), 0),\n        4\n    ) AS PCT_SUPPORTED\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION\n\
  WHERE PRODUCT_ID IN ('Alteryx Designer', 'Alteryx Server')\n  AND MONTH >= DATE_TRUNC('MONTH',\
  \ DATEADD('MONTH', -6, CURRENT_DATE))\n  AND MONTH <  DATE_TRUNC('MONTH', CURRENT_DATE)\n\
  GROUP BY MONTH, PRODUCT_ID, SUPPORTED_UNSUPPORTED_PREVAILING_VERSION\nORDER BY MONTH\
  \ DESC, PRODUCT_ID;"
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- account_user_001
- account_user_002
maintainer: analytics@alteryx.com
