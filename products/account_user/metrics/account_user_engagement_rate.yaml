category: engagement
definition:
  business: Share of users engaged with the platform.
  technical: active_users / registered_users * 100
description: Percentage of registered users who are active.
freshness: daily
grain: point_in_time
id: account_user_engagement_rate
last_updated: '2026-08-05'
maintainer: product-insights@alteryx.com
name: Account User Engagement Rate
product: account_user
source: PRODUCT_TABLES
sql_template: SELECT ROUND((COUNT(DISTINCT CASE WHEN ENGAGEMENT_SCORE >= 50 THEN USER_ID
  END) / NULLIF(COUNT(DISTINCT USER_ID), 0)) * 100, 2) AS ENGAGEMENT_RATE FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.USER_LIFECYCLE_AT
  WHERE STATUS = 'ACTIVE'
status: active
tags:
- engagement
- rate-metric
- adoption-rate
version: '1.0'
