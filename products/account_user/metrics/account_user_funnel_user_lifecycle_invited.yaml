id: account_user_funnel_user_lifecycle_invited
name: Account User - Funnel User Lifecycle - Invited
description: Users invited to account
product: account_user
category: funnel_user_lifecycle
status: active
freshness: daily
grain: point_in_time
definition:
  business: Users invited to account
  technical: Count of distinct entities meeting invited criteria from account user
    data sources.
source: ACCOUNT_USER_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ACCOUNT_USER_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN INVITED IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ACCOUNT_USER_AT\n    WHERE CREATED_AT\
  \ >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS invited\nFROM\
  \ base_metrics\nWHERE is_active = 1"
tags:
- funnel_user_lifecycle
- funnel
- conversion
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
