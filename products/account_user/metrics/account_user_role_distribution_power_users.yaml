id: account_user_role_distribution_power_users
name: Account User - Role Distribution - Power Users
description: Power users count
product: account_user
category: role_distribution
status: active
freshness: daily
grain: point_in_time
definition:
  business: Power users count
  technical: Count of distinct entities meeting power_users criteria from account
    user data sources.
source: ACCOUNT_USER_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ACCOUNT_USER_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN POWER_USERS IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ACCOUNT_USER_AT\n    WHERE CREATED_AT\
  \ >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS power_users\n\
  FROM base_metrics\nWHERE is_active = 1"
tags:
- role_distribution
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
