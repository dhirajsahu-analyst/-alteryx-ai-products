id: account_user_role_distribution_viewers
name: Account User - Role Distribution - Viewers
description: Viewer-only users count
product: account_user
category: role_distribution
status: active
freshness: daily
grain: point_in_time
definition:
  business: Viewer-only users count
  technical: Count of distinct entities meeting viewers criteria from account user
    data sources.
source: ACCOUNT_USER_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ACCOUNT_USER_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN VIEWERS IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ACCOUNT_USER_AT\n    WHERE CREATED_AT\
  \ >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS viewers\nFROM\
  \ base_metrics\nWHERE is_active = 1"
tags:
- role_distribution
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
