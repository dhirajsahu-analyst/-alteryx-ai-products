id: supported_user_count
name: Supported User Count
description: Monthly count of users on supported versions by product
product: account_user
status: validated
category: volume
definition:
  business: User-level support coverage metric for capacity and support planning
  technical: From MACHINE_AND_USER_SUPPORTED_UNSUPPORTED_SUMMARY_MONTHLY_VIEW, supported users only
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    MONTH,
    PRODUCT_ID,
    TOTAL_USERS AS supported_users,
    PCT_SUPPORTED_USER,
    LAG(TOTAL_USERS) OVER (PARTITION BY PRODUCT_ID ORDER BY MONTH) AS prev_month_users,
    ROUND((TOTAL_USERS - LAG(TOTAL_USERS) OVER (PARTITION BY PRODUCT_ID ORDER BY MONTH)) /
          NULLIF(LAG(TOTAL_USERS) OVER (PARTITION BY PRODUCT_ID ORDER BY MONTH), 0) * 100, 2) AS mom_growth_pct
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.MACHINE_AND_USER_SUPPORTED_UNSUPPORTED_SUMMARY_MONTHLY_VIEW
  WHERE SUPPORTED_UNSUPPORTED = 'Supported'
  ORDER BY MONTH DESC, PRODUCT_ID
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters:
- SUPPORTED_UNSUPPORTED = 'Supported'
depends_on: []
related_metrics:
- account_user_001
- account_user_005
maintainer: analytics@alteryx.com
tags:
- volume
- account_user
last_updated: '2026-08-03'
version: '1.0'
