id: unsupported_machine_count
name: Unsupported Machine Count
description: Monthly count of machines running unsupported versions by product
product: account_user
status: validated
category: volume
definition:
  business: At-risk infrastructure metric identifying machines requiring immediate attention
  technical: From MACHINE_AND_USER_SUPPORTED_UNSUPPORTED_SUMMARY_MONTHLY_VIEW, unsupported machines
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    MONTH,
    PRODUCT_ID,
    TOTAL_MACHINES AS unsupported_machines,
    LAG(TOTAL_MACHINES) OVER (PARTITION BY PRODUCT_ID ORDER BY MONTH) AS prev_month_machines,
    ROUND((TOTAL_MACHINES - LAG(TOTAL_MACHINES) OVER (PARTITION BY PRODUCT_ID ORDER BY MONTH)), 2) AS machine_change
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.MACHINE_AND_USER_SUPPORTED_UNSUPPORTED_SUMMARY_MONTHLY_VIEW
  WHERE SUPPORTED_UNSUPPORTED = 'Unsupported'
  ORDER BY MONTH DESC, PRODUCT_ID
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters:
- SUPPORTED_UNSUPPORTED = 'Unsupported'
depends_on: []
related_metrics:
- account_user_002
- account_user_009
maintainer: analytics@alteryx.com
tags:
- volume
- account_user
last_updated: '2026-08-03'
version: '1.0'
