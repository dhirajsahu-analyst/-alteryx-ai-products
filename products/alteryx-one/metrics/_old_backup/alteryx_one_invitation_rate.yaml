id: alteryx_one_invitation_rate
name: Alteryx One Invitation Rate
description: Percentage of available seats that have been sent invitations. Measures
  outreach progress in activation funnel.
product: alteryx_one
status: validated
category: activation
definition:
  business: Percentage of available seats that have been sent invitations. Measures
    outreach progress in activation funnel.
  technical: ''
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    YEAR_MONTH,\n      SUM(AVAILABLE_SEATS) as \"AVAILABLE_SEATS\"\
  ,\n      SUM(INVITED_FULL_USERS+INVITED_BASIC_USERS) as \"INVITED_USERS\",\n   \
  \   SUM(ACTIVATED_FULL_USERS+ACTIVATED_BASIC_USERS) as \"ACTIVATED_USER\",\n   \
  \   (SUM(AVAILABLE_SEATS)/NULLIFZERO(SUM(AVAILABLE_SEATS))) AS \"PERCENTAGE_AVAILABLE_SEATS\"\
  ,\n      (SUM(INVITED_FULL_USERS+INVITED_BASIC_USERS)/NULLIFZERO(SUM(AVAILABLE_SEATS)))\
  \ AS \"PERCENTAGE_INVITED_USERS\",\n      (SUM(ACTIVATED_FULL_USERS+ACTIVATED_BASIC_USERS)/NULLIFZERO(SUM(AVAILABLE_SEATS)))\
  \ AS \"PERCENTAGE_ACTIVATED_USERS\"\n    FROM\n      DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT\n\
  \    WHERE\n     LICENSE_TYPE = 'Purchase'\n    AND PRICING_AND_PACKAGING = '2025'\n\
  \    AND YEAR_MONTH > DATEADD('YEAR', -1, YEAR_MONTH)\n    GROUP BY YEAR_MONTH\n\
  \    ORDER BY YEAR_MONTH DESC;"
queries: []
