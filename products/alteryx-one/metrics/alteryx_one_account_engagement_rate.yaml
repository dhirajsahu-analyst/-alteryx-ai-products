id: alteryx_one_account_engagement_rate
name: Alteryx One Account Engagement Rate
description: Percentage of active accounts with at least one highly engaged user.
product: alteryx_one
status: validated
category: engagement
definition:
  business: Percentage of active accounts with at least one highly engaged user.
  technical: From ALTERYX_ONE_ENGAGED_ACCOUNTS_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT YEAR_MONTH, \n    COUNT(DISTINCT CASE WHEN \"ENGAGED_USERS\"\
  >0 THEN BILLING_ACCOUNT_ID END) as \"TOTAL_ENGAGED_ACCOUNTS\",\n    (COUNT(DISTINCT\
  \ CASE WHEN \"ENGAGED_USERS\">0 THEN BILLING_ACCOUNT_ID END)/ COUNT(DISTINCT BILLING_ACCOUNT_ID))\
  \ as \"PERCENTAGE_ENGAGED_ACCOUNTS\"\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT\n\
  \    WHERE \n    LICENSE_TYPE = 'Purchase' \n    AND PRICING_AND_PACKAGING = '2025'\
  \  \n    AND YEAR_MONTH > DATEADD('YEAR', -1, YEAR_MONTH)  \n    GROUP BY YEAR_MONTH\
  \  \n    ORDER BY YEAR_MONTH DESC;"
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on: []
related_metrics: []
