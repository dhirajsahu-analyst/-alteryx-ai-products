id: alteryx_one_account_funnel_active
name: Alteryx One Account Funnel - Active
description: Accounts with at least one active user in the past 30 days.
product: alteryx-one
category: funnel
status: active
freshness: daily
grain: point_in_time
definition:
  business: Accounts with ongoing usage.
  technical: Count of accounts with ACTIVE_USERS >= 1 in current month.
source: ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
sql_template: 'SELECT YEAR_MONTH::DATE AS MONTH_YEAR, COUNT(DISTINCT CASE WHEN ACTIVE_USERS > 0 THEN BILLING_ACCOUNT_ID END) AS TOTAL_ACTIVE_ACCOUNTS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT WHERE LICENSE_TYPE = ''Purchase'' AND PRICING_AND_PACKAGING = ''2025'' AND YEAR_MONTH > DATEADD(''YEAR'', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE DESC'
tags:
- funnel
- funnel-stage
- account
- engagement
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
