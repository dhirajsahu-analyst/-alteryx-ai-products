id: alteryx_one_account_funnel_onboarded
name: Alteryx One Account Funnel - Onboarded
description: Accounts with at least one active user in first 30 days.
product: alteryx-one
category: funnel
status: active
freshness: daily
grain: point_in_time
definition:
  business: Accounts successfully onboarded with active usage.
  technical: Count of accounts with ACTIVE_USERS >= 1 in onboarding period.
source: ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
sql_template: 'SELECT YEAR_MONTH::DATE AS MONTH_YEAR, SUM(INVITED_FULL_USERS + INVITED_BASIC_USERS) AS INVITED_USERS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT WHERE LICENSE_TYPE = ''Purchase'' AND PRICING_AND_PACKAGING = ''2025'' AND YEAR_MONTH > DATEADD(''YEAR'', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE DESC'
tags:
- funnel
- funnel-stage
- account
- onboarding
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
