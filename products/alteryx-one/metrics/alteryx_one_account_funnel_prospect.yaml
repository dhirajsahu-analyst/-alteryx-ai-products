id: alteryx_one_account_funnel_prospect
name: Alteryx One Account Funnel - Prospect
description: Total accounts that have been provisioned or invited.
product: alteryx-one
category: funnel
status: active
freshness: daily
grain: point_in_time
definition:
  business: All accounts entered into Alteryx One system.
  technical: Count of unique accounts with CREATED_AT date.
source: ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
sql_template: 'SELECT YEAR_MONTH::DATE AS MONTH_YEAR, SUM(AVAILABLE_SEATS) AS AVAILABLE_SEATS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT WHERE LICENSE_TYPE = ''Purchase'' AND PRICING_AND_PACKAGING = ''2025'' AND YEAR_MONTH > DATEADD(''YEAR'', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE DESC'
tags:
- funnel
- funnel-stage
- account
- acquisition
