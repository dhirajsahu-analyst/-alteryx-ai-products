category: health
definition:
  business: Overall platform health assessment.
  technical: AVG(HEALTH_SCORE) where HEALTH_SCORE = activity*50% + adoption*30% +
    deployment*20%.
description: Average health score across all accounts (1-100).
freshness: daily
grain: point_in_time
id: alteryx_one_account_health_score
last_updated: '2026-08-05'
maintainer: product-insights@alteryx.com
name: Alteryx One Account Health Score
product: alteryx-one
source: ALTERYX_ONE_TABLES
sql_template: SELECT YEAR_MONTH::DATE AS MONTH_YEAR, ROUND(AVG(HEALTH_SCORE), 2) AS
  AVG_HEALTH_SCORE FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
  WHERE LICENSE_TYPE = 'Purchase' AND PRICING_AND_PACKAGING = '2025' AND YEAR_MONTH
  > DATEADD('YEAR', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE
  DESC
status: active
tags:
- health
- indicator
version: '1.0'
