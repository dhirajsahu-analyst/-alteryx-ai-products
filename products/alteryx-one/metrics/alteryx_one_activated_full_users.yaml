id: alteryx_one_activated_full_users
name: Alteryx One Activated Full Users
description: Count of successfully activated users with Full User role.
product: alteryx_one
status: validated
category: activation
definition:
  business: Count of successfully activated users with Full User role.
  technical: From ALTERYX_ONE_ACTIVATED_USERS_PER_USER_ROLE_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT YEAR_MONTH, \n    SUM(ACTIVATED_FULL_USERS) as \"ACTIVATED_FULL_USERS\"\
  ,\n    SUM(ACTIVATED_BASIC_USERS) as \"ACTIVATED_BASIC_USERS\",\n    SUM(ACTIVATED_VIEWER_USERS)\
  \ as \"ACTIVATED_VIEWER_USERS\",\n    SUM(ACTIVATED_ACCOUNT_ADMINS) as \"ACTIVATED_ACCOUNT_ADMINS\"\
  ,\n    SUM(ACTIVATED_WORKSPACE_ADMINS) as \"ACTIVATED_WORKSPACE_ADMINS\",\n    (SUM(ACTIVATED_FULL_USERS)/NULLIFZERO(SUM(ACTIVATED_USERS)))\
  \ AS \"PERCENTAGE_ACTIVATED_FULL_USERS\",\n    (SUM(ACTIVATED_BASIC_USERS)/NULLIFZERO(SUM(ACTIVATED_USERS)))\
  \ AS \"PERCENTAGE_ACTIVATED_BASIC_USERS\",\n    (SUM(ACTIVATED_VIEWER_USERS)/NULLIFZERO(SUM(ACTIVATED_USERS)))\
  \ AS \"PERCENTAGE_ACTIVATED_VIEWER_USERS\",\n    (SUM(ACTIVATED_ACCOUNT_ADMINS)/NULLIFZERO(SUM(ACTIVATED_USERS)))\
  \ AS \"PERCENTAGE_ACTIVATED_ACCOUNT_ADMINS\",\n    (SUM(ACTIVATED_WORKSPACE_ADMINS)/NULLIFZERO(SUM(ACTIVATED_USERS)))\
  \ AS \"PERCENTAGE_ACTIVATED_WORKSPACE_ADMINS\"\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT\n\
  \    WHERE LICENSE_TYPE = 'Purchase' \n    AND PRICING_AND_PACKAGING = '2025'  \n\
  \    AND YEAR_MONTH > DATEADD('YEAR', -1, YEAR_MONTH)  \n    GROUP BY YEAR_MONTH\
  \  \n    ORDER BY YEAR_MONTH DESC;"
