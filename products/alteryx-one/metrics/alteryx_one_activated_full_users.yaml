id: alteryx_one_activated_full_users
name: Alteryx One Activated Full Users
description: Full-access users who have logged in.
product: alteryx-one
category: activation
status: active
freshness: daily
grain: point_in_time
definition:
  business: Power users with full platform access.
  technical: Count of users with ROLE = 'FULL_USER' and LAST_LOGIN IS NOT NULL.
source: ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
sql_template: 'SELECT YEAR_MONTH::DATE AS MONTH_YEAR, SUM(ACTIVATED_FULL_USERS) AS ACTIVATED_FULL_USERS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT WHERE LICENSE_TYPE = 'Purchase' AND PRICING_AND_PACKAGING = '2025' AND YEAR_MONTH > DATEADD('YEAR', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE DESC'
tags:
- activation
- role-based
- full-user
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
