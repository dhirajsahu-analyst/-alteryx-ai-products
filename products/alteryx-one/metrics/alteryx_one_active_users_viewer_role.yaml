id: alteryx_one_active_users_viewer_role
name: Alteryx One Active Users - Viewer Role
description: Count of monthly active users with Viewer User role.
product: alteryx_one
status: validated
category: active_users
definition:
  business: Count of monthly active users with Viewer User role.
  technical: From ALTERYX_ONE_ACTIVE_USERS_PER_USER_ROLE_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT YEAR_MONTH, \n    SUM(ACTIVE_USERS_FULL_USER_ROLE) as \"MONTHLY_ACTIVE_USERS_FULL_USER_ROLE\"\
  ,\n    SUM(ACTIVE_USERS_BASIC_USER_ROLE) as \"MONTHLY_ACTIVE_USERS_BSIC_USER_ROLE\"\
  ,\n    SUM(ACTIVE_USERS_VIEWER_USER_ROLE) as \"MONTHLY_ACTIVE_USERS_VIEWER_USER_ROLE\"\
  ,\n    SUM(ACTIVE_USERS_ACCOUNT_ADMIN) as \"MONTHLY_ACTIVE_USERS_ACCOUNT_ADMIN\"\
  ,\n    SUM(ACTIVE_USERS_WORKSPACE_ADMIN) as \"MONTHLY_ACTIVE_USERS_WORKSPACE_ADMIN\"\
  \n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT\n\
  \    WHERE LICENSE_TYPE = 'Purchase' \n    AND PRICING_AND_PACKAGING = '2025'  \n\
  \    AND YEAR_MONTH > DATEADD('YEAR', -1, YEAR_MONTH)  \n    GROUP BY YEAR_MONTH\
  \  \n    ORDER BY YEAR_MONTH DESC;"
