category: health
definition:
  business: Account attrition metric.
  technical: Previously active but dormant accounts / previously active total * 100.
description: '% of previously active accounts with no activity last 60 days.'
freshness: daily
grain: point_in_time
id: alteryx_one_churn_rate
last_updated: '2026-08-05'
maintainer: product-insights@alteryx.com
name: Alteryx One Churn Rate
product: alteryx-one
source: ALTERYX_ONE_TABLES
sql_template: SELECT YEAR_MONTH::DATE AS MONTH_YEAR, ROUND((SUM(CASE WHEN CHURN_FLAG
  = 1 THEN 1 ELSE 0 END) / NULLIF(LAG(COUNT(DISTINCT BILLING_ACCOUNT_ID)) OVER (ORDER
  BY YEAR_MONTH::DATE), 0)) * 100, 2) AS CHURN_RATE FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
  WHERE LICENSE_TYPE = 'Purchase' AND PRICING_AND_PACKAGING = '2025' AND YEAR_MONTH
  > DATEADD('YEAR', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE
  DESC
status: active
tags:
- health
- churn-rate
version: '1.0'
