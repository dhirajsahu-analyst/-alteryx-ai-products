id: alteryx_one_closed_won_new_business
name: Alteryx One Closed Won New Business
description: Count of closed-won opportunities from new business (NB) acquisitions
  for Alteryx One.
product: alteryx_one
status: validated
category: sales
definition:
  business: Count of closed-won opportunities from new business (NB) acquisitions
    for Alteryx One.
  technical: From ALTERYX_ONE_CLOSED_WON_ACCOUNT_OPPORTUNITY_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT \n    SUM(CLOSED_WON_ALTERYX_ONE_OPPORTUNITY) AS CLOSED_WON_ALTERYX_ONE_OPPORTUNITY,\n\
  \    SUM(CASE WHEN OPP_COB_GROUP= 'ECUR' THEN  CLOSED_WON_ALTERYX_ONE_OPPORTUNITY\
  \ END) AS CLOSED_WON_ECUR_ALTERYX_ONE_OPPORTUNITY,\n    SUM(CASE WHEN OPP_COB_GROUP=\
  \ 'NB' THEN  CLOSED_WON_ALTERYX_ONE_OPPORTUNITY END) AS CLOSED_WON_NB_ALTERYX_ONE_OPPORTUNITY,\n\
  \    SUM(CASE WHEN OPP_COB_GROUP= 'OVERALL' THEN  CLOSED_WON_ALTERYX_ONE_ACCOUNTS\
  \ END) AS CLOSED_WON_ALTERYX_ONE_ACCOUNTS,\n    SUM(CASE WHEN OPP_COB_GROUP= 'ECUR'\
  \ THEN  CLOSED_WON_ALTERYX_ONE_ACCOUNTS END) AS CLOSED_WON_ECUR_ALTERYX_ONE_ACCOUNTS,\n\
  \    SUM(CASE WHEN OPP_COB_GROUP= 'NB' THEN  CLOSED_WON_ALTERYX_ONE_ACCOUNTS END)\
  \ AS CLOSED_WON_NB_ALTERYX_ONE_ACCOUNTS\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.TEL_STRAT.CLOSED_WON_AYX1_SUMMARY_VW;"
