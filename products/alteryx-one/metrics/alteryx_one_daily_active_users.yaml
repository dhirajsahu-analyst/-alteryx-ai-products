sql_template: SELECT YEAR_MONTH::DATE AS MONTH_YEAR, SUM(ACTIVE_FULL_USERS + ACTIVE_BASIC_USERS)
  AS DAILY_ACTIVE_USERS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
  WHERE LICENSE_TYPE = 'Purchase' AND PRICING_AND_PACKAGING = '2025' AND YEAR_MONTH
  > DATEADD('YEAR', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE
  DESC
