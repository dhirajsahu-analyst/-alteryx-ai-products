id: alteryx_one_deployed_google_edition_accounts
name: Alteryx One Deployed Google Cloud Edition Accounts
description: Count of deployed accounts on the Google Cloud edition.
product: alteryx_one
status: validated
category: deployment
definition:
  business: Count of deployed accounts on the Google Cloud edition.
  technical: ''
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT YEAR_MONTH ,\n    COUNT(DISTINCT BILLING_ACCOUNT_ID) as \"TOTAL_DEPLOYED_ACCOUNTS\"\
  ,\n    COUNT(DISTINCT CASE WHEN ACCOUNT_EDITION='Starter' THEN BILLING_ACCOUNT_ID\
  \ END) as \"TOTAL_DEPLOYED_STARTER_ACCOUNTS\",\n    COUNT(DISTINCT CASE WHEN ACCOUNT_EDITION='Professional'\
  \ THEN BILLING_ACCOUNT_ID END) as \"TOTAL_DEPLOYED_PROFESSIONAL_ACCOUNTS\",\n  \
  \  COUNT(DISTINCT CASE WHEN ACCOUNT_EDITION='Enterprise' THEN BILLING_ACCOUNT_ID\
  \ END) as \"TOTAL_DEPLOYED_ENTERPRISE_ACCOUNTS\",\n    COUNT(DISTINCT CASE WHEN\
  \ ACCOUNT_EDITION='AlteryxOneGoogle' THEN BILLING_ACCOUNT_ID END) as \"TOTAL_DEPLOYED_GOOGLE_EDITION_ACCOUNTS\"\
  ,\n    COUNT(DISTINCT CASE WHEN ACCOUNT_EDITION='Legacy-1' THEN BILLING_ACCOUNT_ID\
  \ END) as \"TOTAL_DEPLOYED_LEGACY_1_ACCOUNTS\"\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT\n\
  \    WHERE\n    LICENSE_TYPE = 'Purchase'\n    AND PRICING_AND_PACKAGING = '2025'\n\
  \    AND YEAR_MONTH > DATEADD('YEAR', -1, YEAR_MONTH)\n    GROUP BY YEAR_MONTH\n\
  \    ORDER BY YEAR_MONTH DESC;"
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on: []
related_metrics: []
