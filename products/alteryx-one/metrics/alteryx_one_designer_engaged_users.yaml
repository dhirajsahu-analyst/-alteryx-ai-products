id: alteryx_one_designer_engaged_users
name: Alteryx One Designer Engaged Users
description: Count of engaged users specifically on local Alteryx Designer.
product: alteryx_one
status: validated
category: engagement
definition:
  business: Count of engaged users specifically on local Alteryx Designer.
  technical: From ALTERYX_ONE_ENGAGED_USERS_BY_PRODUCT_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT YEAR_MONTH,\n    SUM(ENGAGED_USERS) as \"ENGAGED_USERS\",\n\
  \    (SUM(ENGAGED_USERS)/NULLIFZERO(SUM(ACTIVATED_USERS))) AS \"PERCENTAGE_ENGAGED_USERS\"\
  ,  \n    SUM(CLOUD_ENGAGED_USERS) as \"CLOUD_ENGAGED_USERS\",\n    SUM(DESIGNER_ENGAGED_USERS)\
  \ as \"DESIGNER_ENGAGED_USERS\"\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT\n\
  \    WHERE LICENSE_TYPE = 'Purchase' \n    AND PRICING_AND_PACKAGING = '2025'  \n\
  \    AND YEAR_MONTH > DATEADD('YEAR', -1, YEAR_MONTH)  \n    GROUP BY YEAR_MONTH\
  \  \n    ORDER BY YEAR_MONTH DESC;"
