definition:
  business: Share of registered users engaging with platform.
  technical: ACTIVE_USERS / REGISTERED_USERS * 100.
source: ALTERYX_ONE_TABLES
sql_template: SELECT ROUND(100.0 * COUNT(CASE WHEN LAST_LOGIN IS NOT NULL THEN USER_ID
  END) / NULLIF(COUNT(USER_ID), 0), 2) FROM ALTERYX_ONE_USERS
