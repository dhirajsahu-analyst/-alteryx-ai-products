category: adoption
definition:
  business: Adoption of platform features beyond basics.
  technical: Users using advanced features / active users * 100.
description: '% of active users using advanced features.'
freshness: daily
grain: point_in_time
id: alteryx_one_feature_adoption_rate
last_updated: '2026-08-05'
maintainer: product-insights@alteryx.com
name: Alteryx One Feature Adoption Rate
product: alteryx-one
source: ALTERYX_ONE_TABLES
sql_template: SELECT YEAR_MONTH::DATE AS MONTH_YEAR, ROUND((SUM(CASE WHEN FEATURE_ADOPTION
  > 0 THEN 1 ELSE 0 END) / NULLIF(COUNT(DISTINCT BILLING_ACCOUNT_ID), 0)) * 100, 2)
  AS FEATURE_ADOPTION_RATE FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
  WHERE LICENSE_TYPE = 'Purchase' AND PRICING_AND_PACKAGING = '2025' AND YEAR_MONTH
  > DATEADD('YEAR', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE
  DESC
status: active
