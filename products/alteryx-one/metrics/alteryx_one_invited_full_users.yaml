id: alteryx_one_invited_full_users
name: Alteryx One Invited Full Users
description: Count of invited users allocated with a Full User role.
product: alteryx_one
status: validated
category: adoption
definition:
  business: Count of invited users allocated with a Full User role.
  technical: ''
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT YEAR_MONTH,\n    SUM(INVITED_FULL_USERS) as \"INVITED_FULL_USERS\"\
  ,\n    SUM(INVITED_BASIC_USERS) as \"INVITED_BASIC_USERS\",\n    SUM(INVITED_VIEWER_USERS)\
  \ as \"INVITED_VIEWER_USERS\",\n    SUM(INVITED_ACCOUNT_ADMINS) as \"INVITED_ACCOUNT_ADMINS\"\
  ,\n    SUM(INVITED_WORKSPACE_ADMINS) as \"INVITED_WORKSPACE_ADMINS\",\n    (SUM(INVITED_FULL_USERS)/NULLIFZERO(SUM(INVITED_USERS)))\
  \ AS \"PERCENTAGE_INVITED_FULL_USERS\",\n    (SUM(INVITED_BASIC_USERS)/NULLIFZERO(SUM(INVITED_USERS)))\
  \ AS \"PERCENTAGE_INVITED_BASIC_USERS\",\n    (SUM(INVITED_VIEWER_USERS)/NULLIFZERO(SUM(INVITED_USERS)))\
  \ AS \"PERCENTAGE_INVITED_VIEWER_USERS\",\n    (SUM(INVITED_ACCOUNT_ADMINS)/NULLIFZERO(SUM(INVITED_USERS)))\
  \ AS \"PERCENTAGE_INVITED_ACCOUNT_ADMINS\",\n    (SUM(INVITED_WORKSPACE_ADMINS)/NULLIFZERO(SUM(INVITED_USERS)))\
  \ AS \"PERCENTAGE_INVITED_WORKSPACE_ADMINS\"\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT\n\
  \    WHERE LICENSE_TYPE = 'Purchase'\n    AND PRICING_AND_PACKAGING = '2025'\n \
  \   AND YEAR_MONTH > DATEADD('YEAR', -1, YEAR_MONTH)\n    GROUP BY YEAR_MONTH\n\
  \    ORDER BY YEAR_MONTH DESC;"
