id: alteryx_one_mbr_user_engagement_rate
name: Alteryx One MBR User Engagement Rate
description: 'Monthly Business Review: Percentage of activated users who became highly
  engaged within 30 days of activation.'
product: alteryx_one
status: validated
category: engagement
definition:
  business: 'Monthly Business Review: Percentage of activated users who became highly
    engaged within 30 days of activation.'
  technical: From ALTERYX_ONE_MBR_ACTIVATION_ENGAGEMENT_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "create or replace view ALTERYX_ONE_MBR_ACTIVATION_ENGAGEMENT_VIEW(\n\
  \tYEAR_MONTH COMMENT 'The specific month for this scorecard record (standardized\
  \ to the first day of the month).',\n\t\"% OF CLOUD ACTIVE USERS TO ACTIVATED USER\"\
  \ COMMENT 'The ratio percentage of cloud active users out of total activated users.',\n\
  \t\"% OF CLOUD ENGAGED USERS TO ACTIVATED USER\" COMMENT 'The ratio percentage of\
  \ cloud engaged users out of total activated users.',\n\t\"% OF CLOUD ENGAGED ACCOUNT\
  \ TO ACTIVE ACCOUNTS\" COMMENT 'The ratio percentage of cloud engaged billing accounts\
  \ out of active billing accounts.',\n\t\"% OF ACTIVATED USERS ENAGAGED WITH 30 DAY\
  \ OF ACTIVATION\" COMMENT 'The percentage ratio of activated users who became highly\
  \ engaged within 30 days of activation.'\n) \n as\n    WITH MBR1 AS\n    (SELECT\n\
  \      YEAR_MONTH,\n      (SUM(CLOUD_ACTIVE_USERS)/SUM(ACTIVATED_USERS)) as \"%\
  \ OF CLOUD ACTIVE USERS TO ACTIVATED USER\",\n      (SUM(CLOUD_ENGAGED_USERS)/SUM(ACTIVATED_USERS))\
  \  as \"% OF CLOUD ENGAGED USERS TO ACTIVATED USER\",\n      (COUNT(DISTINCT CASE\
  \ WHEN (PLAN_RUNS+SCHEDULE_CREATED+CEFD_WORKFLOW_RUN)>0 THEN BILLING_ACCOUNT_ID\
  \ END)/COUNT(DISTINCT  BILLING_ACCOUNT_ID)) AS \"% OF CLOUD ENGAGED ACCOUNT TO ACTIVE\
  \ ACCOUNTS\"\n    FROM\n      DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT\n\
  \    WHERE\n     LICENSE_TYPE = 'Purchase' \n    AND PRICING_AND_PACKAGING = '2025'\
  \  \n    AND YEAR_MONTH >= '2026-01-01'  \n    GROUP BY YEAR_MONTH  \n    ORDER\
  \ BY YEAR_MONTH DESC)\n\n    , ENGAGEMENT AS\n    (\n    SELECT DATE_TRUNC('MONTH',\
  \ ACTIVATION_DATE) YEAR_MONTH, COUNT(DISTINCT USER_ID) ENGAGED_USERS\n    FROM\n\
  \    (SELECT USER_ID, USER_EMAIL, ACTIVATION_DATE, MIN(DATE) DATE_MIN\n    FROM\
  \ DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.AYX_DAILY_USERS_AT\n    WHERE LICENSE_TYPE='Purchase'\
  \ AND PRICING_AND_PACKAGING='2025'\n    GROUP BY ALL HAVING \n    (\n    ZEROIFNULL(SUM(DC_CREATE_WORKFLOW))\
  \ \n    + ZEROIFNULL(SUM(DC_OPEN_WORKFLOW)) \n    + ZEROIFNULL(SUM(DC_WORKFLOW_RUNS))\n\
  \    + ZEROIFNULL(SUM(NEW_PLANS)) \n    + ZEROIFNULL(SUM(RUN_PLANS))\n    + ZEROIFNULL(SUM(PLAN_OPENED))\n\
  \    + ZEROIFNULL(SUM(PLAN_DOWNLOADED))\n    + ZEROIFNULL(SUM(PLAN_UPLOADED))\n\
  \    + ZEROIFNULL(SUM(PLAN_SHARED))\n    + ZEROIFNULL(SUM(CONNECTION_CREATED)) \n\
  \    + ZEROIFNULL(SUM(CONNECTION_EDITED)) \n    + ZEROIFNULL(SUM(CONNECTION_SHARED))\
  \ \n    + ZEROIFNULL(SUM(DATASETS_CREATED))    \n    + ZEROIFNULL(SUM(DATASET_REFRESHED))\n\
  \    + ZEROIFNULL(SUM(DATASETS_SHARED))\n    + ZEROIFNULL(SUM(NEW_SCHEDULE))\n \
  \   + ZEROIFNULL(SUM(NEW_FILE_CREATED_FROM_VERSION))\n    + ZEROIFNULL(SUM(MISSIONS_CREATED))\
  \ \n    + ZEROIFNULL(SUM(MISSIONS_CREATED_FROM_PLAYBOOKS)) \n    + ZEROIFNULL(SUM(MISSIONS_EMAIL_OPENED))\
  \ \n    + ZEROIFNULL(SUM(MISSIONS_OPENED)) \n    + ZEROIFNULL(SUM(MAGIC_DOCUMENTS_CREATED))\
  \ \n    + ZEROIFNULL(SUM(PLAYBOOKS_STARTED))\n    )>0)\n    WHERE DATEDIFF(DAY,\
  \ ACTIVATION_DATE, DATE_MIN)<30\n    GROUP BY ALL ORDER BY 1 DESC)\n\n    SELECT\
  \ DATE(A.YEAR_MONTH)  AS YEAR_MONTH, \"% OF CLOUD ACTIVE USERS TO ACTIVATED USER\"\
  , \"% OF CLOUD ENGAGED USERS TO ACTIVATED USER\",\"% OF CLOUD ENGAGED ACCOUNT TO\
  \ ACTIVE ACCOUNTS\", (ENGAGED_USERS/ACTIVATED_USERS) AS \"% OF ACTIVATED USERS ENAGAGED\
  \ WITH 30 DAY OF ACTIVATION\"\n    FROM MBR1 M\n    LEFT JOIN ENGAGEMENT A ON A.YEAR_MONTH=M.YEAR_MONTH\n\
  \    LEFT JOIN\n    (SELECT DATE_TRUNC('MONTH',DATE) YEAR_MONTH, COUNT(DISTINCT\
  \ USER_ID) ACTIVATED_USERS \n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.AYX_DAILY_USERS_AT\n\
  \    WHERE LICENSE_TYPE='Purchase' AND PRICING_AND_PACKAGING='2025' AND STATUS =\
  \ 'ACTIVATED' GROUP BY ALL ORDER BY 1 DESC \n    )B ON A.YEAR_MONTH=B.YEAR_MONTH\n\
  \    ORDER BY 1 DESC;"
