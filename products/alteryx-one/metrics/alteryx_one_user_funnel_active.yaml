id: alteryx_one_user_funnel_active
name: Alteryx One User Funnel - Active
description: Users with activity in past 30 days.
product: alteryx-one
category: funnel
status: active
freshness: daily
grain: point_in_time
definition:
  business: Users actively using Alteryx One.
  technical: Count of users with LAST_LOGIN >= 30 days ago.
source: ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
sql_template: 'SELECT YEAR_MONTH::DATE AS MONTH_YEAR, SUM(ACTIVE_FULL_USERS + ACTIVE_BASIC_USERS + ACTIVE_VIEWERS) AS ACTIVE_USERS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT WHERE LICENSE_TYPE = ''Purchase'' AND PRICING_AND_PACKAGING = ''2025'' AND YEAR_MONTH > DATEADD(''YEAR'', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE DESC'
tags:
- funnel
- funnel-stage
- user
- engagement
