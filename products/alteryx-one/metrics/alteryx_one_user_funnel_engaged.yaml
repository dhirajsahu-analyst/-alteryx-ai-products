id: alteryx_one_user_funnel_engaged
name: Alteryx One User Funnel - Engaged
description: Users with 10+ logins or 5+ workflows in past 30 days.
product: alteryx-one
category: funnel
status: active
freshness: daily
grain: point_in_time
definition:
  business: Highly engaged users showing strong adoption.
  technical: Count of users with LOGIN_COUNT >= 10 OR WORKFLOW_COUNT >= 5.
source: ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
sql_template: 'SELECT YEAR_MONTH::DATE AS MONTH_YEAR, SUM(ENGAGED_FULL_USERS + ENGAGED_BASIC_USERS) AS ENGAGED_USERS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT WHERE LICENSE_TYPE = ''Purchase'' AND PRICING_AND_PACKAGING = ''2025'' AND YEAR_MONTH > DATEADD(''YEAR'', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE DESC'
tags:
- funnel
- funnel-stage
- user
- engagement
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
