id: alteryx_one_user_funnel_registered
name: Alteryx One User Funnel - Registered
description: Users who have activated their account.
product: alteryx-one
category: funnel
status: active
freshness: daily
grain: point_in_time
definition:
  business: Users who completed registration/activation.
  technical: Count of users with STATUS = 'ACTIVATED'.
source: ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
sql_template: 'SELECT YEAR_MONTH::DATE AS MONTH_YEAR, SUM(INVITED_FULL_USERS + INVITED_BASIC_USERS + INVITED_VIEWERS) AS REGISTERED_USERS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT WHERE LICENSE_TYPE = ''Purchase'' AND PRICING_AND_PACKAGING = ''2025'' AND YEAR_MONTH > DATEADD(''YEAR'', -1, YEAR_MONTH) GROUP BY YEAR_MONTH::DATE ORDER BY YEAR_MONTH::DATE DESC'
tags:
- funnel
- funnel-stage
- user
- activation
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
