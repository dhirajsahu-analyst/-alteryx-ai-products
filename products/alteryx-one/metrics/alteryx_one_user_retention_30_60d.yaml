category: retention
definition:
  business: Two-month engagement signal.
  technical: Users with activity in days 30-60 / total new users.
description: '% of new users returning in days 30-60.'
freshness: daily
grain: point_in_time
id: alteryx_one_user_retention_30_60d
last_updated: '2026-08-05'
maintainer: product-insights@alteryx.com
name: Alteryx One User Retention - 30-60 Day
product: alteryx-one
source: ALTERYX_ONE_TABLES
sql_template: SELECT RETENTION_BUCKET_DAYS, COUNT(DISTINCT USER_ID) AS RETAINED_USERS
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_ONE_USERS_RETENTIONS_BY_BUCKET_DAYS_VIEW
  WHERE RETENTION_BUCKET_DAYS >= 30 AND RETENTION_BUCKET_DAYS <= 60 GROUP BY RETENTION_BUCKET_DAYS
status: active
