id: alteryx_one_user_retention_7_14d
name: Alteryx One User Retention - 7-14 Day
description: '% of new users returning in days 7-14.'
product: alteryx-one
category: retention
status: active
freshness: daily
grain: point_in_time
definition:
  business: Second-week engagement signal.
  technical: Users with activity in days 7-14 / total new users.
source: ALTERYX_ONE_TABLES
sql_template: SELECT ROUND(100.0 * COUNT(CASE WHEN DAYS_TO_FIRST_LOGIN BETWEEN 7 AND
  14 THEN USER_ID END) / NULLIF(COUNT(USER_ID), 0), 2) FROM ALTERYX_ONE_USERS
