id: alteryx_one_user_retention_7d
name: Alteryx One User Retention - 7 Day
description: Percentage of users who return within 7 days of first login.
product: alteryx-one
category: retention
status: active
freshness: daily
grain: point_in_time
definition:
  business: Early engagement signal showing user return within first week.
  technical: Users with activity in days 1-7 after registration / total new users.
source: PRODUCT_TABLES
sql_template: SELECT ROUND(100.0 * COUNT(CASE WHEN DAYS_TO_RETURN <= 7 THEN USER_ID
  END) / NULLIF(COUNT(USER_ID), 0), 2) FROM USER_REGISTRATION_COHORT
tags:
- retention
- rate-metric
- engagement
