category: engagement
definition:
  business: Platform adoption signal via workspace creation.
  technical: WORKSPACE_COUNT / ACTIVE_USERS.
description: Monthly workspaces created per active user.
freshness: daily
grain: point_in_time
id: alteryx_one_workspace_creation_rate
last_updated: '2026-08-05'
maintainer: product-insights@alteryx.com
name: Alteryx One Workspace Creation Rate
product: alteryx-one
source: ALTERYX_ONE_TABLES
sql_template: SELECT YEAR_MONTH::DATE AS MONTH_YEAR, COUNT(DISTINCT WORKSPACE_ID)
  AS WORKSPACE_CREATED FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
  WHERE LICENSE_TYPE = 'Purchase' AND PRICING_AND_PACKAGING = '2025' AND YEAR_MONTH
  > DATEADD('YEAR', -1, YEAR_MONTH) AND WORKSPACE_ID IS NOT NULL GROUP BY YEAR_MONTH::DATE
  ORDER BY YEAR_MONTH::DATE DESC
