id: copilot_7_15_day_retention
name: Copilot 7-15 Day Retention Rate
description: Percentage of Copilot users who remain active 7-15 days after first activation
product: ask_alteryx
status: validated
category: retention
definition:
  business: Measures early user retention after the critical first 1-7 day window.
    Critical for understanding onboarding success and product-market fit.
  technical: RETURNING_RATE_PCT from COPILOT_7_15_RETENTION_RATE_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "CREATE OR REPLACE VIEW DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_7_15_RETENTION_RATE_VIEW\
  \ (\n    TOTAL_USERS COMMENT 'The total count of unique Purchase users eligible\
  \ for 7-15 day retention analysis.',\n    RETURNING_USERS_7_15D COMMENT 'The number\
  \ of eligible users who returned to use Copilot at least once between Day 7 and\
  \ Day 15.',\n    RETURNING_RATE_PCT COMMENT 'The returning user rate represented\
  \ as a decimal ratio between 0 and 1.'\n) AS\n-- ============================================================================\n\
  -- VIEW: COPILOT_7_15_RETENTION_RATE_VIEW\n-- DESCRIPTION: Computes 7-15 day retention\
  \ rate of Purchase users on Professional/Enterprise\n-- accounts who have at least\
  \ one Copilot chat activity, using the standard metric\n-- source COPILOT_ACTIVITY_USAGE_AT.\n\
  -- ============================================================================\n\
  WITH\n\n-- ============================================\n-- USER_ACTIVITY\n-- ============================================\n\
  -- Captures all Purchase Enterprise/Professional users\n-- who have at least one\
  \ Copilot chat activity.\n-- Each record represents a user's activity on a given\
  \ day.\n\nuser_activity AS (\n    SELECT\n        USER_EMAIL AS CREATED_BY_ID,\n\
  \        CAST(CONV_CREATED_DATE AS DATE) AS activity_date\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  \    WHERE ACCOUNT_EDITION IN ('Professional','Enterprise')\n      AND LICENSE_TYPE\
  \ = 'Purchase'\n      AND CHAT_ID IS NOT NULL\n),\n\n-- ============================================\n\
  -- FIRST_USE\n-- ============================================\n-- Determines the\
  \ first day each user used Copilot.\n-- This date is used as the cohort start date.\n\
  \nfirst_use AS (\n    SELECT\n        CREATED_BY_ID,\n        MIN(activity_date)\
  \ AS first_date\n    FROM user_activity\n    GROUP BY CREATED_BY_ID\n),\n\n-- ============================================\n\
  -- ELIGIBLE_COHORT\n-- ============================================\n-- Users whose\
  \ first Copilot usage occurred at least\n-- seven days before today, making them\
  \ eligible\n-- for 7–15 day retention measurement.\n\neligible_cohort AS (\n   \
  \ SELECT\n        CREATED_BY_ID,\n        first_date\n    FROM first_use\n    WHERE\
  \ first_date <= DATEADD(day, -7, CURRENT_DATE())\n),\n\n-- ============================================\n\
  -- RETURNS_7_15\n-- ============================================\n-- Users who returned\
  \ to use Copilot between\n-- Day 7 and Day 15 after their first usage.\n\nreturns_7_15\
  \ AS (\n    SELECT\n        fu.CREATED_BY_ID,\n        MIN(ua.activity_date) AS\
  \ first_return_date_in_window\n    FROM eligible_cohort fu\n    JOIN user_activity\
  \ ua\n      ON ua.CREATED_BY_ID = fu.CREATED_BY_ID\n     AND ua.activity_date BETWEEN\
  \ DATEADD(day, 7, fu.first_date)\n                              AND DATEADD(day,\
  \ 15, fu.first_date)\n    GROUP BY fu.CREATED_BY_ID\n)\n\nSELECT\n\n-- ============================================\n\
  -- METRIC DEFINITIONS\n-- ============================================\n\n-- TOTAL_USERS\n\
  -- Number of users eligible for 7–15 day retention analysis.\n-- These users first\
  \ used Copilot at least seven days ago.\n\n    (SELECT COUNT(*) FROM eligible_cohort)\
  \ AS total_users,\n\n-- RETURNING_USERS_7_15D\n-- Number of eligible users who returned\
  \ to use Copilot\n-- at least once between Day 7 and Day 15 after first use.\n\n\
  \    (SELECT COUNT(*) FROM returns_7_15) AS returning_users_7_15d,\n\n-- RETURNING_RATE_PCT\n\
  -- Percentage of eligible users who returned between\n-- Day 7 and Day 15 after\
  \ first using Copilot.\n--\n-- Formula:\n-- Returning Users (7–15 Days) / Total\
  \ Eligible Users\n--\n-- Returned as a decimal ratio.\n-- Example: 0.2845 = 28.45%\n\
  \n    ROUND(\n        ROUND(\n            (SELECT COUNT(*) FROM returns_7_15) *\
  \ 100.0 /\n            NULLIF((SELECT COUNT(*) FROM eligible_cohort), 0),\n    \
  \        2\n        ) / 100.0,\n        4\n    ) AS returning_rate_pct;"
queries: []
aggregation_level: overall
grain: overall
freshness: monthly
filters:
- RETURNING_RATE_PCT IS NOT NULL
depends_on:
- copilot_activation_rate
- copilot_new_users
