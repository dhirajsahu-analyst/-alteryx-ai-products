id: copilot_7_15_returning_rate_pct
name: Copilot 7-15 Day Retention Rate
description: Percentage of eligible users who returned between Day 7 and Day 15 after
  first using Copilot (decimal ratio).
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: The percentage of users in the 7-day eligible cohort who showed activity
    (returned) between day 7 and day 15. Returns as decimal ratio (e.g., 0.2845 =
    28.45%).
  technical: 'Calculated as: (returning_users_7_15 / total_users_eligible) * 100,
    rounded to 4 decimal places. Returned as decimal ratio.'
source: COPILOT_ACTIVITY_USAGE_AT
sql_template: 'WITH user_activity AS (
    SELECT USER_EMAIL AS CREATED_BY_ID, CAST(CONV_CREATED_DATE AS DATE) AS activity_date
    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT
    WHERE ACCOUNT_EDITION IN (''Professional'',''Enterprise'') AND LICENSE_TYPE = ''Purchase'' AND CHAT_ID IS NOT NULL
),
first_use AS (
    SELECT CREATED_BY_ID, MIN(activity_date) AS first_date FROM user_activity GROUP BY CREATED_BY_ID
),
eligible_cohort AS (
    SELECT CREATED_BY_ID, first_date FROM first_use WHERE first_date <= DATEADD(day, -7, CURRENT_DATE())
),
returns_7_15 AS (
    SELECT fu.CREATED_BY_ID, MIN(ua.activity_date) AS first_return_date_in_window
    FROM eligible_cohort fu
    JOIN user_activity ua ON ua.CREATED_BY_ID = fu.CREATED_BY_ID
    AND ua.activity_date BETWEEN DATEADD(day, 7, fu.first_date) AND DATEADD(day, 15, fu.first_date)
    GROUP BY fu.CREATED_BY_ID
)
SELECT ROUND(ROUND((SELECT COUNT(*) FROM returns_7_15) * 100.0 / NULLIF((SELECT COUNT(*) FROM eligible_cohort), 0), 2) / 100.0, 4) AS returning_rate_pct'
tags:
- copilot
- engagement
- metrics
