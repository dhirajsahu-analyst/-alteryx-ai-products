id: copilot_account_engagement_rate
name: Copilot Account Engagement Rate
description: Percentage of onboarded accounts where at least one user has achieved engaged status
product: ask_alteryx
status: validated
category: engagement
definition:
  business: Percentage of onboarded accounts where at least one user has achieved engaged status
  technical: '[''ENGAGED_ACCOUNTS'', ''ONBOARDED_ACCOUNTS''] from COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |-
  SELECT ROUND(ENGAGED_ACCOUNTS / ONBOARDED_ACCOUNTS * 100, 2) as engagement_rate_pct, ENGAGED_ACCOUNTS as engaged_accounts_count, ONBOARDED_ACCOUNTS as onboarded_accounts_total FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW WHERE ONBOARDED_ACCOUNTS > 0 LIMIT 100
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters:
- ONBOARDED_ACCOUNTS > 0
depends_on:
- copilot_onboarded_accounts
- copilot_active_accounts
related_metrics:
- copilot_user_engagement_rate
- copilot_account_activation_rate
- copilot_high_activity_accounts
maintainer: analytics@alteryx.com
tags:
- engagement
- copilot
- account-health
- funnel-metric
last_updated: '2026-08-03'
version: '1.0'
