id: copilot_account_funnel_health
name: Copilot Account Funnel Health
description: 'Multi-stage account funnel showing progression: Onboarded → Active → Workflow Users → Engaged'
product: ask_alteryx
status: validated
category: funnel
definition:
  business: 'Multi-stage account funnel showing progression: Onboarded → Active → Workflow Users → Engaged'
  technical: '[''ONBOARDED_ACCOUNTS'', ''ACTIVE_ACCOUNTS'', ''ACCOUNTS_WITH_AT_LEAST_1_WORKFLOW'', ''ENGAGED_ACCOUNTS''] from COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |-
  SELECT ONBOARDED_ACCOUNTS as stage_0_onboarded, ACTIVE_ACCOUNTS as stage_1_active, ACCOUNTS_WITH_AT_LEAST_1_WORKFLOW as stage_2_workflow, ENGAGED_ACCOUNTS as stage_3_engaged, ROUND(ACTIVE_ACCOUNTS / ONBOARDED_ACCOUNTS * 100, 2) as activation_pct, ROUND(ENGAGED_ACCOUNTS / ONBOARDED_ACCOUNTS * 100, 2) as engagement_pct FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW LIMIT 100
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on:
- copilot_onboarded_accounts
- copilot_active_accounts
- copilot_high_activity_accounts
related_metrics:
- copilot_user_funnel_health
maintainer: analytics@alteryx.com
tags:
- funnel
- copilot
- health-check
- account-level
last_updated: '2026-08-03'
version: '1.0'
