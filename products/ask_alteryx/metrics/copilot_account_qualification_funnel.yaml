id: copilot_account_qualification_funnel
name: Copilot Account Qualification Funnel
description: Qualification funnel from all Alteryx accounts through Alteryx One to Copilot eligibility
product: ask_alteryx
status: validated
category: funnel
definition:
  business: Qualification funnel from all Alteryx accounts through Alteryx One to Copilot eligibility
  technical: '[''TOTAL_AYX_ACCOUNTS'', ''TOTAL_AYX1_ACCOUNTS'', ''ACCOUNTS_WITH_ENT_AND_PRO'', ''COPILOT_ELIGIBLE_ACCOUNTS''] from COPILOT_ELIGIBLE_ACCOUNT_FUNNEL_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |-
  SELECT TOTAL_AYX_ACCOUNTS as stage_0_all_ayx, TOTAL_AYX1_ACCOUNTS as stage_1_ayx_one, ACCOUNTS_WITH_ENT_AND_PRO as stage_2_ent_pro, COPILOT_ELIGIBLE_ACCOUNTS as stage_3_copilot_eligible, MONTH_YEAR as period, ROUND(TOTAL_AYX1_ACCOUNTS / TOTAL_AYX_ACCOUNTS * 100, 2) as ayx_one_pct, ROUND(COPILOT_ELIGIBLE_ACCOUNTS / TOTAL_AYX_ACCOUNTS * 100, 2) as copilot_pct FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ELIGIBLE_ACCOUNT_FUNNEL_VIEW ORDER BY MONTH_YEAR DESC LIMIT 100
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on:
- copilot_eligible_accounts
related_metrics:
- copilot_account_eligibility_rate
maintainer: analytics@alteryx.com
tags:
- funnel
- copilot
- qualification
- multi-stage
last_updated: '2026-08-03'
version: '1.0'
