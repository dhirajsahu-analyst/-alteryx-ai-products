id: copilot_account_workflow_adoption_rate
name: Copilot Account Workflow Adoption Rate
description: Percentage of onboarded accounts with at least one Copilot workflow created
product: ask_alteryx
status: validated
category: engagement
definition:
  business: Percentage of onboarded accounts with at least one Copilot workflow created
  technical: '[''ACCOUNTS_WITH_AT_LEAST_1_WORKFLOW'', ''ONBOARDED_ACCOUNTS''] from COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |-
  SELECT ROUND(ACCOUNTS_WITH_AT_LEAST_1_WORKFLOW / ONBOARDED_ACCOUNTS * 100, 2) as workflow_adoption_rate_pct, ACCOUNTS_WITH_AT_LEAST_1_WORKFLOW as accounts_with_workflow_count, ONBOARDED_ACCOUNTS as onboarded_accounts_total FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW WHERE ONBOARDED_ACCOUNTS > 0 LIMIT 100
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters:
- ONBOARDED_ACCOUNTS > 0
depends_on:
- copilot_onboarded_accounts
related_metrics:
- copilot_user_workflow_adoption_rate
- copilot_workflow_runs
maintainer: analytics@alteryx.com
tags:
- engagement
- copilot
- feature-adoption
last_updated: '2026-08-03'
version: '1.0'
