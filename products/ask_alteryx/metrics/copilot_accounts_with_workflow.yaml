id: copilot_accounts_with_workflow
name: Copilot Accounts with Workflow Usage
description: Number of accounts with Copilot chat activity AND at least one workflow
  usage.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Accounts that have both chat interactions and successfully used Copilot
    to create or modify workflows.
  technical: Count of distinct billing_account_id_raw where chat_id IS NOT NULL AND
    workflow_id IS NOT NULL AND workflow_id <> ''.
source: COPILOT_VIEWS
sql_template: |
  SELECT ACCOUNTS_WITH_AT_LEAST_1_WORKFLOW
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW
tags:
- copilot
- engagement
- metrics
