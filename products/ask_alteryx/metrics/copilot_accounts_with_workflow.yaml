id: copilot_accounts_with_workflow
name: Copilot Accounts with Workflow Usage
description: Number of accounts with Copilot chat activity AND at least one workflow
  usage.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Accounts that have both chat interactions and successfully used Copilot
    to create or modify workflows.
  technical: Count of distinct billing_account_id_raw where chat_id IS NOT NULL AND
    workflow_id IS NOT NULL AND workflow_id <> ''.
source: COPILOT_ACTIVITY_USAGE_AT
sql_template: 'SELECT COUNT(DISTINCT CASE WHEN chat_id IS NOT NULL AND workflow_id IS NOT NULL AND workflow_id <> '''' THEN billing_account_id_raw END) AS accounts_with_at_least_1_workflow
FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT
WHERE license_type = ''Purchase'' AND user_type = ''aacp'' AND billing_account_id_raw IS NOT NULL'
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
