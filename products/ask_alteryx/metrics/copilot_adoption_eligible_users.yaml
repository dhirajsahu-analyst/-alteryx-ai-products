id: copilot_adoption_eligible_users
name: Copilot Eligible Users Funnel
description: Complete eligibility funnel for users including Enterprise/Professional, Copilot-enabled, version-eligible, and fully-eligible users.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: User eligibility progression showing funnel from Enterprise/Professional users to those fully eligible for Copilot (enabled, Designer activated, version 2025.2).
  technical: Funnel metrics from COPILOT_ELIGBLE_USERS_VIEW showing distinct USER_ID_RAW at each eligibility stage.
source: COPILOT_VIEWS
sql_template: 'SELECT
    COUNT(DISTINCT CASE
        WHEN LICENSE_TYPE = ''Purchase''
         AND PRICING_AND_PACKAGING = ''2025''
         AND ACCOUNT_EDITION IN (''Enterprise'', ''Professional'')
         AND STATUS = ''ACTIVATED''
         AND ALTERYX_USER_EMAIL IS NOT NULL
        THEN USER_ID_RAW
    END) AS ENTERPRISE_PRO_USERS,
    COUNT(DISTINCT CASE
        WHEN LICENSE_TYPE = ''Purchase''
         AND PRICING_AND_PACKAGING = ''2025''
         AND ACCOUNT_EDITION IN (''Enterprise'', ''Professional'')
         AND STATUS = ''ACTIVATED''
         AND ALTERYX_USER_EMAIL IS NOT NULL
         AND COPILOT_ENABLED = TRUE
        THEN USER_ID_RAW
    END) AS COPILOT_ENABLED_USERS,
    COUNT(DISTINCT CASE
        WHEN LICENSE_TYPE = ''Purchase''
         AND PRICING_AND_PACKAGING = ''2025''
         AND ACCOUNT_EDITION IN (''Enterprise'', ''Professional'')
         AND STATUS = ''ACTIVATED''
         AND ALTERYX_USER_EMAIL IS NOT NULL
         AND COPILOT_ENABLED = TRUE
         AND MAXIMUM_RAW_PRODUCT_VERSION >= ''2025.2''
        THEN USER_ID_RAW
    END) AS ELIGIBLE_USERS_2025_2,
    COUNT(DISTINCT CASE
        WHEN LICENSE_TYPE = ''Purchase''
         AND PRICING_AND_PACKAGING = ''2025''
         AND ACCOUNT_EDITION IN (''Enterprise'', ''Professional'')
         AND STATUS = ''ACTIVATED''
         AND ALTERYX_USER_EMAIL IS NOT NULL
         AND COPILOT_ENABLED = TRUE
         AND DESIGNER_ACTIVATION_STATUS = TRUE
         AND DESIGNER_OFFLINE_ACTIVATION = FALSE
         AND MAXIMUM_RAW_PRODUCT_VERSION = ''2025.2''
        THEN USER_ID_RAW
    END) AS COPILOT_ELIGIBLE_USERS
FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT'
