id: copilot_adoption_percentage
name: Copilot User Adoption Rate
description: Percentage of eligible users who are actively using Copilot (decimal
  ratio).
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: The adoption rate showing what percentage of eligible users are actively
    engaging with Copilot.
  technical: 'Calculated as: (active_users / eligible_users) * 100, returned as decimal
    ratio.'
source: COPILOT_ACTIVITY_USAGE_AT
sql_template: 'WITH numerator AS (
    SELECT COUNT(DISTINCT USER_ID_RAW) AS num
    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT
    WHERE LICENSE_TYPE = ''Purchase'' AND USER_TYPE = ''aacp'' AND USER_ID_RAW IS NOT NULL AND USER_EMAIL IS NOT NULL AND CHAT_ID IS NOT NULL
),
denominator AS (
    SELECT COUNT(DISTINCT USER_ID_RAW) AS denom
    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT
    WHERE LICENSE_TYPE = ''Purchase'' AND PRICING_AND_PACKAGING = ''2025'' AND ACCOUNT_EDITION IN (''Enterprise'', ''Professional'') AND STATUS = ''ACTIVATED'' AND ALTERYX_USER_EMAIL IS NOT NULL AND COPILOT_ENABLED = TRUE AND DESIGNER_ACTIVATION_STATUS = TRUE AND DESIGNER_OFFLINE_ACTIVATION = FALSE AND TRY_TO_DECIMAL(MAXIMUM_RAW_PRODUCT_VERSION, 10, 2) >= 2025.2
)
SELECT ROUND(ROUND(100.0 * numerator.num / NULLIF(denominator.denom, 0), 2) / 100.0, 4) AS adoption_percentage
FROM numerator, denominator'
tags:
- copilot
- engagement
- metrics
