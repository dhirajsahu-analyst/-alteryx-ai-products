id: copilot_adoption_rate
name: Copilot Adoption Rate
description: Percentage of eligible Copilot users who have activated and are actively
  using the product
product: ask_alteryx
status: validated
category: adoption
definition:
  business: Measures how many eligible users have successfully adopted Copilot. Key
    metric for product growth and value realization.
  technical: ADOPTION_PERCENTAGE from COPILOT_USERS_ADOPTION_RATE_VIEW (active_users
    / eligible_users * 100)
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "CREATE OR REPLACE VIEW DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_USERS_ADOPTION_RATE_VIEW(\n\
  \    ACTIVE_USERS COMMENT 'Distinct Purchase AACP users with at least one Copilot\
  \ chat.',\n    ELIGIBLE_USERS COMMENT 'Distinct users satisfying all Copilot eligibility\
  \ criteria.',\n    ADOPTION_PERCENTAGE COMMENT 'Percentage of eligible users who\
  \ actively used Copilot (Active Users / Eligible Users).'\n) AS\nWITH numerator\
  \ AS (\n    SELECT\n        COUNT(DISTINCT USER_ID_RAW) AS num\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  \    WHERE LICENSE_TYPE = 'Purchase'\n      AND USER_TYPE = 'aacp'\n      AND USER_ID_RAW\
  \ IS NOT NULL\n      AND USER_EMAIL IS NOT NULL\n      AND CHAT_ID IS NOT NULL\n\
  ),\ndenominator AS (\n    SELECT\n        COUNT(DISTINCT USER_ID_RAW) AS denom\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  \    WHERE LICENSE_TYPE = 'Purchase'\n      AND PRICING_AND_PACKAGING = '2025'\n\
  \      AND ACCOUNT_EDITION IN ('Enterprise', 'Professional')\n      AND STATUS =\
  \ 'ACTIVATED'\n      AND ALTERYX_USER_EMAIL IS NOT NULL\n      AND COPILOT_ENABLED\
  \ = TRUE\n      AND DESIGNER_ACTIVATION_STATUS = TRUE\n      AND DESIGNER_OFFLINE_ACTIVATION\
  \ = FALSE\n      AND TRY_TO_DECIMAL(MAXIMUM_RAW_PRODUCT_VERSION, 10, 2) >= 2025.2\n\
  )\nSELECT\n    numerator.num AS active_users,\n    denominator.denom AS eligible_users,\n\
  \    ROUND(\n        ROUND(\n            100.0 * numerator.num / NULLIF(denominator.denom,\
  \ 0),\n            2\n        ) / 100.0,\n        4\n    ) AS adoption_percentage\n\
  FROM numerator,\n     denominator;\n\n\n-- ----------------------------------------------------------------------------\n\
  -- 6. View: COPILOT_ACCOUNTS_ADOPTION_RATE.VIEW\n-- ----------------------------------------------------------------------------"
queries: []
aggregation_level: overall
grain: overall
freshness: monthly
filters:
- ADOPTION_PERCENTAGE IS NOT NULL
depends_on:
- copilot_eligible_users
- copilot_active_users
related_metrics:
- copilot_adoption_gap
- copilot_activation_rate
- copilot_enabled_users_rate
maintainer: analytics@alteryx.com
tags:
- adoption
- copilot
- growth
- penetration
- key-metric
last_updated: '2026-08-03'
version: '1.0'
