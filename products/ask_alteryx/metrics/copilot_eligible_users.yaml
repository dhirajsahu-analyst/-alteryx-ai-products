id: copilot_eligible_users
name: Copilot Eligible Users
description: Total count of users who meet the criteria to use Copilot
product: ask_alteryx
status: validated
category: market_size
definition:
  business: Total count of users who meet the criteria to use Copilot
  technical: '[''COPILOT_ELIGIBLE_USERS''] from COPILOT_ELIGBLE_USERS_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    COUNT(DISTINCT CASE\n        WHEN LICENSE_TYPE = 'Purchase'\n\
  \         AND PRICING_AND_PACKAGING = '2025'\n         AND ACCOUNT_EDITION IN ('Enterprise',\
  \ 'Professional')\n         AND STATUS = 'ACTIVATED'\n         AND ALTERYX_USER_EMAIL\
  \ IS NOT NULL\n        THEN USER_ID_RAW\n    END) AS ENTERPRISE_PRO_USERS,\n   \
  \ COUNT(DISTINCT CASE\n        WHEN LICENSE_TYPE = 'Purchase'\n         AND PRICING_AND_PACKAGING\
  \ = '2025'\n         AND ACCOUNT_EDITION IN ('Enterprise', 'Professional')\n   \
  \      AND STATUS = 'ACTIVATED'\n         AND ALTERYX_USER_EMAIL IS NOT NULL\n \
  \        AND COPILOT_ENABLED = TRUE\n        THEN USER_ID_RAW\n    END) AS COPILOT_ENABLED_USERS,\n\
  \    COUNT(DISTINCT CASE\n        WHEN LICENSE_TYPE = 'Purchase'\n         AND PRICING_AND_PACKAGING\
  \ = '2025'\n         AND ACCOUNT_EDITION IN ('Enterprise', 'Professional')\n   \
  \      AND STATUS = 'ACTIVATED'\n         AND ALTERYX_USER_EMAIL IS NOT NULL\n \
  \        AND COPILOT_ENABLED = TRUE\n         AND MAXIMUM_RAW_PRODUCT_VERSION >=\
  \ '2025.2'\n        THEN USER_ID_RAW\n    END) AS ELIGIBLE_USERS_2025_2,\n    COUNT(DISTINCT\
  \ CASE\n        WHEN LICENSE_TYPE = 'Purchase'\n         AND PRICING_AND_PACKAGING\
  \ = '2025'\n         AND ACCOUNT_EDITION IN ('Enterprise', 'Professional')\n   \
  \      AND STATUS = 'ACTIVATED'\n         AND ALTERYX_USER_EMAIL IS NOT NULL\n \
  \        AND COPILOT_ENABLED = TRUE\n         AND DESIGNER_ACTIVATION_STATUS = TRUE\n\
  \         AND DESIGNER_OFFLINE_ACTIVATION = FALSE\n         AND MAXIMUM_RAW_PRODUCT_VERSION\
  \ = '2025.2'\n        THEN USER_ID_RAW\n    END) AS COPILOT_ELIGIBLE_USERS\nFROM\
  \ DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT;\n\n\n-- ----------------------------------------------------------------------------\n\
  -- 3. View: COPILOT_ACCOUNTS_ACTIVITY_FUNNEL.VIEW\n-- ----------------------------------------------------------------------------"
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
