id: copilot_enabled_users
name: Copilot Enabled Users
description: Count of Enterprise/Professional users with Copilot feature enabled.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: 'Second tier of eligibility: users from target editions who have Copilot
    explicitly enabled.'
  technical: Count of distinct USER_ID_RAW meeting Enterprise/Professional criteria
    AND COPILOT_ENABLED = TRUE.
source: COPILOT_ACTIVITY_USAGE_AT
sql_template: 'SELECT COUNT(DISTINCT CASE WHEN LICENSE_TYPE = ''Purchase'' AND PRICING_AND_PACKAGING = ''2025'' AND ACCOUNT_EDITION IN (''Enterprise'', ''Professional'') AND STATUS = ''ACTIVATED'' AND ALTERYX_USER_EMAIL IS NOT NULL AND COPILOT_ENABLED = TRUE THEN USER_ID_RAW END) AS COPILOT_ENABLED_USERS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT'
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
