id: copilot_ent_pro_accounts
name: Copilot Account Funnel - Enterprise/Professional
description: Count of accounts with 2025 pricing AND Enterprise or Professional edition
  for the given month.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Subset of 2025 accounts with target editions, potential Copilot users.
  technical: Count of distinct BILLING_ACCOUNT_ID_RAW where PRICING_AND_PACKAGING
    = 2025 AND ACCOUNT_EDITION IN ('Enterprise', 'Professional').
source: ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
sql_template: 'SELECT COUNT(DISTINCT CASE WHEN PRICING_AND_PACKAGING = 2025 AND ACCOUNT_EDITION IN (''Enterprise'', ''Professional'') THEN BILLING_ACCOUNT_ID_RAW END) AS ACCOUNTS_WITH_ENT_AND_PRO FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT WHERE PRODUCT_NAME = ''ALTERYX'' AND LICENSE_TYPE = ''Purchase'' AND YEAR_MONTH > ''2026-01-01'''
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
