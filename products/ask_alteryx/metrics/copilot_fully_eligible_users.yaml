id: copilot_fully_eligible_users
name: Copilot Fully Eligible Users
description: 'Count of users meeting ALL Copilot eligibility criteria: Purchase, 2025
  pricing, Enterprise/Professional, ACTIVATED, Copilot enabled, Designer activated
  (online), version 2025.2+.'
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: 'Final tier: fully eligible users meeting all requirements for Copilot
    usage.'
  technical: Count of distinct USER_ID_RAW meeting all criteria including DESIGNER_ACTIVATION_STATUS=TRUE
    AND DESIGNER_OFFLINE_ACTIVATION=FALSE.
source: COPILOT_VIEWS
sql_template: "SELECT COUNT(DISTINCT CASE\n    WHEN LICENSE_TYPE = 'Purchase'\n  \
  \   AND PRICING_AND_PACKAGING = '2025'\n     AND ACCOUNT_EDITION IN ('Enterprise',\
  \ 'Professional')\n     AND STATUS = 'ACTIVATED'\n     AND ALTERYX_USER_EMAIL IS\
  \ NOT NULL\n     AND COPILOT_ENABLED = TRUE\n     AND DESIGNER_ACTIVATION_STATUS\
  \ = TRUE\n     AND DESIGNER_OFFLINE_ACTIVATION = FALSE\n     AND MAXIMUM_RAW_PRODUCT_VERSION\
  \ = '2025.2'\n    THEN USER_ID_RAW\nEND) AS COPILOT_ELIGIBLE_USERS\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT"
tags:
- copilot
- engagement
- metrics
