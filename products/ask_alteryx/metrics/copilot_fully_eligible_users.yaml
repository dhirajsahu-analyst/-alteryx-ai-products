id: copilot_fully_eligible_users
name: Copilot Fully Eligible Users
description: 'Count of users meeting ALL Copilot eligibility criteria: Purchase, 2025
  pricing, Enterprise/Professional, ACTIVATED, Copilot enabled, Designer activated
  (online), version 2025.2+.'
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: 'Final tier: fully eligible users meeting all requirements for Copilot
    usage.'
  technical: Count of distinct USER_ID_RAW meeting all criteria including DESIGNER_ACTIVATION_STATUS=TRUE
    AND DESIGNER_OFFLINE_ACTIVATION=FALSE.
source: COPILOT_ACTIVITY_USAGE_AT
sql_template: 'SELECT COUNT(DISTINCT CASE WHEN LICENSE_TYPE = ''Purchase'' AND PRICING_AND_PACKAGING = ''2025'' AND ACCOUNT_EDITION IN (''Enterprise'', ''Professional'') AND STATUS = ''ACTIVATED'' AND ALTERYX_USER_EMAIL IS NOT NULL AND COPILOT_ENABLED = TRUE AND DESIGNER_ACTIVATION_STATUS = TRUE AND DESIGNER_OFFLINE_ACTIVATION = FALSE AND MAXIMUM_RAW_PRODUCT_VERSION = ''2025.2'' THEN USER_ID_RAW END) AS COPILOT_ELIGIBLE_USERS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT'
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
