id: copilot_high_activity_accounts
name: Copilot High Activity Accounts
description: Count of accounts with high Copilot usage and engagement activity
product: ask_alteryx
status: validated
category: engagement
definition:
  business: Count of accounts with high Copilot usage and engagement activity
  technical: '[''ENGAGED_ACCOUNTS''] from COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "CREATE OR REPLACE VIEW DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW(\n\
  \    ONBOARDED_ACCOUNTS COMMENT 'Distinct Purchase accounts with at least one AACP\
  \ user present in the source data.',\n    ACTIVE_ACCOUNTS COMMENT 'Distinct onboarded\
  \ accounts with at least one chat activity.',\n    ACCOUNTS_WITH_AT_LEAST_1_WORKFLOW\
  \ COMMENT 'Distinct active accounts with at least one non-empty workflow ID, indicating\
  \ that a workflow was created or associated with chat activity.',\n    ENGAGED_ACCOUNTS\
  \ COMMENT 'Distinct accounts with at least one AACP user who has created five or\
  \ more distinct conversations.'\n) AS\nWITH engaged_accounts AS (\n    SELECT\n\
  \        billing_account_id_raw\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  \    WHERE license_type = 'Purchase'\n      AND user_type = 'aacp'\n      AND chat_id\
  \ IS NOT NULL\n      AND billing_account_id_raw IS NOT NULL\n    GROUP BY\n    \
  \    billing_account_id_raw,\n        created_by_id\n    HAVING COUNT(DISTINCT conversation_id)\
  \ >= 5\n)\nSELECT\n    COUNT(DISTINCT billing_account_id_raw) AS onboarded_accounts,\n\
  \    COUNT(DISTINCT CASE\n        WHEN chat_id IS NOT NULL\n        THEN billing_account_id_raw\n\
  \    END) AS active_accounts,\n    COUNT(DISTINCT CASE\n        WHEN chat_id IS\
  \ NOT NULL\n         AND workflow_id IS NOT NULL\n         AND workflow_id <> ''\n\
  \        THEN billing_account_id_raw\n    END) AS accounts_with_at_least_1_workflow,\n\
  \    COUNT(DISTINCT CASE\n        WHEN billing_account_id_raw IN (\n           \
  \ SELECT billing_account_id_raw\n            FROM engaged_accounts\n        )\n\
  \        THEN billing_account_id_raw\n    END) AS engaged_accounts\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  WHERE license_type = 'Purchase'\n  AND user_type = 'aacp'\n  AND billing_account_id_raw\
  \ IS NOT NULL;\n\n\n-- ----------------------------------------------------------------------------\n\
  -- 4. View: COPILOT_USERS_ACTIVITY_FUNNEL.VIEW\n-- ----------------------------------------------------------------------------"
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters:
- ENGAGED_ACCOUNTS > 0
depends_on:
- copilot_onboarded_accounts
related_metrics:
- copilot_highly_engaged_users
- copilot_account_engagement_rate
maintainer: analytics@alteryx.com
tags:
- engagement
- copilot
- high-value-accounts
- volume
last_updated: '2026-08-03'
version: '1.0'
