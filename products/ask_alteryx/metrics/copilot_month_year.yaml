id: copilot_month_year
name: Copilot Account Funnel - Month
description: Reporting month for account eligibility funnel (DATE GRAIN for monthly
  tracking).
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: The month dimension for monthly account-level Copilot eligibility reporting.
  technical: YEAR_MONTH cast to DATE, representing the first day of the reporting
    month.
source: ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
sql_template: 'SELECT YEAR_MONTH::DATE AS MONTH_YEAR FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT WHERE PRODUCT_NAME = ''ALTERYX'' AND LICENSE_TYPE = ''Purchase'' AND YEAR_MONTH > ''2026-01-01'' ORDER BY YEAR_MONTH::DATE DESC LIMIT 1'
