id: copilot_onboarded_accounts
name: Copilot Onboarded Accounts
description: Total number of accounts with Copilot activity.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: All accounts that have recorded any Copilot interaction by users with
    Purchase license and aacp user type.
  technical: Count of distinct billing_account_id_raw from COPILOT_ACTIVITY_USAGE_AT
    table filtered by license_type='Purchase' and user_type='aacp'.
source: COPILOT_VIEWS
sql_template: |
  SELECT ONBOARDED_ACCOUNTS
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW
tags:
- copilot
- engagement
- metrics
