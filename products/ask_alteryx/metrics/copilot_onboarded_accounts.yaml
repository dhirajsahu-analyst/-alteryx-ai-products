  SELECT ONBOARDED_ACCOUNTS as onboarded_accounts_count FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW WHERE ONBOARDED_ACCOUNTS > 0 LIMIT 100
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters:
- ONBOARDED_ACCOUNTS > 0
depends_on: []
related_metrics:
- copilot_active_accounts
