id: copilot_onboarded_accounts
name: Copilot Onboarded Accounts
description: Total count of accounts that have initiated Copilot onboarding
product: ask_alteryx
status: validated
category: volume
definition:
  business: Total count of accounts that have initiated Copilot onboarding
  technical: '[''ONBOARDED_ACCOUNTS''] from COPILOT_ACCOUNTS_ACTIVITY_FUNNEL_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
