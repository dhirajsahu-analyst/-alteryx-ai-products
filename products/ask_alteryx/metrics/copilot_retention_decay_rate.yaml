id: copilot_retention_decay_rate
name: Copilot Retention Decay Rate
description: Percentage point drop-off between 7-15 day and 30-60 day retention rates
product: ask_alteryx
status: validated
category: retention
definition:
  business: Percentage point drop-off between 7-15 day and 30-60 day retention rates
  technical: '[''RETURNING_RATE_PCT (both views)''] from COPILOT_7_15_RETENTION_RATE_VIEW + COPILOT_30_60_RETENTION_RATE_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |-
  SELECT (r7.RETURNING_RATE_PCT - r30.RETURNING_RATE_PCT) as retention_decay_pct FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_7_15_RETENTION_RATE_VIEW r7 CROSS JOIN DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_30_60_RETENTION_RATE_VIEW r30 LIMIT 1
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on:
- copilot_7_15_day_retention
- copilot_30_60_day_retention
related_metrics:
- copilot_user_churn_rate
- copilot_cohort_retention_analysis
maintainer: analytics@alteryx.com
tags:
- retention
- copilot
- churn-risk
- quality-metric
last_updated: '2026-08-03'
version: '1.0'
