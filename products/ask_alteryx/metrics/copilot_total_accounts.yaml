  technical: Count of distinct BILLING_ACCOUNT_ID_RAW by month.
source: ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT
sql_template: 'SELECT COUNT(DISTINCT BILLING_ACCOUNT_ID_RAW) AS TOTAL_AYX_ACCOUNTS FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_ADAPTION_USAGE_AT WHERE PRODUCT_NAME = ''ALTERYX'' AND LICENSE_TYPE = ''Purchase'' AND YEAR_MONTH > ''2026-01-01'''
