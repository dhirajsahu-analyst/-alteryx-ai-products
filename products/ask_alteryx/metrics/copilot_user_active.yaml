id: copilot_user_active
name: Copilot Active Users
description: Number of users with at least one Copilot chat activity.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Users who have created at least one chat conversation, indicating engagement.
  technical: Count of distinct USER_ID_RAW where CHAT_ID IS NOT NULL.
source: COPILOT_ACTIVITY_USAGE_AT
sql_template: 'SELECT COUNT(DISTINCT CASE WHEN CHAT_ID IS NOT NULL THEN USER_ID_RAW END) AS ACTIVE_USERS
FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT
WHERE LICENSE_TYPE = ''Purchase'' AND USER_TYPE = ''aacp'' AND USER_EMAIL IS NOT NULL'
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
