id: copilot_user_churn_rate
name: Copilot User Churn Rate
description: Percentage of active users who become inactive in the next period
product: ask_alteryx
status: validated
category: retention
definition:
  business: Percentage of active users who become inactive in the next period
  technical: '[''TOTAL_USERS'', ''RETURNING_USERS_30_60D''] from COPILOT_30_60_RETENTION_RATE_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |-
  SELECT ROUND((TOTAL_USERS - RETURNING_USERS_30_60D) / TOTAL_USERS * 100, 2) as churn_rate_pct, (TOTAL_USERS - RETURNING_USERS_30_60D) as churned_users_count, TOTAL_USERS as total_users_cohort FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_30_60_RETENTION_RATE_VIEW WHERE TOTAL_USERS > 0 LIMIT 100
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters:
- TOTAL_USERS > 0
depends_on:
- copilot_30_60_day_retention
related_metrics:
- copilot_7_15_day_retention
- copilot_retention_decay_rate
maintainer: analytics@alteryx.com
tags:
- retention
- copilot
- churn
- risk-metric
last_updated: '2026-08-03'
version: '1.0'
