id: copilot_user_engaged
name: Copilot Engaged Users
description: Number of users with 5+ Copilot conversations (indicating engagement).
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: High-engagement users demonstrating strong adoption through multiple conversations.
  technical: Count of distinct USER_ID_RAW having COUNT(DISTINCT CONVERSATION_ID)
    >= 5.
source: COPILOT_ACTIVITY_USAGE_AT
sql_template: 'WITH engaged_users AS (
    SELECT USER_ID_RAW
    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT
    WHERE LICENSE_TYPE = ''Purchase'' AND USER_TYPE = ''aacp'' AND USER_EMAIL IS NOT NULL AND CHAT_ID IS NOT NULL
    GROUP BY USER_ID_RAW
    HAVING COUNT(DISTINCT CONVERSATION_ID) >= 5
)
SELECT COUNT(DISTINCT CASE WHEN USER_ID_RAW IN (SELECT USER_ID_RAW FROM engaged_users) THEN USER_ID_RAW END) AS ENGAGED_USERS
FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT
WHERE LICENSE_TYPE = ''Purchase'' AND USER_TYPE = ''aacp'' AND USER_EMAIL IS NOT NULL'
