id: copilot_user_engaged
name: Copilot Engaged Users
description: Number of users with 5+ Copilot conversations (indicating engagement).
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: High-engagement users demonstrating strong adoption through multiple conversations.
  technical: Count of distinct USER_ID_RAW having COUNT(DISTINCT CONVERSATION_ID)
    >= 5.
source: COPILOT_VIEWS
sql_template: |
  SELECT ENGAGED_USERS
