id: copilot_user_funnel_health
name: Copilot User Funnel Health
description: 'Multi-stage user funnel showing progression: Onboarded → Active → Workflow
  Users → Engaged'
product: ask_alteryx
status: validated
category: funnel
definition:
  business: 'Multi-stage user funnel showing progression: Onboarded → Active → Workflow
    Users → Engaged'
  technical: '[''ONBOARDED_USERS'', ''ACTIVE_USERS'', ''USERS_WITH_AT_LEAST_1_WORKFLOW'',
    ''ENGAGED_USERS''] from COPILOT_USERS_ACTIVITY_FUNNEL_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "CREATE OR REPLACE VIEW DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_USERS_ACTIVITY_FUNNEL_VIEW(\n\
  \    ONBOARDED_USERS COMMENT 'Distinct Purchase users of type AACP with a valid\
  \ email who are present in the source data.',\n    ACTIVE_USERS COMMENT 'Distinct\
  \ onboarded users with at least one chat activity.',\n    USERS_WITH_AT_LEAST_1_WORKFLOW\
  \ COMMENT 'Distinct active users with at least one non-empty workflow ID, indicating\
  \ that a workflow was created or associated with chat activity.',\n    ENGAGED_USERS\
  \ COMMENT 'Distinct users who have created five or more distinct conversations.'\n\
  ) AS\nWITH engaged_users AS (\n    SELECT\n        USER_ID_RAW\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  \    WHERE LICENSE_TYPE = 'Purchase'\n      AND USER_TYPE = 'aacp'\n      AND USER_EMAIL\
  \ IS NOT NULL\n      AND CHAT_ID IS NOT NULL\n    GROUP BY USER_ID_RAW\n    HAVING\
  \ COUNT(DISTINCT CONVERSATION_ID) >= 5\n)\nSELECT\n    COUNT(DISTINCT USER_ID_RAW)\
  \ AS ONBOARDED_USERS,\n    COUNT(DISTINCT CASE\n        WHEN CHAT_ID IS NOT NULL\n\
  \        THEN USER_ID_RAW\n    END) AS ACTIVE_USERS,\n    COUNT(DISTINCT CASE\n\
  \        WHEN CHAT_ID IS NOT NULL\n         AND WORKFLOW_ID IS NOT NULL\n      \
  \   AND WORKFLOW_ID <> ''\n        THEN USER_ID_RAW\n    END) AS USERS_WITH_AT_LEAST_1_WORKFLOW,\n\
  \    COUNT(DISTINCT CASE\n        WHEN USER_ID_RAW IN (\n            SELECT USER_ID_RAW\n\
  \            FROM engaged_users\n        )\n        THEN USER_ID_RAW\n    END) AS\
  \ ENGAGED_USERS\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  WHERE LICENSE_TYPE = 'Purchase'\n  AND USER_TYPE = 'aacp'\n  AND USER_EMAIL IS NOT\
  \ NULL;\n\n\n-- ----------------------------------------------------------------------------\n\
  -- 5. View: COPILOT_USERS_ADOPTION_RATE.VIEW\n-- ----------------------------------------------------------------------------"
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on:
- copilot_onboarded_users
- copilot_active_users
- copilot_highly_engaged_users
related_metrics:
