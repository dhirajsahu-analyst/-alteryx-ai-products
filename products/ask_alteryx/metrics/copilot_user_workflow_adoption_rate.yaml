id: copilot_user_workflow_adoption_rate
name: Copilot User Workflow Adoption Rate
description: Percentage of onboarded users who have created at least one Copilot workflow
product: ask_alteryx
status: validated
category: engagement
definition:
  business: Percentage of onboarded users who have created at least one Copilot workflow
  technical: '[''USERS_WITH_AT_LEAST_1_WORKFLOW'', ''ONBOARDED_USERS''] from COPILOT_USERS_ACTIVITY_FUNNEL_VIEW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |-
  SELECT ROUND(USERS_WITH_AT_LEAST_1_WORKFLOW / ONBOARDED_USERS * 100, 2) as workflow_adoption_rate_pct, USERS_WITH_AT_LEAST_1_WORKFLOW as users_with_workflow_count, ONBOARDED_USERS as onboarded_users_total FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_USERS_ACTIVITY_FUNNEL_VIEW WHERE ONBOARDED_USERS > 0 LIMIT 100
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters:
- ONBOARDED_USERS > 0
depends_on:
- copilot_onboarded_users
related_metrics:
- copilot_account_workflow_adoption_rate
- copilot_workflow_runs
maintainer: analytics@alteryx.com
tags:
- engagement
- copilot
- feature-adoption
- workflow-usage
last_updated: '2026-08-03'
version: '1.0'
