id: copilot_users_needing_engagement
name: Copilot Users Needing Engagement
description: Count of active users who have not yet reached engaged status (nurture
  opportunity)
product: ask_alteryx
status: validated
category: funnel
definition:
  business: Count of active users who have not yet reached engaged status (nurture
    opportunity)
  technical: '[''ACTIVE_USERS'', ''ENGAGED_USERS'']'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "WITH engaged_users AS (\n    SELECT\n        USER_ID_RAW\n    FROM\
  \ DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n    WHERE\
  \ LICENSE_TYPE = 'Purchase'\n      AND USER_TYPE = 'aacp'\n      AND USER_EMAIL\
  \ IS NOT NULL\n      AND CHAT_ID IS NOT NULL\n    GROUP BY USER_ID_RAW\n    HAVING\
  \ COUNT(DISTINCT CONVERSATION_ID) >= 5\n)\nSELECT\n    COUNT(DISTINCT USER_ID_RAW)\
  \ AS ONBOARDED_USERS,\n    COUNT(DISTINCT CASE\n        WHEN CHAT_ID IS NOT NULL\n\
  \        THEN USER_ID_RAW\n    END) AS ACTIVE_USERS,\n    COUNT(DISTINCT CASE\n\
  \        WHEN CHAT_ID IS NOT NULL\n         AND WORKFLOW_ID IS NOT NULL\n      \
  \   AND WORKFLOW_ID <> ''\n        THEN USER_ID_RAW\n    END) AS USERS_WITH_AT_LEAST_1_WORKFLOW,\n\
  \    COUNT(DISTINCT CASE\n        WHEN USER_ID_RAW IN (\n            SELECT USER_ID_RAW\n\
  \            FROM engaged_users\n        )\n        THEN USER_ID_RAW\n    END) AS\
  \ ENGAGED_USERS\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  WHERE LICENSE_TYPE = 'Purchase'\n  AND USER_TYPE = 'aacp'\n  AND USER_EMAIL IS NOT\
  \ NULL;"
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters:
- ACTIVE_USERS > ENGAGED_USERS
depends_on:
- copilot_active_users
- copilot_highly_engaged_users
related_metrics:
- copilot_user_engagement_rate
- copilot_user_funnel_health
maintainer: analytics@alteryx.com
tags:
- funnel
- copilot
- opportunity
- nurture
last_updated: '2026-08-03'
version: '1.0'
