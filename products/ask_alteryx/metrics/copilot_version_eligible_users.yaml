id: copilot_version_eligible_users
name: Copilot Version Eligible Users
description: Count of Enterprise/Professional users with Copilot enabled AND product
  version 2025.2 or higher.
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: 'Third tier of eligibility: enabled users with sufficient product version
    for Copilot features.'
  technical: Count of distinct USER_ID_RAW meeting enabled criteria AND MAXIMUM_RAW_PRODUCT_VERSION
    >= '2025.2'.
source: COPILOT_ACTIVITY_USAGE_AT
sql_template: 'SELECT COUNT(DISTINCT CASE WHEN LICENSE_TYPE = ''Purchase'' AND PRICING_AND_PACKAGING = ''2025'' AND ACCOUNT_EDITION IN (''Enterprise'', ''Professional'') AND STATUS = ''ACTIVATED'' AND ALTERYX_USER_EMAIL IS NOT NULL AND COPILOT_ENABLED = TRUE AND MAXIMUM_RAW_PRODUCT_VERSION >= ''2025.2'' THEN USER_ID_RAW END) AS ELIGIBLE_USERS_2025_2 FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT'
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
version: '1.0'
