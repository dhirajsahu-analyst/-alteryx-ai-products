id: copilot_workflow_adoption_pct
name: Copilot Workflow Adoption Rate
description: Percentage of Designer workflow runs (from Copilot-eligible users after
  first interaction) mapped to Copilot workflows (decimal ratio).
product: ask_alteryx
category: copilot_engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: The percentage of Designer workflows created using Copilot assistance
    among eligible users.
  technical: 'Calculated as: (mapped_copilot_workflows / total_eligible_user_workflows)
    * 100, returned as decimal ratio.'
source: COPILOT_VIEWS
sql_template: "WITH copilot_eligible_users AS (\n    SELECT DISTINCT\n        alteryx_user_email\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n\
  \    WHERE license_type = 'Purchase'\n      AND status = 'ACTIVATED'\n      AND\
  \ chat_id IS NOT NULL\n),\nfirst_copilot_interaction AS (\n    SELECT\n        LOWER(alteryx_user_email)\
  \ AS user_email,\n        MIN(conv_created_date) AS first_conv_created_at\n    FROM\
  \ DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\n    WHERE\
  \ chat_id IS NOT NULL\n      AND alteryx_user_email IS NOT NULL\n    GROUP BY 1\n\
  ),\ndenominator AS (\n    SELECT DISTINCT\n        es.workflow_id,\n        es.email_final\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.TEL_STRAT.COPILOT_ENGINE_RUN_VW es\n    INNER\
  \ JOIN copilot_eligible_users eu\n        ON LOWER(es.email_final) = LOWER(eu.alteryx_user_email)\n\
  \    INNER JOIN first_copilot_interaction fci\n        ON LOWER(es.email_final)\
  \ = fci.user_email\n    WHERE es.payload_dts >= '2025-12-03'::timestamp\n      AND\
  \ es.payload_dts >= fci.first_conv_created_at\n      AND ES.PRODUCT_NAME = 'Designer'\n\
  ),\nnumerator AS (\n    SELECT DISTINCT\n        es.workflow_id,\n        co.user_email\
  \ AS copilot_email,\n        es.email_final AS engine_email\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.COPILOT_ACTIVITY_USAGE_AT\
  \ co\n    LEFT JOIN DISCOVERY_PRODUCT_MANAGEMENT.TEL_STRAT.COPILOT_ENGINE_RUN_VW\
  \ es\n        ON co.workflow_id = es.workflow_id\n    WHERE co.workflow_id IS NOT\
  \ NULL\n      AND co.user_email IN (SELECT alteryx_user_email FROM copilot_eligible_users)\n\
  \      AND co.chat_id IS NOT NULL\n)\nSELECT ROUND(\n    100.0 *\n    (SELECT COUNT(DISTINCT\
  \ workflow_id) FROM numerator)::FLOAT /\n    NULLIF((SELECT COUNT(DISTINCT workflow_id)\
  \ FROM denominator), 0),\n    4\n) / 100.0 AS copilot_workflow_adoption_pct"
tags:
- copilot
- engagement
- metrics
maintainer: product-insights@alteryx.com
last_updated: '2026-08-05'
