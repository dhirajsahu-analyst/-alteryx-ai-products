id: aoa_alteryx_analytics_automation_2026_installation_and_activity
name: AOA (Alteryx Analytics Automation) 2026 Installation and Activity
description: Designer 2026 local client downloads, activations, and feature adoption
product: designer
status: validated
category: usage
definition:
  business: Track Designer 2026 adoption on local machines and engagement with core
    features
  technical: ''
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "create or replace view AOA_ON_DESIGNER_2026_AND_ACTIVITIES_VIEW(\n\t\
  AOA_INSTALL_USERS COMMENT 'The total number of unique Alteryx One users who have\
  \ installed the on-premises Alteryx Designer desktop client.',\n\tAOA_USERS_ON_2026\
  \ COMMENT 'The count of unique Alteryx One users active on Alteryx Designer version\
  \ 2026 or above.',\n\tUSERS_CREATED_WORKFLOW COMMENT 'The count of unique Alteryx\
  \ One users on 2026 who created a workflow.',\n\tUSERS_RUN_WORKFLOW COMMENT 'The\
  \ count of unique Alteryx One users on 2026 who executed a workflow.',\n\tUSERS_RUN_PLAN\
  \ COMMENT 'The count of unique Alteryx One users on 2026 who executed an orchestration\
  \ plan.',\n\tUSERS_CREATED_CONNECTION COMMENT 'The count of unique Alteryx One users\
  \ on 2026 who established a database connection profile.',\n\tUSERS_CREATED_DATASET\
  \ COMMENT 'The count of unique Alteryx One users on 2026 who created or cataloged\
  \ a dataset.'\n)\n as\n    WITH AOA_INSTALL AS\n    (SELECT COUNT(DISTINCT USER_ID)\
  \ AOA_INSTALL_USERS\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_ONE_DAILY_USERS_ONBOARDING_ADAPTION_USAGE_AT\n\
  \    WHERE USER_EMAIL IN\n    (SELECT DISTINCT USER_EMAIL\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.PI_CLOUD.AMPLITUDE_ALL_EVENTS_WITH_LICENSE\n\
  \    WHERE ACTION_SOURCE='desktop')\n    AND PRICING_AND_PACKAGING='2025' AND  LICENSE_TYPE='Purchase'\n\
  \    ),\n\n    DESIGNER_2026 AS\n    (SELECT COUNT(DISTINCT USER_ID) AOA_USERS_ON_2026,\
  \ COUNT(DISTINCT CASE WHEN DC_CREATE_WORKFLOW>0 THEN USER_ID END) USERS_CREATED_WORKFLOW,\
  \ COUNT(DISTINCT CASE WHEN DC_WORKFLOW_RUNS>0 THEN USER_ID END) USERS_RUN_WORKFLOW,\
  \ COUNT(DISTINCT CASE WHEN RUN_PLANS >0 THEN USER_ID END) USERS_RUN_PLAN, COUNT(DISTINCT\
  \ CASE WHEN CONNECTION_CREATED>0 THEN USER_ID END) USERS_CREATED_CONNECTION, COUNT(DISTINCT\
  \ CASE WHEN DATASETS_CREATED>0 THEN USER_ID END) AS USERS_CREATED_DATASET\n    FROM\
  \ DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_ONE_DAILY_USERS_ONBOARDING_ADAPTION_USAGE_AT\n\
  \    WHERE USER_EMAIL IN\n    (SELECT DISTINCT USER_EMAIL\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.PI_CLOUD.AMPLITUDE_ALL_EVENTS_WITH_LICENSE\n\
  \    WHERE ACTION_SOURCE='desktop' )\n    AND USER_ID IN (SELECT DISTINCT USER_ID\
  \ FROM DISCOVERY_PRODUCT_MANAGEMENT.PI_TELEMETRY_RAW.POSTGRES_LICENSEBILLING_TBL_MACHINE_USER\n\
  \    WHERE VERSION ILIKE '%2026%')\n    AND  LICENSE_TYPE='Purchase' AND PRICING_AND_PACKAGING='2025')\n\
  \n    SELECT * FROM\n    AOA_INSTALL A\n    CROSS JOIN DESIGNER_2026 B;"
queries: []
