id: designer_workflow_execution_volume
name: Designer Workflow Execution Volume
description: Monthly count of Designer workflows executed, broken down by product,
  OS, and features
product: designer
status: validated
category: usage
definition:
  business: Engagement metric showing Designer user activity and feature adoption
  technical: Aggregated with volume analysis
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n  MONTH,\n  PRODUCT_NAME,\n  PRODUCT_VERSION,\n  WORKFLOW_TYPE,\n\
  \  COUNT(DISTINCT PAYLOAD_ID) AS workflow_executions,\n  COUNT(DISTINCT MACHINE_ID_DECODED)\
  \ AS unique_machines,\n  COUNT(DISTINCT USER_EMAIL) AS unique_users,\n  ROUND(AVG(DURATION_NUM),\
  \ 2) AS avg_duration_seconds,\n  ROUND(SUM(DURATION_NUM) / 60.0, 2) AS total_compute_minutes\n\
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ENGINE_DESIGNER_SERVER_RUN_WITH_ASSET_TYPE_VIEW\n\
  WHERE PRODUCT_NAME = 'Designer'\nGROUP BY MONTH, PRODUCT_NAME, PRODUCT_VERSION,\
  \ WORKFLOW_TYPE\nORDER BY MONTH DESC, workflow_executions DESC\nLIMIT 100"
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters:
- PRODUCT_NAME = 'Designer'
depends_on: []
related_metrics:
- designer_008
- designer_009
maintainer: analytics@alteryx.com
tags:
- usage
- designer
