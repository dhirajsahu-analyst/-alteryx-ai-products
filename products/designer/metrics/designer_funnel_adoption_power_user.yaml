id: designer_funnel_adoption_power_user
name: Designer - Funnel Adoption - Power User
description: Power users of Designer
product: designer
category: funnel_adoption
status: active
freshness: daily
grain: point_in_time
definition:
  business: Power users of Designer
  technical: Count of distinct entities meeting power_user criteria from designer
    data sources.
source: DESIGNER_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN POWER_USER IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_USAGE_AT\n    WHERE\
  \ CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS power_user\n\
  FROM base_metrics\nWHERE is_active = 1"
tags:
- funnel_adoption
- funnel
- conversion
- adoption
- rate-metric
