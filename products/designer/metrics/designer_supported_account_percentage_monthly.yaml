id: designer_supported_account_percentage_monthly
name: Designer Supported Account Percentage Monthly
description: Monthly percentage of Designer accounts running a supported version
product: designer
status: validated
category: adoption
definition:
  business: Account-level support health metric for Designer product line
  technical: From DESIGNER_SERVER_SUPPORTED_UNSUPPORTED_ACCOUNT_PERCENTAGE_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    MONTH,
    DESIGNER_PCT_SUPPORTED,
    ROUND(100 - DESIGNER_PCT_SUPPORTED, 2) AS designer_pct_unsupported,
    LAG(DESIGNER_PCT_SUPPORTED) OVER (ORDER BY MONTH) AS prev_month_pct,
    ROUND(DESIGNER_PCT_SUPPORTED - LAG(DESIGNER_PCT_SUPPORTED) OVER (ORDER BY MONTH), 2) AS mom_change_pct
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_SERVER_SUPPORTED_UNSUPPORTED_ACCOUNT_PERCENTAGE_VIEW
  WHERE MONTH >= DATEADD('MONTH', -12, CURRENT_DATE())
  ORDER BY MONTH DESC
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters:
- MONTH >= DATEADD('MONTH', -12, CURRENT_DATE())
depends_on: []
related_metrics:
- designer_005
- designer_006
maintainer: analytics@alteryx.com
tags:
- adoption
- designer
