id: designer_supported_machine_percentage_monthly
name: Designer Supported Machine Percentage Monthly
description: Monthly percentage of Designer machines running supported versions
product: designer
status: validated
category: adoption
definition:
  business: Infrastructure health metric tracking Designer machine modernization
  technical: From DESIGNER_SERVER_SUPPORTED_UNSUPPORTED_MACHINE_PERCENTAGE_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    DATE(MONTH) AS MONTH,\n    COUNT(DISTINCT CASE WHEN PRODUCT_ID\
  \ = 'Alteryx Designer'\n                         AND \"Supported_Unsupported\" =\
  \ 'Supported'\n                        THEN MACHINE_ID ELSE NULL END)\n        /\
  \ NULLIF(COUNT(DISTINCT CASE WHEN PRODUCT_ID = 'Alteryx Designer'\n            \
  \            THEN MACHINE_ID ELSE NULL END), 0) AS DESIGNER_PCT_SUPPORTED,\n   \
  \ COUNT(DISTINCT CASE WHEN PRODUCT_ID = 'Alteryx Server'\n                     \
  \    AND \"Supported_Unsupported\" = 'Supported'\n                        THEN MACHINE_ID\
  \ ELSE NULL END)\n        / NULLIF(COUNT(DISTINCT CASE WHEN PRODUCT_ID = 'Alteryx\
  \ Server'\n                        THEN MACHINE_ID ELSE NULL END), 0) AS SERVER_PCT_SUPPORTED\n\
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION\nWHERE PRODUCT_ID\
  \ IN ('Alteryx Designer', 'Alteryx Server')\n  AND MONTH >= DATE_TRUNC('MONTH',\
  \ DATEADD('MONTH', -6, CURRENT_DATE))\nGROUP BY MONTH\nORDER BY MONTH DESC;"
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters:
- MONTH >= DATEADD('MONTH', -12, CURRENT_DATE())
depends_on: []
related_metrics:
- designer_004
- designer_005
maintainer: analytics@alteryx.com
tags:
- adoption
- designer
