id: plan_ownership
name: Plan Ownership
description: Plans ownership information
product: plans
status: validated
category: product_metric
definition:
  business: Plan Ownership - Plans ownership information
  technical: Query
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables:
  - DISCOVERY_PRODUCT_MANAGEMENT
sql_template: "SELECT\n\n    TO_CHAR(DATE_TRUNC('MONTH', PLAN_CREATED_AT), 'MON YYYY')\
  \ AS MONTH,\n\n    -- Number of plans created during the month.\n    COUNT(DISTINCT\
  \ PLAN_ID) AS CREATED_PLANS,\n\n    -- Number of unique users who created at least\
  \ one plan during the month.\n    COUNT(DISTINCT USER_ID) AS PLAN_CREATORS,\n\n\
  \    -- Number of unique workspaces where plans were created during the month.\n\
  \    COUNT(DISTINCT WORKSPACE_ID) AS ACTIVE_WORKSPACES,\n\n    -- Number of unique\
  \ billing accounts that created plans during the month.\n    COUNT(DISTINCT BILLING_ACCOUNT_ID_RAW)\
  \ AS ACTIVE_BILLING_ACCOUNTS,\n\n    -- Average number of plans created per unique\
  \ user during the month.\n    ROUND(\n        COUNT(DISTINCT PLAN_ID)\n        /\
  \ NULLIF(COUNT(DISTINCT USER_ID), 0),\n        2\n    ) AS PLANS_PER_CREATOR,\n\n\
  \    -- Average number of plans created per workspace during the month.\n    ROUND(\n\
  \        COUNT(DISTINCT PLAN_ID)\n        / NULLIF(COUNT(DISTINCT WORKSPACE_ID),\
  \ 0),\n        2\n    ) AS PLANS_PER_WORKSPACE,\n\n    -- Average number of plans\
  \ created per billing account during the month.\n    ROUND(\n        COUNT(DISTINCT\
  \ PLAN_ID)\n        / NULLIF(COUNT(DISTINCT BILLING_ACCOUNT_ID_RAW), 0),\n     \
  \   2\n    ) AS PLANS_PER_BILLING_ACCOUNT\n\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_FACT_AT\n\
  \nWHERE PLAN_CREATED_AT >= DATEADD(\n        MONTH,\n        -2,\n        DATE_TRUNC('MONTH',\
  \ CURRENT_DATE())\n    )\n  AND LICENSE_TYPE = 'Purchase'\n\n-- Optional Dimension\
  \ Filters\n-- AND BILLING_ACCOUNT_ID_RAW = '<billing-account-id>'\n-- AND PIPELINE_REGION\
  \ = 'US'\n-- AND ACCOUNT_EDITION = 'Enterprise'\n-- AND PRICING_AND_PACKAGING =\
  \ '2025'\n-- AND WORKSPACE_ID = '<workspace-id>'\n-- AND USER_ID = '<user-id>'\n\
  \nGROUP BY DATE_TRUNC('MONTH', PLAN_CREATED_AT)\n\nORDER BY DATE_TRUNC('MONTH',\
  \ PLAN_CREATED_AT);"
