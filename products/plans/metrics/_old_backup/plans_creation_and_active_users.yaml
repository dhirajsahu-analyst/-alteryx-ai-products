id: plans_creation_and_active_users
name: Plans Creation and Active Users
description: Tracks plans creation and active user counts
product: plans
status: validated
category: product_metric
definition:
  business: Plans Creation and Active Users - Tracks plans creation and active user
    counts
  technical: Query
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables:
  - DISCOVERY_PRODUCT_MANAGEMENT
sql_template: "SELECT\n    TO_CHAR(\n        DATE_TRUNC('MONTH', YEAR_MONTH),\n  \
  \      'Mon-YYYY'\n    ) AS MONTH,\n\n    COUNT(\n        DISTINCT IFF(\n      \
  \      CREATED_PLAN > 0,\n            BILLING_ACCOUNT_ID,\n            NULL\n  \
  \      )\n    ) AS ACCOUNTS_CREATED_PLANS,\n\n    SUM(ACTIVE_USERS_AMPLITUDE) AS\
  \ PLANS_ACTIVE_USERS\n\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_MONTHLY_ACCOUNT_AT\n\
  \nWHERE YEAR_MONTH >= DATE_TRUNC(\n    'MONTH',\n    DATEADD(\n        MONTH,\n\
  \        -2,\n        CURRENT_DATE()\n    )\n)\n\nGROUP BY\n    DATE_TRUNC('MONTH',\
  \ YEAR_MONTH)\n\nORDER BY\n    DATE_TRUNC('MONTH', YEAR_MONTH);"
