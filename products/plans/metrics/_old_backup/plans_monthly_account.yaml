id: plans_monthly_account
name: Plans Monthly Account Metrics
description: Monthly account-level metrics for Plans
product: plans
status: validated
category: product_metric
definition:
  business: Plans Monthly Account Metrics - Monthly account-level metrics for Plans
  technical: Query from PLANS_MONTHLY_ACCOUNT_AV
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables:
  - ACCOUNT_BASE
  - BASE_DAILY
  - PLANS_GRANULAR
  - DISCOVERY_PRODUCT_MANAGEMENT
sql_template: |-
  SELECT DISTINCT
          DATE_TRUNC('MONTH', YEAR_MONTH)::DATE AS YEAR_MONTH,
          BILLING_ACCOUNT_ID,
          BILLING_ACCOUNT_ID_RAW,
          SFDC_ACCOUNT_ID,
          ACCOUNT_CID,
          BILLING_ACCOUNT_NAME,
          NAMED_COMPANY,
          PIPELINE_REGION,
          LICENSE_TYPE,
          ACCOUNT_EDITION,
          PRICING_AND_PACKAGING
      FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_AT
  ),

  /* ================================================================
     Updated daily Plans user aggregate
     ================================================================ */
  BASE_DAILY AS (
      SELECT *
      FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_DAILY_USERS_AT
  ),

  /* ================================================================
     Granular user-plan activity
     ================================================================ */
  PLANS_GRANULAR AS (
      SELECT *
      FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_DAILY_USER_GRANULAR_AT
  ),

  /* ================================================================
     Daily user-to-account mapping.
     The daily Plans table is already unique at DATE + USER_ID + WORKSPACE_ID.
     ================================================================ */
  DAILY_ACCOUNT_MAP AS (
      SELECT
          DATE,
          USER_ID,
          WORKSPACE_ID,
          BILLING_ACCOUNT_ID,
          BILLING_ACCOUNT_ID_RAW,
          SFDC_ACCOUNT_ID,
          ACCOUNT_CID,
          BILLING_ACCOUNT_NAME,
          NAMED_COMPANY,
          PIPELINE_REGION,
          LICENSE_TYPE,
          ACCOUNT_EDITION,
          PRICING_AND_PACKAGING
      FROM BASE_DAILY
  ),

  /* ================================================================
     Monthly roll-up of additive user/day metrics.
     ================================================================ */
  MONTHLY_DAILY_AGG AS (
      SELECT
          DATE_TRUNC('MONTH', DATE)::DATE AS YEAR_MONTH,
          BILLING_ACCOUNT_ID,
          BILLING_ACCOUNT_ID_RAW,
          SFDC_ACCOUNT_ID,
          ACCOUNT_CID,
          BILLING_ACCOUNT_NAME,
          NAMED_COMPANY,
          PIPELINE_REGION,
          LICENSE_TYPE,
          ACCOUNT_EDITION,
          PRICING_AND_PACKAGING,

          COUNT(DISTINCT USER_ID) AS TOTAL_USERS,
          COUNT(DISTINCT IFF(CREATED_PLAN > 0, USER_ID, NULL)) AS USERS_CREATED_PLAN,
          COUNT(DISTINCT IFF(AVAILABLE_PLANS > 0, USER_ID, NULL)) AS USERS_WITH_AVAILABLE_PLANS,

          SUM(COALESCE(AVAILABLE_PLANS, 0)) AS AVAILABLE_PLANS,
          SUM(COALESCE(CREATED_PLAN, 0)) AS CREATED_PLAN,

          SUM(COALESCE(PLANS_WITH_WORKFLOW_TASK, 0)) AS PLANS_WITH_WORKFLOW_TASK,
          SUM(COALESCE(PLANS_WITH_FLOW_TASK, 0)) AS PLANS_WITH_FLOW_TASK,
          SUM(COALESCE(PLANS_WITH_HTTP_TASK, 0)) AS PLANS_WITH_HTTP_TASK,
          SUM(COALESCE(PLANS_WITH_EMAIL_TASK, 0)) AS PLANS_WITH_EMAIL_TASK,
          SUM(COALESCE(PLANS_WITH_AI_DATASET_TASK, 0)) AS PLANS_WITH_AI_DATASET_TASK,
          SUM(COALESCE(PLANS_WITH_CEFD_TASK, 0)) AS PLANS_WITH_CEFD_TASK,
          SUM(COALESCE(PLANS_WITH_ML_TASK, 0)) AS PLANS_WITH_ML_TASK,
          SUM(COALESCE(PLANS_WITHOUT_TASK, 0)) AS PLANS_WITHOUT_TASK,
          SUM(COALESCE(PLANS_WITH_APPROVAL_TASK, 0)) AS PLANS_WITH_APPROVAL_TASK,
          SUM(COALESCE(PLANS_WITH_CONDITION_TASK, 0)) AS PLANS_WITH_CONDITION_TASK,
          SUM(COALESCE(PLANS_WITH_DELAY_TASK, 0)) AS PLANS_WITH_DELAY_TASK,
          SUM(COALESCE(PLANS_WITH_LI_PROJECT_REPLY_TASK, 0)) AS PLANS_WITH_LI_PROJECT_REPLY_TASK,
          SUM(COALESCE(PLANS_WITH_ML_PROJECT_UPDATE_TASK, 0)) AS PLANS_WITH_ML_PROJECT_UPDATE_TASK,
          SUM(COALESCE(PLANS_WITH_REPORTING_GENERATE_TASK, 0)) AS PLANS_WITH_REPORTING_GENERATE_TASK,
          SUM(COALESCE(PLANS_WITH_STORAGE_TASK, 0)) AS PLANS_WITH_STORAGE_TASK,

          SUM(COALESCE(TOTAL_TASKS_EVER, 0)) AS TOTAL_TASKS_EVER,
          DIV0(
              SUM(COALESCE(TOTAL_TASKS_EVER, 0)),
              SUM(COALESCE(CREATED_PLAN, 0))
          ) AS AVG_TASKS_PER_PLAN_EVER,

          SUM(COALESCE(PLAN_RUN, 0)) AS PLAN_RUN,
          SUM(COALESCE(COMPLETED_PLAN_RUNS, 0)) AS COMPLETED_PLAN_RUNS,
          SUM(COALESCE(INPROGRESS_PLAN_RUNS, 0)) AS INPROGRESS_PLAN_RUNS,
          SUM(COALESCE(CREATED_PLAN_RUNS, 0)) AS CREATED_PLAN_RUNS,
          SUM(COALESCE(CANCELLED_PLAN_RUNS, 0)) AS CANCELLED_PLAN_RUNS,
          SUM(COALESCE(FAILED_PLAN_RUNS, 0)) AS FAILED_PLAN_RUNS,
          SUM(COALESCE(MANUAL_PLAN_RUNS, 0)) AS MANUAL_PLAN_RUNS,
          SUM(COALESCE(SCHEDULE_PLAN_RUNS, 0)) AS SCHEDULE_PLAN_RUNS,
          SUM(COALESCE(API_PLAN_RUNS, 0)) AS API_PLAN_RUNS,
          SUM(COALESCE(AUTOMATED_PLAN_RUNS, 0)) AS AUTOMATED_PLAN_RUNS,

          COUNT(DISTINCT IFF(
              DATE_TRUNC('MONTH', DATE) = DATE_TRUNC('MONTH', FIRST_PLAN_CREATED_AT),
              USER_ID,
              NULL
          )) AS USERS_FIRST_TIME_PLAN_CREATORS,

          COUNT(DISTINCT IFF(
              DATE_TRUNC('MONTH', DATE) = DATE_TRUNC('MONTH', FIRST_PLAN_RUN_AT),
              USER_ID,
              NULL
          )) AS USERS_FIRST_TIME_PLAN_RUNNERS,

          COUNT(DISTINCT IFF(COALESCE(SHARE_PLAN, 0) > 0, USER_ID, NULL)) AS SHARE_PLAN_AMPLITUDE,
          COUNT(DISTINCT IFF(COALESCE(ACTIVE_USERS, 0) = 1, USER_ID, NULL)) AS ACTIVE_USERS_AMPLITUDE,
          COUNT(DISTINCT IFF(COALESCE(ENGAGED_USERS_AMPLITUDE, 0) = 1, USER_ID, NULL)) AS ENGAGED_USERS_AMPLITUDE,

          /* New monthly user-activity metrics from the upgraded daily table */
          COUNT(DISTINCT IFF(COALESCE(PLANS_WORKED_ON, 0) > 0, USER_ID, NULL)) AS USERS_WORKED_ON_PLANS,
          COUNT(DISTINCT IFF(COALESCE(PLANS_EDITED, 0) > 0, USER_ID, NULL)) AS USERS_EDITED_PLANS,
          COUNT(DISTINCT IFF(COALESCE(PLANS_WITH_TASK_CHANGES, 0) > 0, USER_ID, NULL)) AS USERS_CHANGED_PLAN_TASKS,
          COUNT(DISTINCT IFF(COALESCE(PLANS_RUN_BY_USER, 0) > 0, USER_ID, NULL)) AS USERS_RAN_PLANS,

          SUM(COALESCE(PLAN_CREATED_ACTIVITY_COUNT, 0)) AS PLAN_CREATED_ACTIVITY_COUNT,
          SUM(COALESCE(PLAN_EDIT_COUNT, 0)) AS PLAN_EDIT_COUNT,
          SUM(COALESCE(TASK_CREATED_COUNT, 0)) AS TASK_CREATED_COUNT,
          SUM(COALESCE(TASK_UPDATED_COUNT, 0)) AS TASK_UPDATED_COUNT,
          SUM(COALESCE(TASK_DELETED_COUNT, 0)) AS TASK_DELETED_COUNT

      FROM BASE_DAILY
      GROUP BY
          DATE_TRUNC('MONTH', DATE),
          BILLING_ACCOUNT_ID,
          BILLING_ACCOUNT_ID_RAW,
          SFDC_ACCOUNT_ID,
          ACCOUNT_CID,
          BILLING_ACCOUNT_NAME,
          NAMED_COMPANY,
          PIPELINE_REGION,
          LICENSE_TYPE,
          ACCOUNT_EDITION,
          PRICING_AND_PACKAGING
  ),

  /* ================================================================
     True monthly distinct plans from the granular layer.
     This replaces the previous raw-run join and avoids summing daily
     distinct-plan counts across multiple days.
     ================================================================ */
  GRANULAR_ACCOUNT_MONTH AS (
      SELECT
          DATE_TRUNC('MONTH', G.ACTIVITY_DATE)::DATE AS YEAR_MONTH,
          M.BILLING_ACCOUNT_ID,
          M.BILLING_ACCOUNT_ID_RAW,
          M.SFDC_ACCOUNT_ID,
          M.ACCOUNT_CID,
          M.BILLING_ACCOUNT_NAME,
          M.NAMED_COMPANY,
          M.PIPELINE_REGION,
          M.LICENSE_TYPE,
          M.ACCOUNT_EDITION,
          M.PRICING_AND_PACKAGING,

          COUNT(DISTINCT G.PLAN_ID) AS PLANS_WORKED_ON,

          COUNT(DISTINCT IFF(
              COALESCE(G.IS_PLAN_CREATOR, 0) = 1,
              G.PLAN_ID,
              NULL
          )) AS PLANS_CREATED_BY_ACTIVITY,

          COUNT(DISTINCT IFF(
              COALESCE(G.IS_PLAN_EDITOR_PRIMARY, 0) = 1,
              G.PLAN_ID,
              NULL
          )) AS PLANS_EDITED,

          COUNT(DISTINCT IFF(
              COALESCE(G.IS_TASK_CONTRIBUTOR, 0) = 1,
              G.PLAN_ID,
              NULL
          )) AS PLANS_WITH_TASK_CHANGES,

          COUNT(DISTINCT IFF(
              COALESCE(G.PLAN_RUN_COUNT, 0) > 0,
              G.PLAN_ID,
              NULL
          )) AS PLAN_WITH_RUNS,

          COUNT(DISTINCT IFF(
              COALESCE(G.AUTOMATED_PLAN_RUN_COUNT, 0) > 0,
              G.PLAN_ID,
              NULL
          )) AS AUTOMATED_PLANS

      FROM PLANS_GRANULAR G
      JOIN DAILY_ACCOUNT_MAP M
        ON G.ACTIVITY_DATE = M.DATE
       AND G.USER_ID = M.USER_ID
       AND G.WORKSPACE_ID = M.WORKSPACE_ID
      GROUP BY
          DATE_TRUNC('MONTH', G.ACTIVITY_DATE),
          M.BILLING_ACCOUNT_ID,
          M.BILLING_ACCOUNT_ID_RAW,
          M.SFDC_ACCOUNT_ID,
          M.ACCOUNT_CID,
          M.BILLING_ACCOUNT_NAME,
          M.NAMED_COMPANY,
          M.PIPELINE_REGION,
          M.LICENSE_TYPE,
          M.ACCOUNT_EDITION,
          M.PRICING_AND_PACKAGING
  )

  SELECT
      A.YEAR_MONTH,
      A.BILLING_ACCOUNT_ID,
      A.BILLING_ACCOUNT_ID_RAW,
      A.SFDC_ACCOUNT_ID,
      A.ACCOUNT_CID,
      A.BILLING_ACCOUNT_NAME,
      A.NAMED_COMPANY,
      A.PIPELINE_REGION,
      A.LICENSE_TYPE,
      A.ACCOUNT_EDITION,
      A.PRICING_AND_PACKAGING,

      COALESCE(M.TOTAL_USERS, 0) AS TOTAL_USERS,
      COALESCE(M.USERS_CREATED_PLAN, 0) AS USERS_CREATED_PLAN,
      COALESCE(M.USERS_WITH_AVAILABLE_PLANS, 0) AS USERS_WITH_AVAILABLE_PLANS,

      COALESCE(M.AVAILABLE_PLANS, 0) AS AVAILABLE_PLANS,
      COALESCE(M.CREATED_PLAN, 0) AS CREATED_PLAN,

      COALESCE(M.PLANS_WITH_WORKFLOW_TASK, 0) AS PLANS_WITH_WORKFLOW_TASK,
      COALESCE(M.PLANS_WITH_FLOW_TASK, 0) AS PLANS_WITH_FLOW_TASK,
      COALESCE(M.PLANS_WITH_HTTP_TASK, 0) AS PLANS_WITH_HTTP_TASK,
      COALESCE(M.PLANS_WITH_EMAIL_TASK, 0) AS PLANS_WITH_EMAIL_TASK,
      COALESCE(M.PLANS_WITH_AI_DATASET_TASK, 0) AS PLANS_WITH_AI_DATASET_TASK,
      COALESCE(M.PLANS_WITH_CEFD_TASK, 0) AS PLANS_WITH_CEFD_TASK,
      COALESCE(M.PLANS_WITH_ML_TASK, 0) AS PLANS_WITH_ML_TASK,
      COALESCE(M.PLANS_WITHOUT_TASK, 0) AS PLANS_WITHOUT_TASK,
      COALESCE(M.PLANS_WITH_APPROVAL_TASK, 0) AS PLANS_WITH_APPROVAL_TASK,
      COALESCE(M.PLANS_WITH_CONDITION_TASK, 0) AS PLANS_WITH_CONDITION_TASK,
      COALESCE(M.PLANS_WITH_DELAY_TASK, 0) AS PLANS_WITH_DELAY_TASK,
      COALESCE(M.PLANS_WITH_LI_PROJECT_REPLY_TASK, 0) AS PLANS_WITH_LI_PROJECT_REPLY_TASK,
      COALESCE(M.PLANS_WITH_ML_PROJECT_UPDATE_TASK, 0) AS PLANS_WITH_ML_PROJECT_UPDATE_TASK,
      COALESCE(M.PLANS_WITH_REPORTING_GENERATE_TASK, 0) AS PLANS_WITH_REPORTING_GENERATE_TASK,
      COALESCE(M.PLANS_WITH_STORAGE_TASK, 0) AS PLANS_WITH_STORAGE_TASK,

      COALESCE(M.TOTAL_TASKS_EVER, 0) AS TOTAL_TASKS_EVER,
      COALESCE(M.AVG_TASKS_PER_PLAN_EVER, 0) AS AVG_TASKS_PER_PLAN_EVER,

      COALESCE(M.PLAN_RUN, 0) AS PLAN_RUN,
      COALESCE(M.COMPLETED_PLAN_RUNS, 0) AS COMPLETED_PLAN_RUNS,
      COALESCE(M.INPROGRESS_PLAN_RUNS, 0) AS INPROGRESS_PLAN_RUNS,
      COALESCE(M.CREATED_PLAN_RUNS, 0) AS CREATED_PLAN_RUNS,
      COALESCE(M.CANCELLED_PLAN_RUNS, 0) AS CANCELLED_PLAN_RUNS,
      COALESCE(M.FAILED_PLAN_RUNS, 0) AS FAILED_PLAN_RUNS,
      COALESCE(M.MANUAL_PLAN_RUNS, 0) AS MANUAL_PLAN_RUNS,
      COALESCE(M.SCHEDULE_PLAN_RUNS, 0) AS SCHEDULE_PLAN_RUNS,
      COALESCE(M.API_PLAN_RUNS, 0) AS API_PLAN_RUNS,
      COALESCE(M.AUTOMATED_PLAN_RUNS, 0) AS AUTOMATED_PLAN_RUNS,

      COALESCE(G.PLAN_WITH_RUNS, 0) AS PLAN_WITH_RUNS,
      COALESCE(G.AUTOMATED_PLANS, 0) AS AUTOMATED_PLANS,

      COALESCE(M.USERS_FIRST_TIME_PLAN_CREATORS, 0) AS USERS_FIRST_TIME_PLAN_CREATORS,
      COALESCE(M.USERS_FIRST_TIME_PLAN_RUNNERS, 0) AS USERS_FIRST_TIME_PLAN_RUNNERS,

      COALESCE(M.SHARE_PLAN_AMPLITUDE, 0) AS SHARE_PLAN_AMPLITUDE,
      COALESCE(M.ACTIVE_USERS_AMPLITUDE, 0) AS ACTIVE_USERS_AMPLITUDE,
      COALESCE(M.ENGAGED_USERS_AMPLITUDE, 0) AS ENGAGED_USERS_AMPLITUDE,

      /* New activity-oriented account metrics */
      COALESCE(M.USERS_WORKED_ON_PLANS, 0) AS USERS_WORKED_ON_PLANS,
      COALESCE(M.USERS_EDITED_PLANS, 0) AS USERS_EDITED_PLANS,
      COALESCE(M.USERS_CHANGED_PLAN_TASKS, 0) AS USERS_CHANGED_PLAN_TASKS,
      COALESCE(M.USERS_RAN_PLANS, 0) AS USERS_RAN_PLANS,

      COALESCE(G.PLANS_WORKED_ON, 0) AS PLANS_WORKED_ON,
      COALESCE(G.PLANS_CREATED_BY_ACTIVITY, 0) AS PLANS_CREATED_BY_ACTIVITY,
      COALESCE(G.PLANS_EDITED, 0) AS PLANS_EDITED,
      COALESCE(G.PLANS_WITH_TASK_CHANGES, 0) AS PLANS_WITH_TASK_CHANGES,

      COALESCE(M.PLAN_CREATED_ACTIVITY_COUNT, 0) AS PLAN_CREATED_ACTIVITY_COUNT,
      COALESCE(M.PLAN_EDIT_COUNT, 0) AS PLAN_EDIT_COUNT,
      COALESCE(M.TASK_CREATED_COUNT, 0) AS TASK_CREATED_COUNT,
      COALESCE(M.TASK_UPDATED_COUNT, 0) AS TASK_UPDATED_COUNT,
      COALESCE(M.TASK_DELETED_COUNT, 0) AS TASK_DELETED_COUNT

  FROM ACCOUNT_BASE A
  LEFT JOIN MONTHLY_DAILY_AGG M
    ON A.YEAR_MONTH = M.YEAR_MONTH
   AND EQUAL_NULL(A.BILLING_ACCOUNT_ID, M.BILLING_ACCOUNT_ID)
   AND EQUAL_NULL(A.BILLING_ACCOUNT_ID_RAW, M.BILLING_ACCOUNT_ID_RAW)
   AND EQUAL_NULL(A.SFDC_ACCOUNT_ID, M.SFDC_ACCOUNT_ID)
   AND EQUAL_NULL(A.ACCOUNT_CID, M.ACCOUNT_CID)
   AND EQUAL_NULL(A.PIPELINE_REGION, M.PIPELINE_REGION)
   AND EQUAL_NULL(A.LICENSE_TYPE, M.LICENSE_TYPE)
   AND EQUAL_NULL(A.ACCOUNT_EDITION, M.ACCOUNT_EDITION)
   AND EQUAL_NULL(A.PRICING_AND_PACKAGING, M.PRICING_AND_PACKAGING)
  LEFT JOIN GRANULAR_ACCOUNT_MONTH G
    ON A.YEAR_MONTH = G.YEAR_MONTH
   AND EQUAL_NULL(A.BILLING_ACCOUNT_ID, G.BILLING_ACCOUNT_ID)
   AND EQUAL_NULL(A.BILLING_ACCOUNT_ID_RAW, G.BILLING_ACCOUNT_ID_RAW)
   AND EQUAL_NULL(A.SFDC_ACCOUNT_ID, G.SFDC_ACCOUNT_ID)
   AND EQUAL_NULL(A.ACCOUNT_CID, G.ACCOUNT_CID)
   AND EQUAL_NULL(A.PIPELINE_REGION, G.PIPELINE_REGION)
   AND EQUAL_NULL(A.LICENSE_TYPE, G.LICENSE_TYPE)
   AND EQUAL_NULL(A.ACCOUNT_EDITION, G.ACCOUNT_EDITION)
   AND EQUAL_NULL(A.PRICING_AND_PACKAGING, G.PRICING_AND_PACKAGING)
  ;
queries:
- name: base
  description: Base metric query
  query: |-
    SELECT DISTINCT
            DATE_TRUNC('MONTH', YEAR_MONTH)::DATE AS YEAR_MONTH,
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING
        FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_AT
    ),

    /* ================================================================
       Updated daily Plans user aggregate
       ================================================================ */
    BASE_DAILY AS (
        SELECT *
        FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_DAILY_USERS_AT
    ),

    /* ================================================================
       Granular user-plan activity
       ================================================================ */
    PLANS_GRANULAR AS (
        SELECT *
        FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_DAILY_USER_GRANULAR_AT
    ),

    /* ================================================================
       Daily user-to-account mapping.
       The daily Plans table is already unique at DATE + USER_ID + WORKSPACE_ID.
       ================================================================ */
    DAILY_ACCOUNT_MAP AS (
        SELECT
            DATE,
            USER_ID,
            WORKSPACE_ID,
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING
        FROM BASE_DAILY
    ),

    /* ================================================================
       Monthly roll-up of additive user/day metrics.
       ================================================================ */
    MONTHLY_DAILY_AGG AS (
        SELECT
            DATE_TRUNC('MONTH', DATE)::DATE AS YEAR_MONTH,
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING,

            COUNT(DISTINCT USER_ID) AS TOTAL_USERS,
            COUNT(DISTINCT IFF(CREATED_PLAN > 0, USER_ID, NULL)) AS USERS_CREATED_PLAN,
            COUNT(DISTINCT IFF(AVAILABLE_PLANS > 0, USER_ID, NULL)) AS USERS_WITH_AVAILABLE_PLANS,

            SUM(COALESCE(AVAILABLE_PLANS, 0)) AS AVAILABLE_PLANS,
            SUM(COALESCE(CREATED_PLAN, 0)) AS CREATED_PLAN,

            SUM(COALESCE(PLANS_WITH_WORKFLOW_TASK, 0)) AS PLANS_WITH_WORKFLOW_TASK,
            SUM(COALESCE(PLANS_WITH_FLOW_TASK, 0)) AS PLANS_WITH_FLOW_TASK,
            SUM(COALESCE(PLANS_WITH_HTTP_TASK, 0)) AS PLANS_WITH_HTTP_TASK,
            SUM(COALESCE(PLANS_WITH_EMAIL_TASK, 0)) AS PLANS_WITH_EMAIL_TASK,
            SUM(COALESCE(PLANS_WITH_AI_DATASET_TASK, 0)) AS PLANS_WITH_AI_DATASET_TASK,
            SUM(COALESCE(PLANS_WITH_CEFD_TASK, 0)) AS PLANS_WITH_CEFD_TASK,
            SUM(COALESCE(PLANS_WITH_ML_TASK, 0)) AS PLANS_WITH_ML_TASK,
            SUM(COALESCE(PLANS_WITHOUT_TASK, 0)) AS PLANS_WITHOUT_TASK,
            SUM(COALESCE(PLANS_WITH_APPROVAL_TASK, 0)) AS PLANS_WITH_APPROVAL_TASK,
            SUM(COALESCE(PLANS_WITH_CONDITION_TASK, 0)) AS PLANS_WITH_CONDITION_TASK,
            SUM(COALESCE(PLANS_WITH_DELAY_TASK, 0)) AS PLANS_WITH_DELAY_TASK,
            SUM(COALESCE(PLANS_WITH_LI_PROJECT_REPLY_TASK, 0)) AS PLANS_WITH_LI_PROJECT_REPLY_TASK,
            SUM(COALESCE(PLANS_WITH_ML_PROJECT_UPDATE_TASK, 0)) AS PLANS_WITH_ML_PROJECT_UPDATE_TASK,
            SUM(COALESCE(PLANS_WITH_REPORTING_GENERATE_TASK, 0)) AS PLANS_WITH_REPORTING_GENERATE_TASK,
            SUM(COALESCE(PLANS_WITH_STORAGE_TASK, 0)) AS PLANS_WITH_STORAGE_TASK,

            SUM(COALESCE(TOTAL_TASKS_EVER, 0)) AS TOTAL_TASKS_EVER,
            DIV0(
                SUM(COALESCE(TOTAL_TASKS_EVER, 0)),
                SUM(COALESCE(CREATED_PLAN, 0))
            ) AS AVG_TASKS_PER_PLAN_EVER,

            SUM(COALESCE(PLAN_RUN, 0)) AS PLAN_RUN,
            SUM(COALESCE(COMPLETED_PLAN_RUNS, 0)) AS COMPLETED_PLAN_RUNS,
            SUM(COALESCE(INPROGRESS_PLAN_RUNS, 0)) AS INPROGRESS_PLAN_RUNS,
            SUM(COALESCE(CREATED_PLAN_RUNS, 0)) AS CREATED_PLAN_RUNS,
            SUM(COALESCE(CANCELLED_PLAN_RUNS, 0)) AS CANCELLED_PLAN_RUNS,
            SUM(COALESCE(FAILED_PLAN_RUNS, 0)) AS FAILED_PLAN_RUNS,
            SUM(COALESCE(MANUAL_PLAN_RUNS, 0)) AS MANUAL_PLAN_RUNS,
            SUM(COALESCE(SCHEDULE_PLAN_RUNS, 0)) AS SCHEDULE_PLAN_RUNS,
            SUM(COALESCE(API_PLAN_RUNS, 0)) AS API_PLAN_RUNS,
            SUM(COALESCE(AUTOMATED_PLAN_RUNS, 0)) AS AUTOMATED_PLAN_RUNS,

            COUNT(DISTINCT IFF(
                DATE_TRUNC('MONTH', DATE) = DATE_TRUNC('MONTH', FIRST_PLAN_CREATED_AT),
                USER_ID,
                NULL
            )) AS USERS_FIRST_TIME_PLAN_CREATORS,

            COUNT(DISTINCT IFF(
                DATE_TRUNC('MONTH', DATE) = DATE_TRUNC('MONTH', FIRST_PLAN_RUN_AT),
                USER_ID,
                NULL
            )) AS USERS_FIRST_TIME_PLAN_RUNNERS,

            COUNT(DISTINCT IFF(COALESCE(SHARE_PLAN, 0) > 0, USER_ID, NULL)) AS SHARE_PLAN_AMPLITUDE,
            COUNT(DISTINCT IFF(COALESCE(ACTIVE_USERS, 0) = 1, USER_ID, NULL)) AS ACTIVE_USERS_AMPLITUDE,
            COUNT(DISTINCT IFF(COALESCE(ENGAGED_USERS_AMPLITUDE, 0) = 1, USER_ID, NULL)) AS ENGAGED_USERS_AMPLITUDE,

            /* New monthly user-activity metrics from the upgraded daily table */
            COUNT(DISTINCT IFF(COALESCE(PLANS_WORKED_ON, 0) > 0, USER_ID, NULL)) AS USERS_WORKED_ON_PLANS,
            COUNT(DISTINCT IFF(COALESCE(PLANS_EDITED, 0) > 0, USER_ID, NULL)) AS USERS_EDITED_PLANS,
            COUNT(DISTINCT IFF(COALESCE(PLANS_WITH_TASK_CHANGES, 0) > 0, USER_ID, NULL)) AS USERS_CHANGED_PLAN_TASKS,
            COUNT(DISTINCT IFF(COALESCE(PLANS_RUN_BY_USER, 0) > 0, USER_ID, NULL)) AS USERS_RAN_PLANS,

            SUM(COALESCE(PLAN_CREATED_ACTIVITY_COUNT, 0)) AS PLAN_CREATED_ACTIVITY_COUNT,
            SUM(COALESCE(PLAN_EDIT_COUNT, 0)) AS PLAN_EDIT_COUNT,
            SUM(COALESCE(TASK_CREATED_COUNT, 0)) AS TASK_CREATED_COUNT,
            SUM(COALESCE(TASK_UPDATED_COUNT, 0)) AS TASK_UPDATED_COUNT,
            SUM(COALESCE(TASK_DELETED_COUNT, 0)) AS TASK_DELETED_COUNT

        FROM BASE_DAILY
        GROUP BY
            DATE_TRUNC('MONTH', DATE),
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING
    ),

    /* ================================================================
       True monthly distinct plans from the granular layer.
       This replaces the previous raw-run join and avoids summing daily
       distinct-plan counts across multiple days.
       ================================================================ */
    GRANULAR_ACCOUNT_MONTH AS (
        SELECT
            DATE_TRUNC('MONTH', G.ACTIVITY_DATE)::DATE AS YEAR_MONTH,
            M.BILLING_ACCOUNT_ID,
            M.BILLING_ACCOUNT_ID_RAW,
            M.SFDC_ACCOUNT_ID,
            M.ACCOUNT_CID,
            M.BILLING_ACCOUNT_NAME,
            M.NAMED_COMPANY,
            M.PIPELINE_REGION,
            M.LICENSE_TYPE,
            M.ACCOUNT_EDITION,
            M.PRICING_AND_PACKAGING,

            COUNT(DISTINCT G.PLAN_ID) AS PLANS_WORKED_ON,

            COUNT(DISTINCT IFF(
                COALESCE(G.IS_PLAN_CREATOR, 0) = 1,
                G.PLAN_ID,
                NULL
            )) AS PLANS_CREATED_BY_ACTIVITY,

            COUNT(DISTINCT IFF(
                COALESCE(G.IS_PLAN_EDITOR_PRIMARY, 0) = 1,
                G.PLAN_ID,
                NULL
            )) AS PLANS_EDITED,

            COUNT(DISTINCT IFF(
                COALESCE(G.IS_TASK_CONTRIBUTOR, 0) = 1,
                G.PLAN_ID,
                NULL
            )) AS PLANS_WITH_TASK_CHANGES,

            COUNT(DISTINCT IFF(
                COALESCE(G.PLAN_RUN_COUNT, 0) > 0,
                G.PLAN_ID,
                NULL
            )) AS PLAN_WITH_RUNS,

            COUNT(DISTINCT IFF(
                COALESCE(G.AUTOMATED_PLAN_RUN_COUNT, 0) > 0,
                G.PLAN_ID,
                NULL
            )) AS AUTOMATED_PLANS

        FROM PLANS_GRANULAR G
        JOIN DAILY_ACCOUNT_MAP M
          ON G.ACTIVITY_DATE = M.DATE
         AND G.USER_ID = M.USER_ID
         AND G.WORKSPACE_ID = M.WORKSPACE_ID
        GROUP BY
            DATE_TRUNC('MONTH', G.ACTIVITY_DATE),
            M.BILLING_ACCOUNT_ID,
            M.BILLING_ACCOUNT_ID_RAW,
            M.SFDC_ACCOUNT_ID,
            M.ACCOUNT_CID,
            M.BILLING_ACCOUNT_NAME,
            M.NAMED_COMPANY,
            M.PIPELINE_REGION,
            M.LICENSE_TYPE,
            M.ACCOUNT_EDITION,
            M.PRICING_AND_PACKAGING
    )

    SELECT
        A.YEAR_MONTH,
        A.BILLING_ACCOUNT_ID,
        A.BILLING_ACCOUNT_ID_RAW,
        A.SFDC_ACCOUNT_ID,
        A.ACCOUNT_CID,
        A.BILLING_ACCOUNT_NAME,
        A.NAMED_COMPANY,
        A.PIPELINE_REGION,
        A.LICENSE_TYPE,
        A.ACCOUNT_EDITION,
        A.PRICING_AND_PACKAGING,

        COALESCE(M.TOTAL_USERS, 0) AS TOTAL_USERS,
        COALESCE(M.USERS_CREATED_PLAN, 0) AS USERS_CREATED_PLAN,
        COALESCE(M.USERS_WITH_AVAILABLE_PLANS, 0) AS USERS_WITH_AVAILABLE_PLANS,

        COALESCE(M.AVAILABLE_PLANS, 0) AS AVAILABLE_PLANS,
        COALESCE(M.CREATED_PLAN, 0) AS CREATED_PLAN,

        COALESCE(M.PLANS_WITH_WORKFLOW_TASK, 0) AS PLANS_WITH_WORKFLOW_TASK,
        COALESCE(M.PLANS_WITH_FLOW_TASK, 0) AS PLANS_WITH_FLOW_TASK,
        COALESCE(M.PLANS_WITH_HTTP_TASK, 0) AS PLANS_WITH_HTTP_TASK,
        COALESCE(M.PLANS_WITH_EMAIL_TASK, 0) AS PLANS_WITH_EMAIL_TASK,
        COALESCE(M.PLANS_WITH_AI_DATASET_TASK, 0) AS PLANS_WITH_AI_DATASET_TASK,
        COALESCE(M.PLANS_WITH_CEFD_TASK, 0) AS PLANS_WITH_CEFD_TASK,
        COALESCE(M.PLANS_WITH_ML_TASK, 0) AS PLANS_WITH_ML_TASK,
        COALESCE(M.PLANS_WITHOUT_TASK, 0) AS PLANS_WITHOUT_TASK,
        COALESCE(M.PLANS_WITH_APPROVAL_TASK, 0) AS PLANS_WITH_APPROVAL_TASK,
        COALESCE(M.PLANS_WITH_CONDITION_TASK, 0) AS PLANS_WITH_CONDITION_TASK,
        COALESCE(M.PLANS_WITH_DELAY_TASK, 0) AS PLANS_WITH_DELAY_TASK,
        COALESCE(M.PLANS_WITH_LI_PROJECT_REPLY_TASK, 0) AS PLANS_WITH_LI_PROJECT_REPLY_TASK,
        COALESCE(M.PLANS_WITH_ML_PROJECT_UPDATE_TASK, 0) AS PLANS_WITH_ML_PROJECT_UPDATE_TASK,
        COALESCE(M.PLANS_WITH_REPORTING_GENERATE_TASK, 0) AS PLANS_WITH_REPORTING_GENERATE_TASK,
        COALESCE(M.PLANS_WITH_STORAGE_TASK, 0) AS PLANS_WITH_STORAGE_TASK,

        COALESCE(M.TOTAL_TASKS_EVER, 0) AS TOTAL_TASKS_EVER,
        COALESCE(M.AVG_TASKS_PER_PLAN_EVER, 0) AS AVG_TASKS_PER_PLAN_EVER,

        COALESCE(M.PLAN_RUN, 0) AS PLAN_RUN,
        COALESCE(M.COMPLETED_PLAN_RUNS, 0) AS COMPLETED_PLAN_RUNS,
        COALESCE(M.INPROGRESS_PLAN_RUNS, 0) AS INPROGRESS_PLAN_RUNS,
        COALESCE(M.CREATED_PLAN_RUNS, 0) AS CREATED_PLAN_RUNS,
        COALESCE(M.CANCELLED_PLAN_RUNS, 0) AS CANCELLED_PLAN_RUNS,
        COALESCE(M.FAILED_PLAN_RUNS, 0) AS FAILED_PLAN_RUNS,
        COALESCE(M.MANUAL_PLAN_RUNS, 0) AS MANUAL_PLAN_RUNS,
        COALESCE(M.SCHEDULE_PLAN_RUNS, 0) AS SCHEDULE_PLAN_RUNS,
        COALESCE(M.API_PLAN_RUNS, 0) AS API_PLAN_RUNS,
        COALESCE(M.AUTOMATED_PLAN_RUNS, 0) AS AUTOMATED_PLAN_RUNS,

        COALESCE(G.PLAN_WITH_RUNS, 0) AS PLAN_WITH_RUNS,
        COALESCE(G.AUTOMATED_PLANS, 0) AS AUTOMATED_PLANS,

        COALESCE(M.USERS_FIRST_TIME_PLAN_CREATORS, 0) AS USERS_FIRST_TIME_PLAN_CREATORS,
        COALESCE(M.USERS_FIRST_TIME_PLAN_RUNNERS, 0) AS USERS_FIRST_TIME_PLAN_RUNNERS,

        COALESCE(M.SHARE_PLAN_AMPLITUDE, 0) AS SHARE_PLAN_AMPLITUDE,
        COALESCE(M.ACTIVE_USERS_AMPLITUDE, 0) AS ACTIVE_USERS_AMPLITUDE,
        COALESCE(M.ENGAGED_USERS_AMPLITUDE, 0) AS ENGAGED_USERS_AMPLITUDE,

        /* New activity-oriented account metrics */
        COALESCE(M.USERS_WORKED_ON_PLANS, 0) AS USERS_WORKED_ON_PLANS,
        COALESCE(M.USERS_EDITED_PLANS, 0) AS USERS_EDITED_PLANS,
        COALESCE(M.USERS_CHANGED_PLAN_TASKS, 0) AS USERS_CHANGED_PLAN_TASKS,
        COALESCE(M.USERS_RAN_PLANS, 0) AS USERS_RAN_PLANS,

        COALESCE(G.PLANS_WORKED_ON, 0) AS PLANS_WORKED_ON,
        COALESCE(G.PLANS_CREATED_BY_ACTIVITY, 0) AS PLANS_CREATED_BY_ACTIVITY,
        COALESCE(G.PLANS_EDITED, 0) AS PLANS_EDITED,
        COALESCE(G.PLANS_WITH_TASK_CHANGES, 0) AS PLANS_WITH_TASK_CHANGES,

        COALESCE(M.PLAN_CREATED_ACTIVITY_COUNT, 0) AS PLAN_CREATED_ACTIVITY_COUNT,
        COALESCE(M.PLAN_EDIT_COUNT, 0) AS PLAN_EDIT_COUNT,
        COALESCE(M.TASK_CREATED_COUNT, 0) AS TASK_CREATED_COUNT,
        COALESCE(M.TASK_UPDATED_COUNT, 0) AS TASK_UPDATED_COUNT,
        COALESCE(M.TASK_DELETED_COUNT, 0) AS TASK_DELETED_COUNT

    FROM ACCOUNT_BASE A
    LEFT JOIN MONTHLY_DAILY_AGG M
      ON A.YEAR_MONTH = M.YEAR_MONTH
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID, M.BILLING_ACCOUNT_ID)
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID_RAW, M.BILLING_ACCOUNT_ID_RAW)
     AND EQUAL_NULL(A.SFDC_ACCOUNT_ID, M.SFDC_ACCOUNT_ID)
     AND EQUAL_NULL(A.ACCOUNT_CID, M.ACCOUNT_CID)
     AND EQUAL_NULL(A.PIPELINE_REGION, M.PIPELINE_REGION)
     AND EQUAL_NULL(A.LICENSE_TYPE, M.LICENSE_TYPE)
     AND EQUAL_NULL(A.ACCOUNT_EDITION, M.ACCOUNT_EDITION)
     AND EQUAL_NULL(A.PRICING_AND_PACKAGING, M.PRICING_AND_PACKAGING)
    LEFT JOIN GRANULAR_ACCOUNT_MONTH G
      ON A.YEAR_MONTH = G.YEAR_MONTH
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID, G.BILLING_ACCOUNT_ID)
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID_RAW, G.BILLING_ACCOUNT_ID_RAW)
     AND EQUAL_NULL(A.SFDC_ACCOUNT_ID, G.SFDC_ACCOUNT_ID)
     AND EQUAL_NULL(A.ACCOUNT_CID, G.ACCOUNT_CID)
     AND EQUAL_NULL(A.PIPELINE_REGION, G.PIPELINE_REGION)
     AND EQUAL_NULL(A.LICENSE_TYPE, G.LICENSE_TYPE)
     AND EQUAL_NULL(A.ACCOUNT_EDITION, G.ACCOUNT_EDITION)
     AND EQUAL_NULL(A.PRICING_AND_PACKAGING, G.PRICING_AND_PACKAGING)
    ;
- name: daily
  description: Daily metrics
  query: |-
    SELECT DISTINCT
            DATE_TRUNC('MONTH', YEAR_MONTH)::DATE AS YEAR_MONTH,
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING
        FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_AT
    ),

    /* ================================================================
       Updated daily Plans user aggregate
       ================================================================ */
    BASE_DAILY AS (
        SELECT *
        FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_DAILY_USERS_AT
    ),

    /* ================================================================
       Granular user-plan activity
       ================================================================ */
    PLANS_GRANULAR AS (
        SELECT *
        FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_DAILY_USER_GRANULAR_AT
    ),

    /* ================================================================
       Daily user-to-account mapping.
       The daily Plans table is already unique at DATE + USER_ID + WORKSPACE_ID.
       ================================================================ */
    DAILY_ACCOUNT_MAP AS (
        SELECT
            DATE,
            USER_ID,
            WORKSPACE_ID,
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING
        FROM BASE_DAILY
    ),

    /* ================================================================
       Monthly roll-up of additive user/day metrics.
       ================================================================ */
    MONTHLY_DAILY_AGG AS (
        SELECT
            DATE_TRUNC('MONTH', DATE)::DATE AS YEAR_MONTH,
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING,

            COUNT(DISTINCT USER_ID) AS TOTAL_USERS,
            COUNT(DISTINCT IFF(CREATED_PLAN > 0, USER_ID, NULL)) AS USERS_CREATED_PLAN,
            COUNT(DISTINCT IFF(AVAILABLE_PLANS > 0, USER_ID, NULL)) AS USERS_WITH_AVAILABLE_PLANS,

            SUM(COALESCE(AVAILABLE_PLANS, 0)) AS AVAILABLE_PLANS,
            SUM(COALESCE(CREATED_PLAN, 0)) AS CREATED_PLAN,

            SUM(COALESCE(PLANS_WITH_WORKFLOW_TASK, 0)) AS PLANS_WITH_WORKFLOW_TASK,
            SUM(COALESCE(PLANS_WITH_FLOW_TASK, 0)) AS PLANS_WITH_FLOW_TASK,
            SUM(COALESCE(PLANS_WITH_HTTP_TASK, 0)) AS PLANS_WITH_HTTP_TASK,
            SUM(COALESCE(PLANS_WITH_EMAIL_TASK, 0)) AS PLANS_WITH_EMAIL_TASK,
            SUM(COALESCE(PLANS_WITH_AI_DATASET_TASK, 0)) AS PLANS_WITH_AI_DATASET_TASK,
            SUM(COALESCE(PLANS_WITH_CEFD_TASK, 0)) AS PLANS_WITH_CEFD_TASK,
            SUM(COALESCE(PLANS_WITH_ML_TASK, 0)) AS PLANS_WITH_ML_TASK,
            SUM(COALESCE(PLANS_WITHOUT_TASK, 0)) AS PLANS_WITHOUT_TASK,
            SUM(COALESCE(PLANS_WITH_APPROVAL_TASK, 0)) AS PLANS_WITH_APPROVAL_TASK,
            SUM(COALESCE(PLANS_WITH_CONDITION_TASK, 0)) AS PLANS_WITH_CONDITION_TASK,
            SUM(COALESCE(PLANS_WITH_DELAY_TASK, 0)) AS PLANS_WITH_DELAY_TASK,
            SUM(COALESCE(PLANS_WITH_LI_PROJECT_REPLY_TASK, 0)) AS PLANS_WITH_LI_PROJECT_REPLY_TASK,
            SUM(COALESCE(PLANS_WITH_ML_PROJECT_UPDATE_TASK, 0)) AS PLANS_WITH_ML_PROJECT_UPDATE_TASK,
            SUM(COALESCE(PLANS_WITH_REPORTING_GENERATE_TASK, 0)) AS PLANS_WITH_REPORTING_GENERATE_TASK,
            SUM(COALESCE(PLANS_WITH_STORAGE_TASK, 0)) AS PLANS_WITH_STORAGE_TASK,

            SUM(COALESCE(TOTAL_TASKS_EVER, 0)) AS TOTAL_TASKS_EVER,
            DIV0(
                SUM(COALESCE(TOTAL_TASKS_EVER, 0)),
                SUM(COALESCE(CREATED_PLAN, 0))
            ) AS AVG_TASKS_PER_PLAN_EVER,

            SUM(COALESCE(PLAN_RUN, 0)) AS PLAN_RUN,
            SUM(COALESCE(COMPLETED_PLAN_RUNS, 0)) AS COMPLETED_PLAN_RUNS,
            SUM(COALESCE(INPROGRESS_PLAN_RUNS, 0)) AS INPROGRESS_PLAN_RUNS,
            SUM(COALESCE(CREATED_PLAN_RUNS, 0)) AS CREATED_PLAN_RUNS,
            SUM(COALESCE(CANCELLED_PLAN_RUNS, 0)) AS CANCELLED_PLAN_RUNS,
            SUM(COALESCE(FAILED_PLAN_RUNS, 0)) AS FAILED_PLAN_RUNS,
            SUM(COALESCE(MANUAL_PLAN_RUNS, 0)) AS MANUAL_PLAN_RUNS,
            SUM(COALESCE(SCHEDULE_PLAN_RUNS, 0)) AS SCHEDULE_PLAN_RUNS,
            SUM(COALESCE(API_PLAN_RUNS, 0)) AS API_PLAN_RUNS,
            SUM(COALESCE(AUTOMATED_PLAN_RUNS, 0)) AS AUTOMATED_PLAN_RUNS,

            COUNT(DISTINCT IFF(
                DATE_TRUNC('MONTH', DATE) = DATE_TRUNC('MONTH', FIRST_PLAN_CREATED_AT),
                USER_ID,
                NULL
            )) AS USERS_FIRST_TIME_PLAN_CREATORS,

            COUNT(DISTINCT IFF(
                DATE_TRUNC('MONTH', DATE) = DATE_TRUNC('MONTH', FIRST_PLAN_RUN_AT),
                USER_ID,
                NULL
            )) AS USERS_FIRST_TIME_PLAN_RUNNERS,

            COUNT(DISTINCT IFF(COALESCE(SHARE_PLAN, 0) > 0, USER_ID, NULL)) AS SHARE_PLAN_AMPLITUDE,
            COUNT(DISTINCT IFF(COALESCE(ACTIVE_USERS, 0) = 1, USER_ID, NULL)) AS ACTIVE_USERS_AMPLITUDE,
            COUNT(DISTINCT IFF(COALESCE(ENGAGED_USERS_AMPLITUDE, 0) = 1, USER_ID, NULL)) AS ENGAGED_USERS_AMPLITUDE,

            /* New monthly user-activity metrics from the upgraded daily table */
            COUNT(DISTINCT IFF(COALESCE(PLANS_WORKED_ON, 0) > 0, USER_ID, NULL)) AS USERS_WORKED_ON_PLANS,
            COUNT(DISTINCT IFF(COALESCE(PLANS_EDITED, 0) > 0, USER_ID, NULL)) AS USERS_EDITED_PLANS,
            COUNT(DISTINCT IFF(COALESCE(PLANS_WITH_TASK_CHANGES, 0) > 0, USER_ID, NULL)) AS USERS_CHANGED_PLAN_TASKS,
            COUNT(DISTINCT IFF(COALESCE(PLANS_RUN_BY_USER, 0) > 0, USER_ID, NULL)) AS USERS_RAN_PLANS,

            SUM(COALESCE(PLAN_CREATED_ACTIVITY_COUNT, 0)) AS PLAN_CREATED_ACTIVITY_COUNT,
            SUM(COALESCE(PLAN_EDIT_COUNT, 0)) AS PLAN_EDIT_COUNT,
            SUM(COALESCE(TASK_CREATED_COUNT, 0)) AS TASK_CREATED_COUNT,
            SUM(COALESCE(TASK_UPDATED_COUNT, 0)) AS TASK_UPDATED_COUNT,
            SUM(COALESCE(TASK_DELETED_COUNT, 0)) AS TASK_DELETED_COUNT

        FROM BASE_DAILY
        GROUP BY
            DATE_TRUNC('MONTH', DATE),
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING
    ),

    /* ================================================================
       True monthly distinct plans from the granular layer.
       This replaces the previous raw-run join and avoids summing daily
       distinct-plan counts across multiple days.
       ================================================================ */
    GRANULAR_ACCOUNT_MONTH AS (
        SELECT
            DATE_TRUNC('MONTH', G.ACTIVITY_DATE)::DATE AS YEAR_MONTH,
            M.BILLING_ACCOUNT_ID,
            M.BILLING_ACCOUNT_ID_RAW,
            M.SFDC_ACCOUNT_ID,
            M.ACCOUNT_CID,
            M.BILLING_ACCOUNT_NAME,
            M.NAMED_COMPANY,
            M.PIPELINE_REGION,
            M.LICENSE_TYPE,
            M.ACCOUNT_EDITION,
            M.PRICING_AND_PACKAGING,

            COUNT(DISTINCT G.PLAN_ID) AS PLANS_WORKED_ON,

            COUNT(DISTINCT IFF(
                COALESCE(G.IS_PLAN_CREATOR, 0) = 1,
                G.PLAN_ID,
                NULL
            )) AS PLANS_CREATED_BY_ACTIVITY,

            COUNT(DISTINCT IFF(
                COALESCE(G.IS_PLAN_EDITOR_PRIMARY, 0) = 1,
                G.PLAN_ID,
                NULL
            )) AS PLANS_EDITED,

            COUNT(DISTINCT IFF(
                COALESCE(G.IS_TASK_CONTRIBUTOR, 0) = 1,
                G.PLAN_ID,
                NULL
            )) AS PLANS_WITH_TASK_CHANGES,

            COUNT(DISTINCT IFF(
                COALESCE(G.PLAN_RUN_COUNT, 0) > 0,
                G.PLAN_ID,
                NULL
            )) AS PLAN_WITH_RUNS,

            COUNT(DISTINCT IFF(
                COALESCE(G.AUTOMATED_PLAN_RUN_COUNT, 0) > 0,
                G.PLAN_ID,
                NULL
            )) AS AUTOMATED_PLANS

        FROM PLANS_GRANULAR G
        JOIN DAILY_ACCOUNT_MAP M
          ON G.ACTIVITY_DATE = M.DATE
         AND G.USER_ID = M.USER_ID
         AND G.WORKSPACE_ID = M.WORKSPACE_ID
        GROUP BY
            DATE_TRUNC('MONTH', G.ACTIVITY_DATE),
            M.BILLING_ACCOUNT_ID,
            M.BILLING_ACCOUNT_ID_RAW,
            M.SFDC_ACCOUNT_ID,
            M.ACCOUNT_CID,
            M.BILLING_ACCOUNT_NAME,
            M.NAMED_COMPANY,
            M.PIPELINE_REGION,
            M.LICENSE_TYPE,
            M.ACCOUNT_EDITION,
            M.PRICING_AND_PACKAGING
    )

    SELECT
        A.YEAR_MONTH,
        A.BILLING_ACCOUNT_ID,
        A.BILLING_ACCOUNT_ID_RAW,
        A.SFDC_ACCOUNT_ID,
        A.ACCOUNT_CID,
        A.BILLING_ACCOUNT_NAME,
        A.NAMED_COMPANY,
        A.PIPELINE_REGION,
        A.LICENSE_TYPE,
        A.ACCOUNT_EDITION,
        A.PRICING_AND_PACKAGING,

        COALESCE(M.TOTAL_USERS, 0) AS TOTAL_USERS,
        COALESCE(M.USERS_CREATED_PLAN, 0) AS USERS_CREATED_PLAN,
        COALESCE(M.USERS_WITH_AVAILABLE_PLANS, 0) AS USERS_WITH_AVAILABLE_PLANS,

        COALESCE(M.AVAILABLE_PLANS, 0) AS AVAILABLE_PLANS,
        COALESCE(M.CREATED_PLAN, 0) AS CREATED_PLAN,

        COALESCE(M.PLANS_WITH_WORKFLOW_TASK, 0) AS PLANS_WITH_WORKFLOW_TASK,
        COALESCE(M.PLANS_WITH_FLOW_TASK, 0) AS PLANS_WITH_FLOW_TASK,
        COALESCE(M.PLANS_WITH_HTTP_TASK, 0) AS PLANS_WITH_HTTP_TASK,
        COALESCE(M.PLANS_WITH_EMAIL_TASK, 0) AS PLANS_WITH_EMAIL_TASK,
        COALESCE(M.PLANS_WITH_AI_DATASET_TASK, 0) AS PLANS_WITH_AI_DATASET_TASK,
        COALESCE(M.PLANS_WITH_CEFD_TASK, 0) AS PLANS_WITH_CEFD_TASK,
        COALESCE(M.PLANS_WITH_ML_TASK, 0) AS PLANS_WITH_ML_TASK,
        COALESCE(M.PLANS_WITHOUT_TASK, 0) AS PLANS_WITHOUT_TASK,
        COALESCE(M.PLANS_WITH_APPROVAL_TASK, 0) AS PLANS_WITH_APPROVAL_TASK,
        COALESCE(M.PLANS_WITH_CONDITION_TASK, 0) AS PLANS_WITH_CONDITION_TASK,
        COALESCE(M.PLANS_WITH_DELAY_TASK, 0) AS PLANS_WITH_DELAY_TASK,
        COALESCE(M.PLANS_WITH_LI_PROJECT_REPLY_TASK, 0) AS PLANS_WITH_LI_PROJECT_REPLY_TASK,
        COALESCE(M.PLANS_WITH_ML_PROJECT_UPDATE_TASK, 0) AS PLANS_WITH_ML_PROJECT_UPDATE_TASK,
        COALESCE(M.PLANS_WITH_REPORTING_GENERATE_TASK, 0) AS PLANS_WITH_REPORTING_GENERATE_TASK,
        COALESCE(M.PLANS_WITH_STORAGE_TASK, 0) AS PLANS_WITH_STORAGE_TASK,

        COALESCE(M.TOTAL_TASKS_EVER, 0) AS TOTAL_TASKS_EVER,
        COALESCE(M.AVG_TASKS_PER_PLAN_EVER, 0) AS AVG_TASKS_PER_PLAN_EVER,

        COALESCE(M.PLAN_RUN, 0) AS PLAN_RUN,
        COALESCE(M.COMPLETED_PLAN_RUNS, 0) AS COMPLETED_PLAN_RUNS,
        COALESCE(M.INPROGRESS_PLAN_RUNS, 0) AS INPROGRESS_PLAN_RUNS,
        COALESCE(M.CREATED_PLAN_RUNS, 0) AS CREATED_PLAN_RUNS,
        COALESCE(M.CANCELLED_PLAN_RUNS, 0) AS CANCELLED_PLAN_RUNS,
        COALESCE(M.FAILED_PLAN_RUNS, 0) AS FAILED_PLAN_RUNS,
        COALESCE(M.MANUAL_PLAN_RUNS, 0) AS MANUAL_PLAN_RUNS,
        COALESCE(M.SCHEDULE_PLAN_RUNS, 0) AS SCHEDULE_PLAN_RUNS,
        COALESCE(M.API_PLAN_RUNS, 0) AS API_PLAN_RUNS,
        COALESCE(M.AUTOMATED_PLAN_RUNS, 0) AS AUTOMATED_PLAN_RUNS,

        COALESCE(G.PLAN_WITH_RUNS, 0) AS PLAN_WITH_RUNS,
        COALESCE(G.AUTOMATED_PLANS, 0) AS AUTOMATED_PLANS,

        COALESCE(M.USERS_FIRST_TIME_PLAN_CREATORS, 0) AS USERS_FIRST_TIME_PLAN_CREATORS,
        COALESCE(M.USERS_FIRST_TIME_PLAN_RUNNERS, 0) AS USERS_FIRST_TIME_PLAN_RUNNERS,

        COALESCE(M.SHARE_PLAN_AMPLITUDE, 0) AS SHARE_PLAN_AMPLITUDE,
        COALESCE(M.ACTIVE_USERS_AMPLITUDE, 0) AS ACTIVE_USERS_AMPLITUDE,
        COALESCE(M.ENGAGED_USERS_AMPLITUDE, 0) AS ENGAGED_USERS_AMPLITUDE,

        /* New activity-oriented account metrics */
        COALESCE(M.USERS_WORKED_ON_PLANS, 0) AS USERS_WORKED_ON_PLANS,
        COALESCE(M.USERS_EDITED_PLANS, 0) AS USERS_EDITED_PLANS,
        COALESCE(M.USERS_CHANGED_PLAN_TASKS, 0) AS USERS_CHANGED_PLAN_TASKS,
        COALESCE(M.USERS_RAN_PLANS, 0) AS USERS_RAN_PLANS,

        COALESCE(G.PLANS_WORKED_ON, 0) AS PLANS_WORKED_ON,
        COALESCE(G.PLANS_CREATED_BY_ACTIVITY, 0) AS PLANS_CREATED_BY_ACTIVITY,
        COALESCE(G.PLANS_EDITED, 0) AS PLANS_EDITED,
        COALESCE(G.PLANS_WITH_TASK_CHANGES, 0) AS PLANS_WITH_TASK_CHANGES,

        COALESCE(M.PLAN_CREATED_ACTIVITY_COUNT, 0) AS PLAN_CREATED_ACTIVITY_COUNT,
        COALESCE(M.PLAN_EDIT_COUNT, 0) AS PLAN_EDIT_COUNT,
        COALESCE(M.TASK_CREATED_COUNT, 0) AS TASK_CREATED_COUNT,
        COALESCE(M.TASK_UPDATED_COUNT, 0) AS TASK_UPDATED_COUNT,
        COALESCE(M.TASK_DELETED_COUNT, 0) AS TASK_DELETED_COUNT

    FROM ACCOUNT_BASE A
    LEFT JOIN MONTHLY_DAILY_AGG M
      ON A.YEAR_MONTH = M.YEAR_MONTH
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID, M.BILLING_ACCOUNT_ID)
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID_RAW, M.BILLING_ACCOUNT_ID_RAW)
     AND EQUAL_NULL(A.SFDC_ACCOUNT_ID, M.SFDC_ACCOUNT_ID)
     AND EQUAL_NULL(A.ACCOUNT_CID, M.ACCOUNT_CID)
     AND EQUAL_NULL(A.PIPELINE_REGION, M.PIPELINE_REGION)
     AND EQUAL_NULL(A.LICENSE_TYPE, M.LICENSE_TYPE)
     AND EQUAL_NULL(A.ACCOUNT_EDITION, M.ACCOUNT_EDITION)
     AND EQUAL_NULL(A.PRICING_AND_PACKAGING, M.PRICING_AND_PACKAGING)
    LEFT JOIN GRANULAR_ACCOUNT_MONTH G
      ON A.YEAR_MONTH = G.YEAR_MONTH
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID, G.BILLING_ACCOUNT_ID)
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID_RAW, G.BILLING_ACCOUNT_ID_RAW)
     AND EQUAL_NULL(A.SFDC_ACCOUNT_ID, G.SFDC_ACCOUNT_ID)
     AND EQUAL_NULL(A.ACCOUNT_CID, G.ACCOUNT_CID)
     AND EQUAL_NULL(A.PIPELINE_REGION, G.PIPELINE_REGION)
     AND EQUAL_NULL(A.LICENSE_TYPE, G.LICENSE_TYPE)
     AND EQUAL_NULL(A.ACCOUNT_EDITION, G.ACCOUNT_EDITION)
     AND EQUAL_NULL(A.PRICING_AND_PACKAGING, G.PRICING_AND_PACKAGING)
    ;
- name: monthly
  description: Monthly aggregated metrics
  query: |-
    SELECT DISTINCT
            DATE_TRUNC('MONTH', YEAR_MONTH)::DATE AS YEAR_MONTH,
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING
        FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.ALTERYX_MONTHLY_ACCOUNT_ONBOARDING_AT
    ),

    /* ================================================================
       Updated daily Plans user aggregate
       ================================================================ */
    BASE_DAILY AS (
        SELECT *
        FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_DAILY_USERS_AT
    ),

    /* ================================================================
       Granular user-plan activity
       ================================================================ */
    PLANS_GRANULAR AS (
        SELECT *
        FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_DAILY_USER_GRANULAR_AT
    ),

    /* ================================================================
       Daily user-to-account mapping.
       The daily Plans table is already unique at DATE + USER_ID + WORKSPACE_ID.
       ================================================================ */
    DAILY_ACCOUNT_MAP AS (
        SELECT
            DATE,
            USER_ID,
            WORKSPACE_ID,
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING
        FROM BASE_DAILY
    ),

    /* ================================================================
       Monthly roll-up of additive user/day metrics.
       ================================================================ */
    MONTHLY_DAILY_AGG AS (
        SELECT
            DATE_TRUNC('MONTH', DATE)::DATE AS YEAR_MONTH,
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING,

            COUNT(DISTINCT USER_ID) AS TOTAL_USERS,
            COUNT(DISTINCT IFF(CREATED_PLAN > 0, USER_ID, NULL)) AS USERS_CREATED_PLAN,
            COUNT(DISTINCT IFF(AVAILABLE_PLANS > 0, USER_ID, NULL)) AS USERS_WITH_AVAILABLE_PLANS,

            SUM(COALESCE(AVAILABLE_PLANS, 0)) AS AVAILABLE_PLANS,
            SUM(COALESCE(CREATED_PLAN, 0)) AS CREATED_PLAN,

            SUM(COALESCE(PLANS_WITH_WORKFLOW_TASK, 0)) AS PLANS_WITH_WORKFLOW_TASK,
            SUM(COALESCE(PLANS_WITH_FLOW_TASK, 0)) AS PLANS_WITH_FLOW_TASK,
            SUM(COALESCE(PLANS_WITH_HTTP_TASK, 0)) AS PLANS_WITH_HTTP_TASK,
            SUM(COALESCE(PLANS_WITH_EMAIL_TASK, 0)) AS PLANS_WITH_EMAIL_TASK,
            SUM(COALESCE(PLANS_WITH_AI_DATASET_TASK, 0)) AS PLANS_WITH_AI_DATASET_TASK,
            SUM(COALESCE(PLANS_WITH_CEFD_TASK, 0)) AS PLANS_WITH_CEFD_TASK,
            SUM(COALESCE(PLANS_WITH_ML_TASK, 0)) AS PLANS_WITH_ML_TASK,
            SUM(COALESCE(PLANS_WITHOUT_TASK, 0)) AS PLANS_WITHOUT_TASK,
            SUM(COALESCE(PLANS_WITH_APPROVAL_TASK, 0)) AS PLANS_WITH_APPROVAL_TASK,
            SUM(COALESCE(PLANS_WITH_CONDITION_TASK, 0)) AS PLANS_WITH_CONDITION_TASK,
            SUM(COALESCE(PLANS_WITH_DELAY_TASK, 0)) AS PLANS_WITH_DELAY_TASK,
            SUM(COALESCE(PLANS_WITH_LI_PROJECT_REPLY_TASK, 0)) AS PLANS_WITH_LI_PROJECT_REPLY_TASK,
            SUM(COALESCE(PLANS_WITH_ML_PROJECT_UPDATE_TASK, 0)) AS PLANS_WITH_ML_PROJECT_UPDATE_TASK,
            SUM(COALESCE(PLANS_WITH_REPORTING_GENERATE_TASK, 0)) AS PLANS_WITH_REPORTING_GENERATE_TASK,
            SUM(COALESCE(PLANS_WITH_STORAGE_TASK, 0)) AS PLANS_WITH_STORAGE_TASK,

            SUM(COALESCE(TOTAL_TASKS_EVER, 0)) AS TOTAL_TASKS_EVER,
            DIV0(
                SUM(COALESCE(TOTAL_TASKS_EVER, 0)),
                SUM(COALESCE(CREATED_PLAN, 0))
            ) AS AVG_TASKS_PER_PLAN_EVER,

            SUM(COALESCE(PLAN_RUN, 0)) AS PLAN_RUN,
            SUM(COALESCE(COMPLETED_PLAN_RUNS, 0)) AS COMPLETED_PLAN_RUNS,
            SUM(COALESCE(INPROGRESS_PLAN_RUNS, 0)) AS INPROGRESS_PLAN_RUNS,
            SUM(COALESCE(CREATED_PLAN_RUNS, 0)) AS CREATED_PLAN_RUNS,
            SUM(COALESCE(CANCELLED_PLAN_RUNS, 0)) AS CANCELLED_PLAN_RUNS,
            SUM(COALESCE(FAILED_PLAN_RUNS, 0)) AS FAILED_PLAN_RUNS,
            SUM(COALESCE(MANUAL_PLAN_RUNS, 0)) AS MANUAL_PLAN_RUNS,
            SUM(COALESCE(SCHEDULE_PLAN_RUNS, 0)) AS SCHEDULE_PLAN_RUNS,
            SUM(COALESCE(API_PLAN_RUNS, 0)) AS API_PLAN_RUNS,
            SUM(COALESCE(AUTOMATED_PLAN_RUNS, 0)) AS AUTOMATED_PLAN_RUNS,

            COUNT(DISTINCT IFF(
                DATE_TRUNC('MONTH', DATE) = DATE_TRUNC('MONTH', FIRST_PLAN_CREATED_AT),
                USER_ID,
                NULL
            )) AS USERS_FIRST_TIME_PLAN_CREATORS,

            COUNT(DISTINCT IFF(
                DATE_TRUNC('MONTH', DATE) = DATE_TRUNC('MONTH', FIRST_PLAN_RUN_AT),
                USER_ID,
                NULL
            )) AS USERS_FIRST_TIME_PLAN_RUNNERS,

            COUNT(DISTINCT IFF(COALESCE(SHARE_PLAN, 0) > 0, USER_ID, NULL)) AS SHARE_PLAN_AMPLITUDE,
            COUNT(DISTINCT IFF(COALESCE(ACTIVE_USERS, 0) = 1, USER_ID, NULL)) AS ACTIVE_USERS_AMPLITUDE,
            COUNT(DISTINCT IFF(COALESCE(ENGAGED_USERS_AMPLITUDE, 0) = 1, USER_ID, NULL)) AS ENGAGED_USERS_AMPLITUDE,

            /* New monthly user-activity metrics from the upgraded daily table */
            COUNT(DISTINCT IFF(COALESCE(PLANS_WORKED_ON, 0) > 0, USER_ID, NULL)) AS USERS_WORKED_ON_PLANS,
            COUNT(DISTINCT IFF(COALESCE(PLANS_EDITED, 0) > 0, USER_ID, NULL)) AS USERS_EDITED_PLANS,
            COUNT(DISTINCT IFF(COALESCE(PLANS_WITH_TASK_CHANGES, 0) > 0, USER_ID, NULL)) AS USERS_CHANGED_PLAN_TASKS,
            COUNT(DISTINCT IFF(COALESCE(PLANS_RUN_BY_USER, 0) > 0, USER_ID, NULL)) AS USERS_RAN_PLANS,

            SUM(COALESCE(PLAN_CREATED_ACTIVITY_COUNT, 0)) AS PLAN_CREATED_ACTIVITY_COUNT,
            SUM(COALESCE(PLAN_EDIT_COUNT, 0)) AS PLAN_EDIT_COUNT,
            SUM(COALESCE(TASK_CREATED_COUNT, 0)) AS TASK_CREATED_COUNT,
            SUM(COALESCE(TASK_UPDATED_COUNT, 0)) AS TASK_UPDATED_COUNT,
            SUM(COALESCE(TASK_DELETED_COUNT, 0)) AS TASK_DELETED_COUNT

        FROM BASE_DAILY
        GROUP BY
            DATE_TRUNC('MONTH', DATE),
            BILLING_ACCOUNT_ID,
            BILLING_ACCOUNT_ID_RAW,
            SFDC_ACCOUNT_ID,
            ACCOUNT_CID,
            BILLING_ACCOUNT_NAME,
            NAMED_COMPANY,
            PIPELINE_REGION,
            LICENSE_TYPE,
            ACCOUNT_EDITION,
            PRICING_AND_PACKAGING
    ),

    /* ================================================================
       True monthly distinct plans from the granular layer.
       This replaces the previous raw-run join and avoids summing daily
       distinct-plan counts across multiple days.
       ================================================================ */
    GRANULAR_ACCOUNT_MONTH AS (
        SELECT
            DATE_TRUNC('MONTH', G.ACTIVITY_DATE)::DATE AS YEAR_MONTH,
            M.BILLING_ACCOUNT_ID,
            M.BILLING_ACCOUNT_ID_RAW,
            M.SFDC_ACCOUNT_ID,
            M.ACCOUNT_CID,
            M.BILLING_ACCOUNT_NAME,
            M.NAMED_COMPANY,
            M.PIPELINE_REGION,
            M.LICENSE_TYPE,
            M.ACCOUNT_EDITION,
            M.PRICING_AND_PACKAGING,

            COUNT(DISTINCT G.PLAN_ID) AS PLANS_WORKED_ON,

            COUNT(DISTINCT IFF(
                COALESCE(G.IS_PLAN_CREATOR, 0) = 1,
                G.PLAN_ID,
                NULL
            )) AS PLANS_CREATED_BY_ACTIVITY,

            COUNT(DISTINCT IFF(
                COALESCE(G.IS_PLAN_EDITOR_PRIMARY, 0) = 1,
                G.PLAN_ID,
                NULL
            )) AS PLANS_EDITED,

            COUNT(DISTINCT IFF(
                COALESCE(G.IS_TASK_CONTRIBUTOR, 0) = 1,
                G.PLAN_ID,
                NULL
            )) AS PLANS_WITH_TASK_CHANGES,

            COUNT(DISTINCT IFF(
                COALESCE(G.PLAN_RUN_COUNT, 0) > 0,
                G.PLAN_ID,
                NULL
            )) AS PLAN_WITH_RUNS,

            COUNT(DISTINCT IFF(
                COALESCE(G.AUTOMATED_PLAN_RUN_COUNT, 0) > 0,
                G.PLAN_ID,
                NULL
            )) AS AUTOMATED_PLANS

        FROM PLANS_GRANULAR G
        JOIN DAILY_ACCOUNT_MAP M
          ON G.ACTIVITY_DATE = M.DATE
         AND G.USER_ID = M.USER_ID
         AND G.WORKSPACE_ID = M.WORKSPACE_ID
        GROUP BY
            DATE_TRUNC('MONTH', G.ACTIVITY_DATE),
            M.BILLING_ACCOUNT_ID,
            M.BILLING_ACCOUNT_ID_RAW,
            M.SFDC_ACCOUNT_ID,
            M.ACCOUNT_CID,
            M.BILLING_ACCOUNT_NAME,
            M.NAMED_COMPANY,
            M.PIPELINE_REGION,
            M.LICENSE_TYPE,
            M.ACCOUNT_EDITION,
            M.PRICING_AND_PACKAGING
    )

    SELECT
        A.YEAR_MONTH,
        A.BILLING_ACCOUNT_ID,
        A.BILLING_ACCOUNT_ID_RAW,
        A.SFDC_ACCOUNT_ID,
        A.ACCOUNT_CID,
        A.BILLING_ACCOUNT_NAME,
        A.NAMED_COMPANY,
        A.PIPELINE_REGION,
        A.LICENSE_TYPE,
        A.ACCOUNT_EDITION,
        A.PRICING_AND_PACKAGING,

        COALESCE(M.TOTAL_USERS, 0) AS TOTAL_USERS,
        COALESCE(M.USERS_CREATED_PLAN, 0) AS USERS_CREATED_PLAN,
        COALESCE(M.USERS_WITH_AVAILABLE_PLANS, 0) AS USERS_WITH_AVAILABLE_PLANS,

        COALESCE(M.AVAILABLE_PLANS, 0) AS AVAILABLE_PLANS,
        COALESCE(M.CREATED_PLAN, 0) AS CREATED_PLAN,

        COALESCE(M.PLANS_WITH_WORKFLOW_TASK, 0) AS PLANS_WITH_WORKFLOW_TASK,
        COALESCE(M.PLANS_WITH_FLOW_TASK, 0) AS PLANS_WITH_FLOW_TASK,
        COALESCE(M.PLANS_WITH_HTTP_TASK, 0) AS PLANS_WITH_HTTP_TASK,
        COALESCE(M.PLANS_WITH_EMAIL_TASK, 0) AS PLANS_WITH_EMAIL_TASK,
        COALESCE(M.PLANS_WITH_AI_DATASET_TASK, 0) AS PLANS_WITH_AI_DATASET_TASK,
        COALESCE(M.PLANS_WITH_CEFD_TASK, 0) AS PLANS_WITH_CEFD_TASK,
        COALESCE(M.PLANS_WITH_ML_TASK, 0) AS PLANS_WITH_ML_TASK,
        COALESCE(M.PLANS_WITHOUT_TASK, 0) AS PLANS_WITHOUT_TASK,
        COALESCE(M.PLANS_WITH_APPROVAL_TASK, 0) AS PLANS_WITH_APPROVAL_TASK,
        COALESCE(M.PLANS_WITH_CONDITION_TASK, 0) AS PLANS_WITH_CONDITION_TASK,
        COALESCE(M.PLANS_WITH_DELAY_TASK, 0) AS PLANS_WITH_DELAY_TASK,
        COALESCE(M.PLANS_WITH_LI_PROJECT_REPLY_TASK, 0) AS PLANS_WITH_LI_PROJECT_REPLY_TASK,
        COALESCE(M.PLANS_WITH_ML_PROJECT_UPDATE_TASK, 0) AS PLANS_WITH_ML_PROJECT_UPDATE_TASK,
        COALESCE(M.PLANS_WITH_REPORTING_GENERATE_TASK, 0) AS PLANS_WITH_REPORTING_GENERATE_TASK,
        COALESCE(M.PLANS_WITH_STORAGE_TASK, 0) AS PLANS_WITH_STORAGE_TASK,

        COALESCE(M.TOTAL_TASKS_EVER, 0) AS TOTAL_TASKS_EVER,
        COALESCE(M.AVG_TASKS_PER_PLAN_EVER, 0) AS AVG_TASKS_PER_PLAN_EVER,

        COALESCE(M.PLAN_RUN, 0) AS PLAN_RUN,
        COALESCE(M.COMPLETED_PLAN_RUNS, 0) AS COMPLETED_PLAN_RUNS,
        COALESCE(M.INPROGRESS_PLAN_RUNS, 0) AS INPROGRESS_PLAN_RUNS,
        COALESCE(M.CREATED_PLAN_RUNS, 0) AS CREATED_PLAN_RUNS,
        COALESCE(M.CANCELLED_PLAN_RUNS, 0) AS CANCELLED_PLAN_RUNS,
        COALESCE(M.FAILED_PLAN_RUNS, 0) AS FAILED_PLAN_RUNS,
        COALESCE(M.MANUAL_PLAN_RUNS, 0) AS MANUAL_PLAN_RUNS,
        COALESCE(M.SCHEDULE_PLAN_RUNS, 0) AS SCHEDULE_PLAN_RUNS,
        COALESCE(M.API_PLAN_RUNS, 0) AS API_PLAN_RUNS,
        COALESCE(M.AUTOMATED_PLAN_RUNS, 0) AS AUTOMATED_PLAN_RUNS,

        COALESCE(G.PLAN_WITH_RUNS, 0) AS PLAN_WITH_RUNS,
        COALESCE(G.AUTOMATED_PLANS, 0) AS AUTOMATED_PLANS,

        COALESCE(M.USERS_FIRST_TIME_PLAN_CREATORS, 0) AS USERS_FIRST_TIME_PLAN_CREATORS,
        COALESCE(M.USERS_FIRST_TIME_PLAN_RUNNERS, 0) AS USERS_FIRST_TIME_PLAN_RUNNERS,

        COALESCE(M.SHARE_PLAN_AMPLITUDE, 0) AS SHARE_PLAN_AMPLITUDE,
        COALESCE(M.ACTIVE_USERS_AMPLITUDE, 0) AS ACTIVE_USERS_AMPLITUDE,
        COALESCE(M.ENGAGED_USERS_AMPLITUDE, 0) AS ENGAGED_USERS_AMPLITUDE,

        /* New activity-oriented account metrics */
        COALESCE(M.USERS_WORKED_ON_PLANS, 0) AS USERS_WORKED_ON_PLANS,
        COALESCE(M.USERS_EDITED_PLANS, 0) AS USERS_EDITED_PLANS,
        COALESCE(M.USERS_CHANGED_PLAN_TASKS, 0) AS USERS_CHANGED_PLAN_TASKS,
        COALESCE(M.USERS_RAN_PLANS, 0) AS USERS_RAN_PLANS,

        COALESCE(G.PLANS_WORKED_ON, 0) AS PLANS_WORKED_ON,
        COALESCE(G.PLANS_CREATED_BY_ACTIVITY, 0) AS PLANS_CREATED_BY_ACTIVITY,
        COALESCE(G.PLANS_EDITED, 0) AS PLANS_EDITED,
        COALESCE(G.PLANS_WITH_TASK_CHANGES, 0) AS PLANS_WITH_TASK_CHANGES,

        COALESCE(M.PLAN_CREATED_ACTIVITY_COUNT, 0) AS PLAN_CREATED_ACTIVITY_COUNT,
        COALESCE(M.PLAN_EDIT_COUNT, 0) AS PLAN_EDIT_COUNT,
        COALESCE(M.TASK_CREATED_COUNT, 0) AS TASK_CREATED_COUNT,
        COALESCE(M.TASK_UPDATED_COUNT, 0) AS TASK_UPDATED_COUNT,
        COALESCE(M.TASK_DELETED_COUNT, 0) AS TASK_DELETED_COUNT

    FROM ACCOUNT_BASE A
    LEFT JOIN MONTHLY_DAILY_AGG M
      ON A.YEAR_MONTH = M.YEAR_MONTH
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID, M.BILLING_ACCOUNT_ID)
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID_RAW, M.BILLING_ACCOUNT_ID_RAW)
     AND EQUAL_NULL(A.SFDC_ACCOUNT_ID, M.SFDC_ACCOUNT_ID)
     AND EQUAL_NULL(A.ACCOUNT_CID, M.ACCOUNT_CID)
     AND EQUAL_NULL(A.PIPELINE_REGION, M.PIPELINE_REGION)
     AND EQUAL_NULL(A.LICENSE_TYPE, M.LICENSE_TYPE)
     AND EQUAL_NULL(A.ACCOUNT_EDITION, M.ACCOUNT_EDITION)
     AND EQUAL_NULL(A.PRICING_AND_PACKAGING, M.PRICING_AND_PACKAGING)
    LEFT JOIN GRANULAR_ACCOUNT_MONTH G
      ON A.YEAR_MONTH = G.YEAR_MONTH
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID, G.BILLING_ACCOUNT_ID)
     AND EQUAL_NULL(A.BILLING_ACCOUNT_ID_RAW, G.BILLING_ACCOUNT_ID_RAW)
     AND EQUAL_NULL(A.SFDC_ACCOUNT_ID, G.SFDC_ACCOUNT_ID)
     AND EQUAL_NULL(A.ACCOUNT_CID, G.ACCOUNT_CID)
     AND EQUAL_NULL(A.PIPELINE_REGION, G.PIPELINE_REGION)
     AND EQUAL_NULL(A.LICENSE_TYPE, G.LICENSE_TYPE)
     AND EQUAL_NULL(A.ACCOUNT_EDITION, G.ACCOUNT_EDITION)
     AND EQUAL_NULL(A.PRICING_AND_PACKAGING, G.PRICING_AND_PACKAGING)
    ;
