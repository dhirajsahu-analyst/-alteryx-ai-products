id: plans_run_metrics
name: Plans Run Metrics
description: Metrics related to Plans runs
product: plans
status: validated
category: product_metric
definition:
  business: Plans Run Metrics - Metrics related to Plans runs
  technical: Query
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables:
  - DISCOVERY_PRODUCT_MANAGEMENT
sql_template: "SELECT\n    -- Reporting month\n    TO_CHAR(\n        DATE_TRUNC('MONTH',\
  \ YEAR_MONTH),\n        'Mon-YYYY'\n    ) AS MONTH,\n\n    -- Distinct billing accounts\
  \ with at least one plan containing runs\n    COUNT(\n        DISTINCT IFF(\n  \
  \          PLAN_WITH_RUNS > 0,\n            BILLING_ACCOUNT_ID,\n            NULL\n\
  \        )\n    ) AS TOTAL_ACCOUNTS_WITH_RUNS,\n\n    -- Total plans with at least\
  \ one run\n    COALESCE(\n        SUM(PLAN_WITH_RUNS),\n        0\n    ) AS PLANS_WITH_RUNS,\n\
  \n    -- Percentage of available plans with at least one run\n    ROUND(\n     \
  \   DIV0(\n            COALESCE(SUM(PLAN_WITH_RUNS), 0),\n            COALESCE(SUM(AVAILABLE_PLANS),\
  \ 0)\n        ) * 100,\n        2\n    ) AS PCT_OF_TOTAL_PLANS_WITH_RUNS,\n\n  \
  \  -- Total plan runs\n    COALESCE(\n        SUM(PLAN_RUN),\n        0\n    ) AS\
  \ TOTAL_PLAN_RUNS\n\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_MONTHLY_ACCOUNT_AT\n\
  \nWHERE\n    -- Current month and previous three months\n    YEAR_MONTH >= DATE_TRUNC(\n\
  \        'MONTH',\n        DATEADD(\n            MONTH,\n            -3,\n     \
  \       CURRENT_DATE()\n        )\n    )\n\n    -- Purchased accounts only\n   \
  \ AND LICENSE_TYPE = 'Purchase'\n\n    -- Optional filters\n    -- AND PIPELINE_REGION\
  \ = 'US'\n    -- AND ACCOUNT_EDITION = 'Enterprise'\n    -- AND PRICING_AND_PACKAGING\
  \ = '2025'\n    -- AND BILLING_ACCOUNT_ID = '<ACCOUNT_ID>'\n\nGROUP BY\n    DATE_TRUNC('MONTH',\
  \ YEAR_MONTH)\n\nORDER BY\n    DATE_TRUNC('MONTH', YEAR_MONTH);"
