id: plan_health_summary
name: Plan Health Summary
description: Health metrics for Plans
product: plans
status: validated
category: product_metric
definition:
  business: Plan Health Summary - Health metrics for Plans
  technical: Query
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables:
  - DISCOVERY_PRODUCT_MANAGEMENT
sql_template: "SELECT\n\n    TO_CHAR(DATE_TRUNC('MONTH', PLAN_CREATED_AT), 'MON YYYY')\
  \ AS MONTH,\n\n    -- Number of plans created during the month.\n    COUNT(DISTINCT\
  \ PLAN_ID) AS CREATED_PLANS,\n\n    -- Number of plans created during the month\
  \ that currently have no active tasks.\n    COUNT(\n        DISTINCT CASE\n    \
  \        WHEN CURRENT_TASK_COUNT = 0 THEN PLAN_ID\n        END\n    ) AS EMPTY_PLANS,\n\
  \n    -- Number of plans created during the month that currently have exactly one\
  \ active task.\n    COUNT(\n        DISTINCT CASE\n            WHEN CURRENT_TASK_COUNT\
  \ = 1 THEN PLAN_ID\n        END\n    ) AS SINGLE_TASK_PLANS,\n\n    -- Number of\
  \ plans created during the month that currently have more than ten active tasks.\n\
  \    COUNT(\n        DISTINCT CASE\n            WHEN CURRENT_TASK_COUNT > 10 THEN\
  \ PLAN_ID\n        END\n    ) AS COMPLEX_PLANS,\n\n    -- Average number of currently\
  \ active tasks per plan created during the month.\n    ROUND(\n        AVG(CURRENT_TASK_COUNT),\n\
  \        2\n    ) AS AVG_TASKS_PER_PLAN\n\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_FACT_AT\n\
  \nWHERE PLAN_CREATED_AT >= DATEADD(\n        MONTH,\n        -2,\n        DATE_TRUNC('MONTH',\
  \ CURRENT_DATE())\n    )\n  AND LICENSE_TYPE = 'Purchase'\n\n-- Optional Dimension\
  \ Filters\n-- AND BILLING_ACCOUNT_ID_RAW = '<billing-account-id>'\n-- AND PIPELINE_REGION\
  \ = 'US'\n-- AND ACCOUNT_EDITION = 'Enterprise'\n-- AND PRICING_AND_PACKAGING =\
  \ '2025'\n-- AND WORKSPACE_ID = '<workspace-id>'\n-- AND USER_ID = '<user-id>'\n\
  \nGROUP BY DATE_TRUNC('MONTH', PLAN_CREATED_AT)\n\nORDER BY DATE_TRUNC('MONTH',\
  \ PLAN_CREATED_AT);"
