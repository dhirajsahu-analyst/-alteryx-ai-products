id: plan_lifecycle_summary
name: Plan Lifecycle Summary
description: Lifecycle metrics for Plans
product: plans
status: validated
category: product_metric
definition:
  business: Plan Lifecycle Summary - Lifecycle metrics for Plans
  technical: Query
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables:
  - DISCOVERY_PRODUCT_MANAGEMENT
sql_template: "SELECT\n\n    TO_CHAR(DATE_TRUNC('MONTH', PLAN_CREATED_AT), 'MON YYYY')\
  \ AS MONTH,\n\n    -- Number of plans created during the month.\n    COUNT(DISTINCT\
  \ PLAN_ID) AS CREATED_PLANS,\n\n    -- Number of plans from the monthly cohort that\
  \ have since been deleted.\n    COUNT(\n        DISTINCT CASE\n            WHEN\
  \ IS_PLAN_DELETED = 1 THEN PLAN_ID\n        END\n    ) AS DELETED_PLANS,\n\n   \
  \ -- Number of plans from the monthly cohort that are still active.\n    COUNT(DISTINCT\
  \ PLAN_ID)\n      - COUNT(\n            DISTINCT CASE\n                WHEN IS_PLAN_DELETED\
  \ = 1 THEN PLAN_ID\n            END\n        ) AS ACTIVE_PLANS,\n\n    -- Percentage\
  \ of plans created during the month that have since been deleted.\n    ROUND(\n\
  \        COUNT(\n            DISTINCT CASE\n                WHEN IS_PLAN_DELETED\
  \ = 1 THEN PLAN_ID\n            END\n        ) * 100.0\n        / NULLIF(COUNT(DISTINCT\
  \ PLAN_ID), 0),\n        2\n    ) AS PLAN_CHURN_PERCENT,\n\n    -- Average age in\
  \ days of active plans created during the month.\n    ROUND(\n        AVG(\n   \
  \         CASE\n                WHEN IS_PLAN_DELETED = 0\n                THEN DATEDIFF(DAY,\
  \ PLAN_CREATED_AT, CURRENT_DATE())\n            END\n        ),\n        2\n   \
  \ ) AS AVG_ACTIVE_PLAN_AGE_DAYS\n\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_FACT_AT\n\
  \nWHERE PLAN_CREATED_AT >= DATEADD(\n        MONTH,\n        -2,\n        DATE_TRUNC('MONTH',\
  \ CURRENT_DATE())\n    )\n  AND LICENSE_TYPE = 'Purchase'\n\n-- Optional Dimension\
  \ Filters\n-- AND BILLING_ACCOUNT_ID_RAW = '<raw-billing-account-id>'\n-- AND PIPELINE_REGION\
  \ = 'US'\n-- AND ACCOUNT_EDITION = 'Enterprise'\n-- AND PRICING_AND_PACKAGING =\
  \ '2025'\n-- AND WORKSPACE_ID = '<workspace-id>'\n-- AND USER_ID = '<user-id>'\n\
  \nGROUP BY DATE_TRUNC('MONTH', PLAN_CREATED_AT)\n\nORDER BY DATE_TRUNC('MONTH',\
  \ PLAN_CREATED_AT);"
