id: plans_funnel_plan_lifecycle_activated
name: Plans - Funnel Plan Lifecycle - Activated
description: Active plan subscriptions
product: plans
category: funnel_plan_lifecycle
status: active
freshness: daily
grain: point_in_time
definition:
  business: Active plan subscriptions
  technical: Count of distinct entities meeting activated criteria from plans data
    sources.
source: PLANS_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN ACTIVATED IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT\n    WHERE CREATED_AT\
  \ >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS activated\nFROM\
  \ base_metrics\nWHERE is_active = 1"
tags:
- funnel_plan_lifecycle
- funnel
- conversion
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
