id: plans_health_downgrade_rate
name: Plans - Health - Downgrade Rate
description: Plan downgrade rate
product: plans
category: health
status: active
freshness: daily
grain: point_in_time
definition:
  business: Plan downgrade rate
  technical: Count of distinct entities meeting downgrade_rate criteria from plans
    data sources.
source: PLANS_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN DOWNGRADE_RATE IS NOT NULL THEN 1\n            ELSE 0\n        END AS\
  \ is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS downgrade_rate\nFROM base_metrics\nWHERE is_active = 1"
tags:
- health
- health
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
