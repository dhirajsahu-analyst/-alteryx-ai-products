id: plans_health_upgrade_rate
name: Plans - Health - Upgrade Rate
description: Plan upgrade rate
product: plans
category: health
status: active
freshness: daily
grain: point_in_time
definition:
  business: Plan upgrade rate
  technical: Count of distinct entities meeting upgrade_rate criteria from plans data
    sources.
source: PLANS_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN UPGRADE_RATE IS NOT NULL THEN 1\n            ELSE 0\n        END AS is_active\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT\n    WHERE CREATED_AT\
  \ >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*) AS upgrade_rate\n\
  FROM base_metrics\nWHERE is_active = 1"
tags:
- health
- health
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
