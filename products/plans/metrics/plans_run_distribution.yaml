id: plans_run_distribution
name: Plans Run Distribution
description: Distribution of Plans runs
product: plans
status: validated
category: product_metric
definition:
  business: Plans Run Distribution - Distribution of Plans runs
  technical: Query
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables:
  - DISCOVERY_PRODUCT_MANAGEMENT
sql_template: "SELECT\n    -- Reporting month\n    TO_CHAR(\n        DATE_TRUNC('MONTH',\
  \ YEAR_MONTH),\n        'Mon-YYYY'\n    ) AS MONTH,\n\n    -- Total plan runs\n\
  \    COALESCE(SUM(PLAN_RUN), 0) AS TOTAL_PLAN_RUNS,\n\n    -- Scheduled plan runs\n\
  \    COALESCE(SUM(SCHEDULE_PLAN_RUNS), 0) AS SCHEDULE_PLAN_RUNS,\n\n    -- Percentage\
  \ of scheduled plan runs\n    ROUND(\n        DIV0(\n            COALESCE(SUM(SCHEDULE_PLAN_RUNS),\
  \ 0),\n            COALESCE(SUM(PLAN_RUN), 0)\n        ) * 100,\n        2\n   \
  \ ) AS SCHEDULE_RUN_PCT,\n\n    -- API-triggered plan runs\n    COALESCE(SUM(API_PLAN_RUNS),\
  \ 0) AS API_PLAN_RUNS,\n\n    -- Percentage of API-triggered plan runs\n    ROUND(\n\
  \        DIV0(\n            COALESCE(SUM(API_PLAN_RUNS), 0),\n            COALESCE(SUM(PLAN_RUN),\
  \ 0)\n        ) * 100,\n        2\n    ) AS API_RUN_PCT,\n\n    -- Manually triggered\
  \ plan runs\n    COALESCE(SUM(MANUAL_PLAN_RUNS), 0) AS MANUAL_PLAN_RUNS,\n\n   \
  \ -- Percentage of manually triggered plan runs\n    ROUND(\n        DIV0(\n   \
  \         COALESCE(SUM(MANUAL_PLAN_RUNS), 0),\n            COALESCE(SUM(PLAN_RUN),\
  \ 0)\n        ) * 100,\n        2\n    ) AS MANUAL_RUN_PCT\n\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_MONTHLY_ACCOUNT_AT\n\
  \nWHERE\n    -- Current month and previous three months\n    YEAR_MONTH >= DATE_TRUNC(\n\
  \        'MONTH',\n        DATEADD(\n            MONTH,\n            -3,\n     \
  \       CURRENT_DATE()\n        )\n    )\n\n    -- Purchased accounts only\n   \
  \ AND LICENSE_TYPE = 'Purchase'\n\n    -- Optional filters\n    -- AND PIPELINE_REGION\
  \ = 'AMER'\n    -- AND ACCOUNT_EDITION = 'Enterprise'\n    -- AND PRICING_AND_PACKAGING\
  \ = '2025'\n    -- AND BILLING_ACCOUNT_ID = '<ACCOUNT_ID>'\n\nGROUP BY\n    DATE_TRUNC('MONTH',\
  \ YEAR_MONTH)\n\nORDER BY\n    DATE_TRUNC('MONTH', YEAR_MONTH);"
