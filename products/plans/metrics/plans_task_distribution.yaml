id: plans_task_distribution
name: Plans Task Distribution
description: Distribution of tasks in Plans
product: plans
status: validated
category: product_metric
definition:
  business: Plans Task Distribution - Distribution of tasks in Plans
  technical: Query from PLNAS_TASK_DISTRIBUTAION_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables:
  - DISCOVERY_PRODUCT_MANAGEMENT
sql_template: |-
  SELECT
      -- Reporting month
      TO_CHAR(
          DATE_TRUNC('MONTH', YEAR_MONTH),
          'Mon-YYYY'
      ) AS MONTH,

      -- Total created plans containing at least one task
      COALESCE(SUM(CREATED_PLAN), 0)
          - COALESCE(SUM(PLANS_WITHOUT_TASK), 0)
          AS PLANS_WITH_AT_LEAST_ONE_TASK,

      -- Plans containing workflow tasks
      COALESCE(SUM(PLANS_WITH_WORKFLOW_TASK), 0) AS WORKFLOW_TASKS,

      -- Plans containing flow tasks
      COALESCE(SUM(PLANS_WITH_FLOW_TASK), 0) AS FLOW_TASKS,

      -- Plans containing HTTP tasks
      COALESCE(SUM(PLANS_WITH_HTTP_TASK), 0) AS HTTP_TASKS,

      -- Plans containing email tasks
      COALESCE(SUM(PLANS_WITH_EMAIL_TASK), 0) AS EMAIL_TASKS,

      -- Plans containing AI dataset tasks
      COALESCE(SUM(PLANS_WITH_AI_DATASET_TASK), 0) AS AI_DATASET_TASKS,

      -- Plans containing CEFD tasks
      COALESCE(SUM(PLANS_WITH_CEFD_TASK), 0) AS CEFD_TASKS,

      -- Plans containing machine learning tasks
      COALESCE(SUM(PLANS_WITH_ML_TASK), 0) AS ML_TASKS

  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLANS_MONTHLY_ACCOUNT_AT

  WHERE
      -- Current month and previous three months
      YEAR_MONTH >= DATE_TRUNC(
          'MONTH',
          DATEADD(
              MONTH,
              -3,
              CURRENT_DATE()
          )
      )

      -- Purchased accounts only
      AND LICENSE_TYPE = 'Purchase'

      -- Optional filters
      -- AND PIPELINE_REGION = 'AMER'
      -- AND ACCOUNT_EDITION = 'Enterprise'
      -- AND PRICING_AND_PACKAGING = '2025'

  GROUP BY
      DATE_TRUNC('MONTH', YEAR_MONTH)

  ORDER BY
      DATE_TRUNC('MONTH', YEAR_MONTH);
