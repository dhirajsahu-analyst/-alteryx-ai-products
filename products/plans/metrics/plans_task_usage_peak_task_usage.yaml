id: plans_task_usage_peak_task_usage
name: Plans - Task Usage - Peak Task Usage
description: Peak task usage period
product: plans
category: task_usage
status: active
freshness: daily
grain: point_in_time
definition:
  business: Peak task usage period
  technical: Count of distinct entities meeting peak_task_usage criteria from plans
    data sources.
source: PLANS_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN PEAK_TASK_USAGE IS NOT NULL THEN 1\n            ELSE 0\n        END AS\
  \ is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PLAN_USAGE_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS peak_task_usage\nFROM base_metrics\nWHERE is_active = 1"
tags:
- task_usage
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
