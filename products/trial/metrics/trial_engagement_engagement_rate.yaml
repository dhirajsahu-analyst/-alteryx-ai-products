id: trial_engagement_engagement_rate
name: Trial - Engagement - Engagement Rate
description: Overall engagement score
product: trial
category: engagement
status: active
freshness: daily
grain: point_in_time
definition:
  business: Overall engagement score
  technical: Count of distinct entities meeting engagement_rate criteria from trial
    data sources.
source: TRIAL_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_USAGE_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN ENGAGEMENT_RATE IS NOT NULL THEN 1\n            ELSE 0\n        END AS\
  \ is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_USAGE_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS engagement_rate\nFROM base_metrics\nWHERE is_active = 1"
tags:
- engagement
- engagement
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
