id: trial_funnel_conversion_rates_monthly_percentage
name: Trial Funnel Conversion Rates (Monthly Percentage)
description: Stage-to-stage conversion rates showing funnel health by month
product: trial
status: validated
category: funnel
definition:
  business: Detailed funnel analysis identifying conversion bottlenecks and optimization opportunities
  technical: Calculated from TRIAL_FUNNEL_METRICS_MONTHLY_VIEW with sequential ratios
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    RESPONSE_MONTH,
    ROUND((QL / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)) * 100, 2) AS signup_to_ql_pct,
    ROUND((SAL / NULLIF(QL, 0)) * 100, 2) AS ql_to_sal_pct,
    ROUND((PIPELINE / NULLIF(SAL, 0)) * 100, 2) AS sal_to_pipeline_pct,
    ROUND((CLOSED_WON / NULLIF(PIPELINE, 0)) * 100, 2) AS pipeline_to_closed_won_pct,
    ROUND((CLOSED_WON / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)) * 100, 2) AS total_conversion_pct,
    ROUND(((TOTAL_TRIAL_REGISTRATION - CLOSED_WON) / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)) * 100, 2) AS churn_pct
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS_MONTHLY_VIEW
  ORDER BY RESPONSE_MONTH DESC
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_013
- trial_015
maintainer: analytics@alteryx.com
tags:
- funnel
- trial
last_updated: '2026-08-03'
version: '1.0'
