id: trial_funnel_stages_monthly_absolute_counts
name: Trial Funnel Stages (Monthly Absolute Counts)
description: Complete monthly breakdown of trial funnel with counts at each stage
product: trial
status: validated
category: funnel
definition:
  business: End-to-end trial funnel visibility for sales and marketing pipeline planning
  technical: From TRIAL_FUNNEL_METRICS_MONTHLY_VIEW with all stage counts
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    RESPONSE_MONTH,
    TOTAL_TRIAL_REGISTRATION AS stage_0_signups,
    QL AS stage_1_qualified_leads,
    SAL AS stage_2_sales_accepted_leads,
    PIPELINE AS stage_3_pipeline,
    CLOSED_WON AS stage_4_closed_won,
    ROUND((QL / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)) * 100, 2) AS pct_0_to_1,
    ROUND((SAL / NULLIF(QL, 0)) * 100, 2) AS pct_1_to_2,
    ROUND((PIPELINE / NULLIF(SAL, 0)) * 100, 2) AS pct_2_to_3,
    ROUND((CLOSED_WON / NULLIF(PIPELINE, 0)) * 100, 2) AS pct_3_to_4
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS_MONTHLY_VIEW
  ORDER BY RESPONSE_MONTH DESC
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_002
- trial_003
- trial_004
maintainer: analytics@alteryx.com
tags:
- funnel
- trial
last_updated: '2026-08-03'
version: '1.0'
