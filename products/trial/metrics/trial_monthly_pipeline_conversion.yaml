id: trial_monthly_pipeline_conversion
name: Trial Monthly Pipeline Conversion
description: Monthly Pipeline opportunity conversion from trial signups
product: trial
status: validated
category: funnel
definition:
  business: Sales pipeline metric showing trial contribution to revenue opportunities
  technical: 'From TRIAL_FUNNEL_METRICS_MONTHLY_VIEW: PIPELINE count and rate'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    RESPONSE_MONTH,
    TOTAL_TRIAL_REGISTRATION,
    PIPELINE,
    ROUND((PIPELINE / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)) * 100, 2) AS pipeline_rate_pct,
    LAG(PIPELINE) OVER (ORDER BY RESPONSE_MONTH) AS prev_month_pipeline,
    ROUND((PIPELINE - LAG(PIPELINE) OVER (ORDER BY RESPONSE_MONTH)) /
          NULLIF(LAG(PIPELINE) OVER (ORDER BY RESPONSE_MONTH), 0) * 100, 2) AS mom_growth_pct
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS_MONTHLY_VIEW
  ORDER BY RESPONSE_MONTH DESC
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_007
- trial_009
maintainer: analytics@alteryx.com
tags:
