id: trial_monthly_ql_conversion
name: Trial Monthly QL Conversion
description: Monthly Qualified Lead conversion tracking with percentage analysis
product: trial
status: validated
category: funnel
definition:
  business: Monthly conversion metric showing trial engagement and qualification trends
  technical: 'From TRIAL_FUNNEL_METRICS_MONTHLY_VIEW: QL and conversion rates'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    RESPONSE_MONTH,
    TOTAL_TRIAL_REGISTRATION,
    QL,
    ROUND((QL / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)) * 100, 2) AS ql_conversion_rate_pct,
    LAG(QL) OVER (ORDER BY RESPONSE_MONTH) AS prev_month_ql,
    ROUND((QL - LAG(QL) OVER (ORDER BY RESPONSE_MONTH)) /
          NULLIF(LAG(QL) OVER (ORDER BY RESPONSE_MONTH), 0) * 100, 2) AS mom_ql_growth_pct
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS_MONTHLY_VIEW
  ORDER BY RESPONSE_MONTH DESC
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_005
- trial_007
maintainer: analytics@alteryx.com
tags:
