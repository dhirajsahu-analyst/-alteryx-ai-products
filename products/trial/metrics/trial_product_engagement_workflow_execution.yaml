id: trial_product_engagement_workflow_execution
name: Trial Product Engagement - Workflow Execution
description: Monthly count and rate of trial users executing workflows in Designer
product: trial
status: validated
category: engagement
definition:
  business: Product activation metric showing trial users moving from creation to execution
  technical: 'From TRIAL_FUNNEL_METRICS_MONTHLY_VIEW: USERS_RAN_WORKFLOW'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    RESPONSE_MONTH,
    TOTAL_TRIAL_REGISTRATION,
    USERS_RAN_WORKFLOW,
    USERS_CREATED_NEW_WORKFLOW,
    ROUND((USERS_RAN_WORKFLOW / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)) * 100, 2) AS workflow_execution_rate_pct,
    ROUND((USERS_RAN_WORKFLOW / NULLIF(USERS_CREATED_NEW_WORKFLOW, 0)) * 100, 2) AS execution_from_creation_pct,
    LAG(USERS_RAN_WORKFLOW) OVER (ORDER BY RESPONSE_MONTH) AS prev_month_runners
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS_MONTHLY_VIEW
  ORDER BY RESPONSE_MONTH DESC
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_010
- trial_012
maintainer: analytics@alteryx.com
tags:
- engagement
- trial
last_updated: '2026-08-03'
version: '1.0'
