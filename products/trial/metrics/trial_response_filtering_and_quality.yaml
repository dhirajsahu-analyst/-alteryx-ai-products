id: trial_response_filtering_and_quality
name: Trial Response Filtering and Quality
description: Impact of response filtering on trial-to-paid conversion rate and lead quality
product: trial
status: validated
category: funnel
definition:
  business: Data quality metric showing how response filtering affects conversion analysis
  technical: 'From TRIAL_FUNNEL_METRICS_MONTHLY_VIEW: FILTERED_RESPONSE_COUNT and ADJUSTED_CLOSED_WON_RATE_PCT'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    RESPONSE_MONTH,
    TOTAL_TRIAL_REGISTRATION,
    FILTERED_RESPONSE_COUNT,
    ROUND((FILTERED_RESPONSE_COUNT / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)) * 100, 2) AS filter_rate_pct,
    ADJUSTED_CLOSED_WON_RATE_PCT,
    ROUND(TOTAL_TRIAL_REGISTRATION - FILTERED_RESPONSE_COUNT, 0) AS unfiltered_responses,
    ROUND(ADJUSTED_CLOSED_WON_RATE_PCT, 2) AS adjusted_cw_rate_pct
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS_MONTHLY_VIEW
  ORDER BY RESPONSE_MONTH DESC
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_004
- trial_014
maintainer: analytics@alteryx.com
tags:
- funnel
- trial
