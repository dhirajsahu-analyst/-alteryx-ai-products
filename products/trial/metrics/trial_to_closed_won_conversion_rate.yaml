id: trial_to_closed_won_conversion_rate
name: Trial to Closed Won Conversion Rate
description: Overall trial-to-paid conversion rate showing end-to-end funnel effectiveness
product: trial
status: validated
category: funnel
definition:
  business: Key business metric showing trial program ROI and revenue impact
  technical: 'From TRIAL_FUNNEL_METRICS_OVERALL_VIEW: ADJUSTED_CLOSED_WON_RATE_PCT'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    TOTAL_TRIAL_REGISTRATION,
    CLOSED_WON,
    ADJUSTED_CLOSED_WON_RATE_PCT,
    ROUND((CLOSED_WON / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)) * 100, 2) AS raw_conversion_rate_pct,
    TOTAL_TRIAL_REGISTRATION - CLOSED_WON AS non_converted_trials
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS_OVERALL_VIEW
  LIMIT 1
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_002
- trial_003
maintainer: analytics@alteryx.com
tags:
- funnel
- trial
