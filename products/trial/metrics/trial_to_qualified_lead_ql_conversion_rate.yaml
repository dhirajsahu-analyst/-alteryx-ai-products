id: trial_to_qualified_lead_ql_conversion_rate
name: Trial to Qualified Lead (QL) Conversion Rate
description: Percentage of trial signups that progress to Qualified Lead status
product: trial
status: validated
category: funnel
definition:
  business: Early engagement metric showing trial activation and qualification effectiveness
  technical: 'From TRIAL_FUNNEL_METRICS_OVERALL_VIEW: QL / TOTAL_TRIAL_REGISTRATION
    * 100'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    COUNT(DISTINCT campaign_member_email) AS total_trial_registration,\n\
  \n    COUNT(DISTINCT CASE\n        WHEN is_response_to_ql_conversion\n        THEN\
  \ campaign_member_email\n    END) AS ql,\n\n    COUNT(DISTINCT CASE\n        WHEN\
  \ is_response_to_sal_conversion\n        THEN campaign_member_email\n    END) AS\
  \ sal,\n\n    COUNT(DISTINCT CASE\n        WHEN is_response_to_pipeline_conversion\n\
  \        THEN campaign_member_email\n    END) AS pipeline,\n\n    COUNT(DISTINCT\
  \ CASE\n        WHEN is_response_to_cw_conversion\n        THEN campaign_member_email\n\
  \    END) AS closed_won,\n\n    COUNT(DISTINCT CASE\n        WHEN is_response_filtered\n\
  \        THEN campaign_member_email\n    END) AS filtered_response_count,\n\n  \
  \  ROUND(\n        100.0\n        * COUNT(DISTINCT CASE\n            WHEN is_response_to_cw_conversion\n\
  \            THEN campaign_member_email\n        END)\n        / NULLIF(\n     \
  \       COUNT(DISTINCT CASE\n                WHEN is_response_filtered\n       \
  \         THEN campaign_member_email\n            END),\n            0\n       \
  \ ),\n        2\n    ) AS adjusted_closed_won_rate_pct\n\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS;"
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_001
- trial_003
maintainer: analytics@alteryx.com
tags:
- funnel
- trial
