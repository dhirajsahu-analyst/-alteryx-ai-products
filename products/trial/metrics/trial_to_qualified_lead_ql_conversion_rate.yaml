id: trial_to_qualified_lead_ql_conversion_rate
name: Trial to Qualified Lead (QL) Conversion Rate
description: Percentage of trial signups that progress to Qualified Lead status
product: trial
status: validated
category: funnel
definition:
  business: Early engagement metric showing trial activation and qualification effectiveness
  technical: 'From TRIAL_FUNNEL_METRICS_OVERALL_VIEW: QL / TOTAL_TRIAL_REGISTRATION * 100'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    TOTAL_TRIAL_REGISTRATION,
    QL,
    ROUND((QL / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)) * 100, 2) AS ql_conversion_rate_pct,
    ROUND((QL / NULLIF(TOTAL_TRIAL_REGISTRATION, 0)), 4) AS ql_conversion_rate_decimal
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS_OVERALL_VIEW
  LIMIT 1
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_001
- trial_003
maintainer: analytics@alteryx.com
tags:
- funnel
- trial
last_updated: '2026-08-03'
version: '1.0'
