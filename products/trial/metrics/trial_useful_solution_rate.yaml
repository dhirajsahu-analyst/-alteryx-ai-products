id: trial_useful_solution_rate
name: Trial Useful Solution Rate
description: Monthly percentage of trial users who find the product useful (workflow
  execution indicator)
product: trial
status: validated
category: engagement
definition:
  business: Quality metric showing trial experience satisfaction and product-market
    fit
  technical: 'From TRIAL_FUNNEL_METRICS_MONTHLY_VIEW: USEFUL_SOLUTION_RATE_MONTHLY'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    DATE_TRUNC(\n        'MONTH',\n        effective_first_responded_date\n\
  \    ) AS response_month,\n\n    COUNT(\n        DISTINCT campaign_member_email\n\
  \    ) AS total_trial_registration,\n\n    COUNT(DISTINCT CASE\n        WHEN is_response_to_ql_conversion\n\
  \        THEN campaign_member_email\n    END) AS ql,\n\n    COUNT(DISTINCT CASE\n\
  \        WHEN is_response_to_sal_conversion\n        THEN campaign_member_email\n\
  \    END) AS sal,\n\n    COUNT(DISTINCT CASE\n        WHEN is_response_to_pipeline_conversion\n\
  \        THEN campaign_member_email\n    END) AS pipeline,\n\n    COUNT(DISTINCT\
  \ CASE\n        WHEN is_response_to_cw_conversion\n        THEN campaign_member_email\n\
  \    END) AS closed_won,\n\n    COUNT(DISTINCT CASE\n        WHEN is_response_filtered\n\
  \        THEN campaign_member_email\n    END) AS filtered_response_count,\n\n  \
  \  ROUND(\n        COUNT(DISTINCT CASE\n            WHEN is_response_to_cw_conversion\n\
  \            THEN campaign_member_email\n        END)\n        / NULLIF(\n     \
  \       COUNT(DISTINCT CASE\n                WHEN is_response_filtered\n       \
  \         THEN campaign_member_email\n            END),\n            0\n       \
  \ ),\n        4\n    ) AS adjusted_closed_won_rate_pct,\n\n    COUNT(DISTINCT CASE\n\
  \        WHEN COALESCE(dc_workflow_created, 0) > 0\n        THEN campaign_member_email\n\
  \    END) AS users_created_new_workflow,\n\n    COUNT(DISTINCT CASE\n        WHEN\
  \ COALESCE(desktop_wf_run, 0) > 0\n          OR COALESCE(dc_workflow_run, 0) > 0\n\
  \        THEN campaign_member_email\n    END) AS users_ran_workflow,\n\n    ROUND(\n\
  \        COUNT(DISTINCT CASE\n            WHEN COALESCE(desktop_wf_run, 0) > 0\n\
  \              OR COALESCE(dc_workflow_run, 0) > 0\n            THEN campaign_member_email\n\
  \        END)\n        / NULLIF(\n            COUNT(DISTINCT campaign_member_email),\n\
  \            0\n        ),\n        4\n    ) AS useful_solution_rate_monthly\n\n\
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS\n\nGROUP BY\n\
  \    response_month;"
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_010
- trial_011
maintainer: analytics@alteryx.com
tags:
- engagement
- trial
