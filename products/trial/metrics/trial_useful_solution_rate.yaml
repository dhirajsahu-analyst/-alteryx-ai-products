id: trial_useful_solution_rate
name: Trial Useful Solution Rate
description: Monthly percentage of trial users who find the product useful (workflow execution indicator)
product: trial
status: validated
category: engagement
definition:
  business: Quality metric showing trial experience satisfaction and product-market fit
  technical: 'From TRIAL_FUNNEL_METRICS_MONTHLY_VIEW: USEFUL_SOLUTION_RATE_MONTHLY'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    RESPONSE_MONTH,
    USEFUL_SOLUTION_RATE_MONTHLY,
    USERS_RAN_WORKFLOW,
    LAG(USEFUL_SOLUTION_RATE_MONTHLY) OVER (ORDER BY RESPONSE_MONTH) AS prev_month_rate,
    ROUND(USEFUL_SOLUTION_RATE_MONTHLY - LAG(USEFUL_SOLUTION_RATE_MONTHLY) OVER (ORDER BY RESPONSE_MONTH), 2) AS mom_change_pct
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.TRIAL_FUNNEL_METRICS_MONTHLY_VIEW
  ORDER BY RESPONSE_MONTH DESC
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- trial_010
- trial_011
maintainer: analytics@alteryx.com
tags:
- engagement
- trial
last_updated: '2026-08-03'
version: '1.0'
