id: version_adoption_004
name: Designer 2025 Adoption Percentage
description: Percentage of Designer accounts and users running version 2025.1 or later,
  latest product generation
product: version_adoption
status: validated
category: adoption
definition:
  business: Key adoption metric tracking migration to latest Designer generation with
    new capabilities and UX
  technical: Direct read for latest month
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    ROUND(\n        COUNT(DISTINCT CASE\n            WHEN DATE_TRUNC('MONTH',\
  \ MONTH) = DATE_TRUNC('MONTH', DATEADD('MONTH', -1, CURRENT_DATE()))\n         \
  \    AND LICENSE_TYPE = 'Purchase'\n             AND PRODUCT_ID = 'Alteryx Designer'\n\
  \             AND \"Designer Prevailing VERSION\" >= '2025.1'\n            THEN\
  \ BILLING_ACCOUNT_ID\n        END)\n        / NULLIF(\n            COUNT(DISTINCT\
  \ CASE\n                WHEN DATE_TRUNC('MONTH', MONTH) = DATE_TRUNC('MONTH', DATEADD('MONTH',\
  \ -1, CURRENT_DATE()))\n                 AND LICENSE_TYPE = 'Purchase'\n       \
  \         THEN BILLING_ACCOUNT_ID\n            END), 0),\n        2\n    ) AS PCT_OF_DESIGNER_ACCOUNTS,\n\
  \n    ROUND(\n        COUNT(DISTINCT CASE\n            WHEN DATE_TRUNC('MONTH',\
  \ MONTH) = DATE_TRUNC('MONTH', DATEADD('MONTH', -1, CURRENT_DATE()))\n         \
  \    AND LICENSE_TYPE = 'Purchase'\n             AND PRODUCT_ID = 'Alteryx Designer'\n\
  \             AND VERSION >= '2025.1'\n            THEN \"USER_ID\"\n        END)\n\
  \        / NULLIF(\n            COUNT(DISTINCT CASE\n                WHEN DATE_TRUNC('MONTH',\
  \ MONTH) = DATE_TRUNC('MONTH', DATEADD('MONTH', -1, CURRENT_DATE()))\n         \
  \        AND LICENSE_TYPE = 'Purchase'\n                THEN \"USER_ID\"\n     \
  \       END), 0),\n        2\n    ) AS PCT_OF_DESIGNER_USERS\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION;"
queries: []
aggregation_level: overall
grain: overall
freshness: daily
