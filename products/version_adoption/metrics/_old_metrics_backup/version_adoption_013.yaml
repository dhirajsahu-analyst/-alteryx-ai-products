id: version_adoption_013
name: Version Adoption by Time-to-Upgrade
description: Adoption rate measurements at 30, 60, 90, and 180 days post-release for
  Designer and Server
product: version_adoption
status: validated
category: adoption
definition:
  business: Benchmarking metric showing upgrade speed and identifying slower adoption
    versions
  technical: with multi-day milestone tracking
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "WITH base AS (\n    SELECT\n        VERSION,\n        DAYS::INT AS\
  \ DAYS,\n        RELEASE_DATE,\n        SUM(DESIGNER_VERSION_USERS)   AS DESIGNER_VERSION_USERS,\n\
  \        SUM(DESIGNER_TOTAL_USERS)     AS DESIGNER_TOTAL_USERS,\n        SUM(SERVER_VERSION_MACHINES)\
  \  AS SERVER_VERSION_MACHINES,\n        SUM(SERVER_TOTAL_MACHINES)    AS SERVER_TOTAL_MACHINES\n\
  \    FROM DISCOVERY_PRODUCT_MANAGEMENT.TEL_STRAT.VERSION_ADOPTION_RATES\n    WHERE\
  \ DAYS IN (30, 60, 90, 180)\n    GROUP BY\n        VERSION,\n        DAYS,\n   \
  \     RELEASE_DATE\n),\nrates AS (\n    SELECT\n        VERSION,\n        DAYS,\n\
  \        RELEASE_DATE,\n        DESIGNER_VERSION_USERS,\n        DESIGNER_TOTAL_USERS,\n\
  \        SERVER_VERSION_MACHINES,\n        SERVER_TOTAL_MACHINES,\n        ROUND(DIV0(DESIGNER_VERSION_USERS\
  \ * 100, DESIGNER_TOTAL_USERS), 1)  AS DESIGNER_ADOPTION,\n        ROUND(DIV0(SERVER_VERSION_MACHINES\
  \ * 100, SERVER_TOTAL_MACHINES), 1) AS SERVER_ADOPTION\n    FROM base\n)\nSELECT\n\
  \    VERSION,\n    DAYS,\n    RELEASE_DATE,\n    DESIGNER_VERSION_USERS,\n    DESIGNER_TOTAL_USERS,\n\
  \    SERVER_VERSION_MACHINES,\n    SERVER_TOTAL_MACHINES,\n    DESIGNER_ADOPTION,\n\
  \    SERVER_ADOPTION,\n    AVG(DESIGNER_ADOPTION) OVER (PARTITION BY DAYS) AS DESIGNER_ADOPTION_AVG_BY_DAYS,\n\
  \    AVG(SERVER_ADOPTION)   OVER (PARTITION BY DAYS) AS SERVER_ADOPTION_AVG_BY_DAYS\n\
  FROM rates\nORDER BY\n    DAYS,\n    RELEASE_DATE,\n    VERSION;"
queries: []
aggregation_level: cohort
grain: cohort
freshness: daily
filters:
- DAYS IN (30, 60, 90, 180)
depends_on: []
