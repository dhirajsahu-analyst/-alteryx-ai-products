id: version_adoption_003
name: Designer Supported Version Account Percentage
description: Monthly percentage of Designer accounts running a supported version of
  the product
product: version_adoption
status: validated
category: adoption
definition:
  business: Tracks account-level upgrade health for Designer, supporting customer
    success and support prioritization
  technical: ', DESIGNER_PCT_SUPPORTED column'
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    DATE(MONTH) AS MONTH,\n    COUNT(DISTINCT CASE WHEN PRODUCT_ID\
  \ = 'Alteryx Designer'\n                         AND SUPPORTED_UNSUPPORTED_PREVAILING_VERSION\
  \ = 'Supported'\n                        THEN SFDC_ACCOUNT_CID ELSE NULL END)\n\
  \        / NULLIF(COUNT(DISTINCT CASE WHEN PRODUCT_ID = 'Alteryx Designer'\n   \
  \                     THEN SFDC_ACCOUNT_CID ELSE NULL END), 0) AS DESIGNER_PCT_SUPPORTED,\n\
  \    COUNT(DISTINCT CASE WHEN PRODUCT_ID = 'Alteryx Server'\n                  \
  \       AND SUPPORTED_UNSUPPORTED_PREVAILING_VERSION = 'Supported'\n           \
  \             THEN SFDC_ACCOUNT_CID ELSE NULL END)\n        / NULLIF(COUNT(DISTINCT\
  \ CASE WHEN PRODUCT_ID = 'Alteryx Server'\n                        THEN SFDC_ACCOUNT_CID\
  \ ELSE NULL END), 0) AS SERVER_PCT_SUPPORTED\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION\n\
  WHERE PRODUCT_ID IN ('Alteryx Designer', 'Alteryx Server')\n  AND MONTH >= DATE_TRUNC('MONTH',\
  \ DATEADD('MONTH', -6, CURRENT_DATE))\nGROUP BY MONTH\nORDER BY MONTH DESC;"
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- version_adoption_004
- version_adoption_005
