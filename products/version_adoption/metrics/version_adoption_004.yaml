id: version_adoption_004
name: Designer 2025 Adoption Percentage
description: Percentage of Designer accounts and users running version 2025.1 or later, latest product generation
product: version_adoption
status: validated
category: adoption
definition:
  business: Key adoption metric tracking migration to latest Designer generation with new capabilities and UX
  technical: Direct read from DESIGNER_2025_ADOPTION_PCT_LATEST_MONTH_VIEW for latest month
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    PCT_OF_DESIGNER_ACCOUNTS,
    PCT_OF_DESIGNER_USERS,
    (PCT_OF_DESIGNER_ACCOUNTS + PCT_OF_DESIGNER_USERS) / 2 AS blended_adoption_pct
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_2025_ADOPTION_PCT_LATEST_MONTH_VIEW
  LIMIT 1
queries: []
aggregation_level: overall
grain: overall
freshness: daily
filters: []
depends_on: []
related_metrics:
- version_adoption_006
- version_adoption_007
