id: version_adoption_008
name: Version Running Sum Users Pareto
description: Cumulative user distribution across versions showing 80/20 concentration
  analysis
product: version_adoption
status: validated
category: adoption
definition:
  business: Identifies which versions account for 80% of active users, optimizing
    support and compatibility focus
  technical: From VERSION_RUNNING_SUM_USERS_AND_MACHINE_VIEW with Pareto calculations
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    PRODUCT_ID,\n    VERSION,\n    COUNT(DISTINCT USER_ID)\
  \ AS TOTAL_USERS,\n    ROUND(\n        SUM(COUNT(DISTINCT USER_ID)) OVER (\n   \
  \         PARTITION BY PRODUCT_ID ORDER BY COUNT(DISTINCT USER_ID) DESC ROWS UNBOUNDED\
  \ PRECEDING\n        ) / SUM(COUNT(DISTINCT USER_ID)) OVER (PARTITION BY PRODUCT_ID),\n\
  \        4\n    ) AS RUNNING_PCT_OF_USER_TOTAL,\n    --Machine Metrics\n    COUNT(DISTINCT\
  \ MACHINE_ID) AS TOTAL_MACHINES,\n    ROUND(\n        SUM(COUNT(DISTINCT MACHINE_ID))\
  \ OVER (\n            PARTITION BY PRODUCT_ID ORDER BY COUNT(DISTINCT MACHINE_ID)\
  \ DESC ROWS UNBOUNDED PRECEDING\n        ) / SUM(COUNT(DISTINCT MACHINE_ID)) OVER\
  \ (PARTITION BY PRODUCT_ID),\n        4\n    ) AS RUNNING_PCT_OF_MACHINE_TOTAL\n\
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION\nWHERE\n\
  \    (PRODUCT_ID = 'Alteryx Designer'\n        AND MONTH >= DATEADD(MONTH, -1, LAST_DAY(CURRENT_DATE\
  \ - INTERVAL '1 month')))\n    OR\n    (PRODUCT_ID = 'Alteryx Server'\n        AND\
  \ MONTH >= DATE_TRUNC('MONTH', DATEADD('MONTH', -1, CURRENT_DATE))\n        AND\
  \ MONTH <  DATE_TRUNC('MONTH', CURRENT_DATE))\nGROUP BY PRODUCT_ID, VERSION\nORDER\
  \ BY PRODUCT_ID, TOTAL_USERS DESC;"
queries: []
aggregation_level: overall
grain: overall
freshness: daily
