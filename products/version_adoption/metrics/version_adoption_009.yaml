id: version_adoption_009
name: Product Version Adoption Summary (Monthly)
description: Monthly headline metrics for Designer/Server adoption including distinct users, accounts, machines, and run volume
product: version_adoption
status: validated
category: volume
definition:
  business: Provides aggregate product usage metrics showing customer base size and engagement
  technical: Direct from PRODUCT_VERSION_ADOPTION_MONTHLY_SUMMARY_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    MONTH,
    PRODUCT_ID,
    TOTAL_MACHINES,
    TOTAL_ACCOUNTS,
    TOTAL_USERS,
    TOTAL_RUNS,
    ROUND(TOTAL_RUNS / NULLIF(TOTAL_USERS, 0), 2) AS runs_per_user,
    LAG(TOTAL_USERS) OVER (PARTITION BY PRODUCT_ID ORDER BY MONTH) AS prev_month_users,
    ROUND((TOTAL_USERS - LAG(TOTAL_USERS) OVER (PARTITION BY PRODUCT_ID ORDER BY MONTH)) /
          NULLIF(LAG(TOTAL_USERS) OVER (PARTITION BY PRODUCT_ID ORDER BY MONTH), 0) * 100, 2) AS user_growth_pct
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION_MONTHLY_SUMMARY_VIEW
  ORDER BY MONTH DESC, PRODUCT_ID
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- version_adoption_001
- version_adoption_002
maintainer: analytics@alteryx.com
