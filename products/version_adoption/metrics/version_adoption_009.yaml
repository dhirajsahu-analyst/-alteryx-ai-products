id: version_adoption_009
name: Product Version Adoption Summary (Monthly)
description: Monthly headline metrics for Designer/Server adoption including distinct
  users, accounts, machines, and run volume
product: version_adoption
status: validated
category: volume
definition:
  business: Provides aggregate product usage metrics showing customer base size and
    engagement
  technical: Direct from PRODUCT_VERSION_ADOPTION_MONTHLY_SUMMARY_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    DATE(MONTH)                        AS MONTH,\n    PRODUCT_ID\
  \                         AS PRODUCT_ID,\n    COUNT(DISTINCT MACHINE_ID)       \
  \  AS TOTAL_MACHINES,\n    COUNT(DISTINCT SFDC_ACCOUNT_CID)   AS TOTAL_ACCOUNTS,\n\
  \    COUNT(DISTINCT USER_ID)            AS TOTAL_USERS,\n    SUM(RUNS)         \
  \                 AS TOTAL_RUNS\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION\n\
  WHERE PRODUCT_ID IN ('Alteryx Designer', 'Alteryx Server')\n  AND MONTH >= DATEADD(MONTH,\
  \ -6, LAST_DAY(CURRENT_DATE - INTERVAL '1 month'))\nGROUP BY DATE(MONTH), PRODUCT_ID\n\
  ORDER BY MONTH DESC, PRODUCT_ID;"
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- version_adoption_001
- version_adoption_002
maintainer: analytics@alteryx.com
tags:
- volume
- version_adoption
