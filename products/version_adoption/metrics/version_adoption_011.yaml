id: version_adoption_011
name: Machine and User Supported Version Percentage
description: Monthly percentage of machines and users running supported versions by
  product
product: version_adoption
status: validated
category: adoption
definition:
  business: Technical health metric showing infrastructure modernization and support
    risk exposure
  technical: ''
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    DATE(MONTH) AS MONTH,\n    PRODUCT_ID,\n    \"Supported_Unsupported\"\
  \ AS SUPPORTED_UNSUPPORTED,\n\n    --Machine Metrics\n    COUNT(DISTINCT MACHINE_ID)\
  \ AS TOTAL_MACHINES,\n    ROUND(\n        COUNT(DISTINCT CASE WHEN \"Supported_Unsupported\"\
  \ = 'Supported' THEN MACHINE_ID END)\n        / NULLIF(SUM(COUNT(DISTINCT MACHINE_ID))\
  \ OVER (PARTITION BY MONTH, PRODUCT_ID), 0),\n        4\n    ) AS PCT_SUPPORTED_MACHINE,\n\
  \n    --User Metrics\n    COUNT(DISTINCT USER_ID) AS TOTAL_USERS,\n    ROUND(\n\
  \        COUNT(DISTINCT CASE WHEN \"Supported_Unsupported\" = 'Supported' THEN USER_ID\
  \ END)\n        / NULLIF(SUM(COUNT(DISTINCT USER_ID)) OVER (PARTITION BY MONTH,\
  \ PRODUCT_ID), 0),\n        4\n    ) AS PCT_SUPPORTED_USER\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION\n\
  WHERE PRODUCT_ID IN ('Alteryx Designer', 'Alteryx Server')\n  AND MONTH >= DATE_TRUNC('MONTH',\
  \ DATEADD('MONTH', -6, CURRENT_DATE))\n  AND MONTH <  DATE_TRUNC('MONTH', CURRENT_DATE)\n\
  GROUP BY MONTH, PRODUCT_ID, \"Supported_Unsupported\"\nORDER BY MONTH DESC, PRODUCT_ID;"
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
