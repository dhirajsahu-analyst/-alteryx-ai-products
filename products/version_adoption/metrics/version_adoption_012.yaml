id: version_adoption_012
name: Designer Users on 2025+ Latest Version
description: Count and percentage of Designer users running 2025.1 or later versions, monthly trend
product: version_adoption
status: validated
category: adoption
definition:
  business: Adoption velocity metric for latest Designer generation showing feature enablement progress
  technical: From DESIGNER_LATEST_VERSION_ADOPTION_MONTHLY_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: |
  SELECT
    MONTH,
    TOTAL_ACCOUNTS_PREVAILING_2025_1_PLUS AS accounts_2025_plus,
    TOTAL_USERS_VERSION_2025_1_PLUS AS users_2025_plus,
    TOTAL_AYX_ONE_ACCOUNTS,
    TOTAL_AYX_ONE_USERS,
    ROUND(TOTAL_USERS_VERSION_2025_1_PLUS / NULLIF(TOTAL_AYX_ONE_USERS, 0) * 100, 2) AS pct_2025_of_one,
    LAG(TOTAL_USERS_VERSION_2025_1_PLUS) OVER (ORDER BY MONTH) AS prev_users_2025,
    ROUND((TOTAL_USERS_VERSION_2025_1_PLUS - LAG(TOTAL_USERS_VERSION_2025_1_PLUS) OVER (ORDER BY MONTH)) /
          NULLIF(LAG(TOTAL_USERS_VERSION_2025_1_PLUS) OVER (ORDER BY MONTH), 0) * 100, 2) AS mom_growth_pct
  FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.DESIGNER_LATEST_VERSION_ADOPTION_MONTHLY_VIEW
  ORDER BY MONTH DESC
  LIMIT 100
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters: []
depends_on: []
related_metrics:
- version_adoption_004
- version_adoption_013
maintainer: analytics@alteryx.com
tags:
- adoption
- version_adoption
