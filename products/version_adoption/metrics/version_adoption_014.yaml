id: version_adoption_014
name: Designer Supported User Percentage Monthly
description: Monthly percentage of Designer users running a supported product version
product: version_adoption
status: validated
category: adoption
definition:
  business: User-level support health metric showing coverage of support obligation
  technical: From DESIGNER_SERVER_SUPPORTED_UNSUPPORTED_USERS_PERCENTAGE_VIEW
source:
  database: DISCOVERY_PRODUCT_MANAGEMENT
  schema: METRIC_STORE
  base_tables: []
sql_template: "SELECT\n    DATE(MONTH) AS MONTH,\n    COUNT(DISTINCT CASE WHEN PRODUCT_ID\
  \ = 'Alteryx Designer'\n                         AND \"Supported_Unsupported\" =\
  \ 'Supported'\n                        THEN USER_ID ELSE NULL END)\n        / NULLIF(COUNT(DISTINCT\
  \ CASE WHEN PRODUCT_ID = 'Alteryx Designer'\n                        THEN USER_ID\
  \ ELSE NULL END), 0) AS DESIGNER_PCT_SUPPORTED,\n    COUNT(DISTINCT CASE WHEN PRODUCT_ID\
  \ = 'Alteryx Server'\n                         AND \"Supported_Unsupported\" = 'Supported'\n\
  \                        THEN USER_ID ELSE NULL END)\n        / NULLIF(COUNT(DISTINCT\
  \ CASE WHEN PRODUCT_ID = 'Alteryx Server'\n                        THEN USER_ID\
  \ ELSE NULL END), 0) AS SERVER_PCT_SUPPORTED\nFROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.PRODUCT_VERSION_ADOPTION\n\
  WHERE PRODUCT_ID IN ('Alteryx Designer', 'Alteryx Server')\n  AND MONTH >= DATE_TRUNC('MONTH',\
  \ DATEADD('MONTH', -6, CURRENT_DATE))\nGROUP BY MONTH\nORDER BY MONTH DESC;"
queries: []
aggregation_level: monthly
grain: monthly
freshness: daily
filters:
- MONTH >= DATEADD('MONTH', -12, CURRENT_DATE())
depends_on: []
related_metrics:
- version_adoption_003
- version_adoption_011
maintainer: analytics@alteryx.com
