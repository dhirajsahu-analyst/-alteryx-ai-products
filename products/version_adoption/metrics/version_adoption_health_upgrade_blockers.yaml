id: version_adoption_health_upgrade_blockers
name: Version Adoption - Health - Upgrade Blockers
description: Count of upgrade blockers
product: version_adoption
category: health
status: active
freshness: daily
grain: point_in_time
definition:
  business: Count of upgrade blockers
  technical: Count of distinct entities meeting upgrade_blockers criteria from version
    adoption data sources.
source: VERSION_ADOPTION_METRIC_VIEW
tables:
- DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.VERSION_DEPLOYMENT_AT
sql_template: "WITH base_metrics AS (\n    SELECT\n        DISTINCT CASE\n       \
  \     WHEN UPGRADE_BLOCKERS IS NOT NULL THEN 1\n            ELSE 0\n        END\
  \ AS is_active\n    FROM DISCOVERY_PRODUCT_MANAGEMENT.METRIC_STORE.VERSION_DEPLOYMENT_AT\n\
  \    WHERE CREATED_AT >= DATEADD(day, -30, CURRENT_DATE())\n)\nSELECT\n    COUNT(*)\
  \ AS upgrade_blockers\nFROM base_metrics\nWHERE is_active = 1"
tags:
- health
- health
maintainer: product-insights@alteryx.com
last_updated: '2026-08-04'
version: '1.0'
